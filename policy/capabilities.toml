[[capabilities]]
id = "ai-explore"
phase = "discover"

[[capabilities.modes]]
id = "default"
read_roots = ["."]
write_roots = []
exec_allowlist = [{ executable = "git", argument_pattern = "read-only" }]
network = []
secrets = []
human_gate = "never"
enforcement = ["preflight.read", "preflight.exec"]
proof_requirements = { allow = ["ai-explore.default.allow"], deny = ["ai-explore.default.deny"], installed_artifact = true }

