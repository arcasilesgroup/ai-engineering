[[capabilities.modes]]
id = "intent"
# It reads the records and writes one page from them. No network, no secrets, no keyboard:
# the page asserts nothing a person has to agree to, and a human gate on a document
# generated from committed files would be a ceremony that teaches people to click through.
#
# Its sibling `digest` gates before_write over `.ai/reports`, which is gitignored, while this
# writes a committed file and does not. That reads backwards side by side, so the reason is
# here rather than inferred: the gate on this one is `just check`, which compares the page to
# what the tree renders on every run and fails closed. A keyboard confirms intent; a byte
# comparison confirms the result, and the result is what a committed file is judged on.
read_roots = ["."]
write_roots = ["docs"]
exec_allowlist = [{ executable = "git", argument_pattern = "repository.read" }]
network = []
secrets = []
human_gate = "never"
enforcement = ["preflight.read", "preflight.write", "preflight.exec"]
proof_requirements = { allow = ["ai-report.intent.allow"], deny = ["ai-report.intent.deny"], installed_artifact = true }

[[capabilities.modes]]
id = "blocked"
# One row appended to one committed file, written by a run that is about to stop. No network,
# no secrets, and no keyboard — which is the whole point rather than an oversight: a human
# gate on the record that says a human is needed would have to be cleared by the person who
# has not seen it yet, and the run cannot wait for them. That is the deadlock specification
# 020 exists to remove, so gating this would reintroduce it in the one place it must not be.
#
# It grants nothing. A row states a gate that was reached and what is missing; nothing here
# can record that the missing thing arrived, so a run cannot write itself an approval.
#
# `docs`, not `.`, and the manifest is what found it: two modes of one capability may not
# carry the same permissions, and the first draft of this row was a copy of `intent`'s. The
# schema was right. `intent` renders the whole tree and needs to read all of it; this reads
# one file and writes it back, so declaring the tree would have been a permission taken for
# symmetry rather than for a use.
#
# The empty `exec_allowlist` is the same finding, traced rather than assumed: an audit hook
# over a real run shows this verb launches no subprocess at all, because `paths.repo_root` is
# a filesystem walk for `.git` and not a git invocation. The git entry was copied from
# `intent`, which does need it, and it dragged `preflight.exec` in behind it — an enforcement
# point for an action that never happens.
#
# `human_gate = "never"` is argued rather than defaulted, and the argument is narrower than
# the write root. Gating the record that says a human is needed on that same human is
# circular, and it is the deadlock this specification exists to remove. But `docs` is the
# finest grain the schema offers and this mode may therefore write any file under it, so the
# compensating control is named here rather than implied: what this verb writes is refused
# unless all four fields say something a reader can act on — placeholders included — and the
# page that renders the file is byte-compared against the tree on every `just check`. The
# refusal is in `blocked._usable`; the comparison is `solution_intent.staleness`.
read_roots = ["docs"]
write_roots = ["docs"]
exec_allowlist = []
network = []
secrets = []
human_gate = "never"
enforcement = ["preflight.read", "preflight.write"]
proof_requirements = { allow = ["ai-report.blocked.allow"], deny = ["ai-report.blocked.deny"], installed_artifact = true }

