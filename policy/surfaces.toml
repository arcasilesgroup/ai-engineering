# The wiring table. One row per surface. Everything that writes, reads, protects or
# reports a surface derives from this file: the installer, self_protect's write-deny
# list, doctor's coverage line and the uninstaller. It cannot fall behind the wiring
# because there is nowhere else for the wiring to live.
#
# tier   T2 = can deny a tool call · T3 = instructions and skills only
# writer json_claude · json_cursor · json_copilot · json_codex · ts_opencode · none
# There is no `proven` column. There was, and it was a thing we typed: OpenCode's row
# said true with no denial ever executed there, and a flag we set cannot contradict
# us. Whether a denial has executed is read from that surface's enforcement receipt,
# and this file has no way to say it.

[[surface]]
id = "claude-code"
name = "Claude Code"
tier = "T2"
detect = "~/.claude"
settings = "~/.claude/settings.json"
writer = "json_claude"
skills = "~/.claude/skills"
note = "Exit code 2 denies, even under bypassPermissions."

[[surface]]
id = "opencode"
name = "OpenCode"
tier = "T2"
detect = "~/.config/opencode"
settings = "~/.config/opencode/plugins/ai-engineering.ts"
writer = "ts_opencode"
skills = "~/.config/opencode/skills"
heartbeat = true
note = "A throw in tool.execute.before kills the call. A malformed plugin is dropped silently, so the guard writes a load heartbeat and doctor asserts it. Only tool.execute.before is wired, so PostToolUse containment does not exist here and tool results are unscanned."

[[surface]]
id = "codex-cli"
name = "Codex CLI"
tier = "T2"
detect = "~/.codex"
settings = "~/.codex/hooks.json"
writer = "json_codex"
skills = "~/.agents/skills"
append_only = true
trust_required = true
note = "Trust is a hash of the whole handler plus its position. Append only, never reorder. An untrusted hook is skipped silently; only a human can approve it with /hooks."

[[surface]]
id = "cursor"
name = "Cursor"
tier = "T2"
detect = "~/.cursor"
settings = "~/.cursor/hooks.json"
writer = "json_cursor"
skills = "~/.agents/skills"
note = "Deny is real but fails OPEN unless failClosed is true. Reply fields are snake_case."

[[surface]]
id = "copilot-cli"
name = "Copilot CLI"
tier = "T2"
detect = "~/.copilot"
settings = "~/.copilot/hooks/ai-eng.json"
writer = "json_copilot"
skills = "~/.agents/skills"
note = "preToolUse of the command kind. Merged with five other sources, never replacing them. Fail-closed on a crash, fail-open on a timeout."

[[surface]]
id = "vscode-copilot"
name = "VS Code Copilot"
tier = "T2"
detect = ""
settings = "~/.claude/settings.json"
writer = "none"
skills = "~/.agents/skills"
note = "Reads the same settings file as Claude Code, so it needs zero wiring. Detected by nothing: its old detect path was that settings file, which our own Claude Code writer creates, so wiring Claude Code made this row report itself installed. VS Code's own user directory is not one path across platforms, so this row is wired by name — `--harness vscode-copilot` — or not at all. Preview: it parses matchers then ignores them, and sends camelCase payload keys. The dispatcher normalises both."

[[surface]]
id = "pi"
name = "pi"
tier = "T3"
detect = "~/.pi"
settings = ""
writer = "none"
skills = "~/.pi/agent/skills"
note = "Has a hook API. Not measured this round, so it claims nothing."

[[surface]]
id = "zed"
name = "Zed"
tier = "T3"
detect = "~/.config/zed"
settings = ""
writer = "none"
skills = "~/.agents/skills"
note = "Free by convention, zero lines. Detected by its own settings directory and not by ~/.agents, which is the shared skills root four other rows are linked into: wiring Cursor created it, and this row then reported Zed installed on a machine that has never had Zed. On Windows Zed keeps that directory elsewhere, so there it is wired by name."

# Anything else that reads AGENTS.md gets the doctrine and the skills through
# ~/.agents/skills and enforces nothing above the git layer. That is T3, and it is
# the honest label.

# Surfaces this framework deliberately does not claim, and why. A refusal that lives only
# in a specification's non-goals is a refusal no command can read, and the next person to
# add a row has nothing to argue with — so the argument lives here, beside the rows it is
# an argument about. `tests/test_surface_adapter.py` reads this: an id may not appear both
# here and above, and a row with no reason is an error rather than a preference.
[[refused]]
id = "codex-app"
name = "Codex, the hosted application"
reason = "It runs somebody else's machine. Nothing here can place a skill on it, register a guard in it, or read a receipt back out of it, so every state this framework reports would be a claim about a surface it cannot reach. The CLI of the same name is a different program and has its own row above."
reopen_when = "the hosted application exposes a settings file or an API this framework can write a guard entry into, and read a denial receipt back from"

[protect]
# self_protect denies writes against these, and against every settings file and skills
# root in the table above, which it derives rather than repeats. Seven literals lived
# here and duplicated that derivation; two skills roots the installer writes into were
# in neither list, so they were protected by nobody. Paths are expanded at read time.
paths = [
  "~/.ai-engineering/",
  ".git/hooks/",
  ".ai/config.toml",
]
