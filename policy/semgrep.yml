# Our own rules, pinned here: a gate that fetches its policy at run time is a gate
# somebody else can change, which also rules out a registry pack. A rule that forbids
# something in every language and is declared for one scans zero targets elsewhere.

rules:
  - id: suppression-comment
    languages: [generic]
    severity: ERROR
    message: >-
      Silencing the linter hides the finding rather than answering it. Refactor, or record
      an accepted risk with ai-eng accept. Rule 3 is not about one language.
    # `pragma: no cover` and `fmt: off` were missing and they are the two that matter most
    # here: the first is invisible to `just cover`'s floor, so a guard's deny path can stop
    # being measured without the number moving, and the second silences the formatter whose
    # file count is the proof-of-work `just counts` prints.
    pattern-regex: '#\s*(noqa|nosec|type:\s*ignore|fmt:\s*off|pragma:\s*no\s*cover)|//\s*(@ts-ignore|nolint|NOSONAR|eslint-disable|swiftlint:disable)|@SuppressWarnings|#pragma\s+warning\s+disable|#\s*rubocop:disable|//\s*phpcs:ignore'
    paths:
      # `generic` is deliberate — a rule that forbids something in every language and is
      # declared for one scans zero targets elsewhere. The cost of `generic` is that it
      # matches inside prose as readily as inside code, and this repository's prose is
      # largely *about* suppressions: a specification arguing why `# type: ignore` is
      # refused failed the security gate for containing the phrase it was refusing. A
      # suppression is only a suppression where a linter reads it, so the documentation
      # homes are out of scope. Excluding them narrows where the rule looks and never what
      # it forbids; no source file is excluded here.
      exclude:
        - "policy/semgrep.yml"  # a rule cannot be scanned by itself
        - "specs/"
        - "docs/"
        - "CHANGELOG.md"
        - "AGENTS.md"
        - "CONSTITUTION.md"
        - "README.md"
        - ".ai/"

  - id: shell-with-user-string
    languages: [python]
    severity: ERROR
    message: A shell string built from a variable. Pass a list of arguments instead.
    patterns:
      - pattern: subprocess.$M(..., shell=True, ...)

  - id: tilde-in-config-value
    languages: [generic]
    severity: ERROR
    message: >-
      No agent surface documents expanding ~ inside a setting value, and a tilde in
      core.hooksPath saves fine and fires nothing. Write the expanded absolute path.
      Declared generic because the files this happens in are JSON and TOML, not Python —
      as python it never once fired on the thing it was written for. It matches the two
      keys whose value we hand to git or to a surface, and not `settings`, which is how
      policy/surfaces.toml declares a path for expand() to resolve.
    pattern-regex: '(hooksPath|command)["\s:=]+["'']~/'
