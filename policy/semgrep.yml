# Our own rules, pinned here: a gate that fetches its policy at run time is a gate
# somebody else can change. No `p/` pack for the same reason — semgrep does not cache
# registry rules — and trivy's misconfig scanner buys the Terraform and Kubernetes ground
# instead. A rule that forbids something in every language and is declared for one scans
# zero targets elsewhere, so those two are `generic`.

rules:
  - id: guard-exits-zero
    languages: [python]
    severity: ERROR
    message: >-
      A guard that exits zero without having decided reports "no objection, go ahead".
      That is the root pattern this framework exists to cure. Raise, or exit 2.
    patterns:
      - pattern-inside: |
          @guard(...)
          def $F(...):
            ...
      - pattern: sys.exit(0)

  - id: suppression-comment
    languages: [generic]
    severity: ERROR
    message: >-
      Silencing the linter hides the finding rather than answering it. Refactor, or record
      an accepted risk with ai-eng accept. Rule 3 is not about one language.
    pattern-regex: '#\s*(noqa|nosec|type:\s*ignore)|//\s*(@ts-ignore|nolint|NOSONAR|eslint-disable|swiftlint:disable)|@SuppressWarnings|#pragma\s+warning\s+disable|#\s*rubocop:disable|//\s*phpcs:ignore'
    paths:
      exclude: ["policy/semgrep.yml"]  # a rule cannot be scanned by itself

  - id: shell-with-user-string
    languages: [python]
    severity: ERROR
    message: A shell string built from a variable. Pass a list of arguments instead.
    patterns:
      - pattern: subprocess.$M(..., shell=True, ...)

  - id: tilde-in-config-value
    languages: [generic]
    severity: ERROR
    message: >-
      No agent surface documents expanding ~ inside a setting value, and a tilde in
      core.hooksPath saves fine and fires nothing. Write the expanded absolute path.
      Declared generic because the files this happens in are JSON and TOML, not Python —
      as python it never once fired on the thing it was written for. It matches the two
      keys whose value we hand to git or to a surface, and not `settings`, which is how
      policy/surfaces.toml declares a path for expand() to resolve.
    pattern-regex: '(hooksPath|command)["\s:=]+["'']~/'
