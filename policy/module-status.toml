# The status of every module that has no production caller, decided in one place.
#
# Data, not code: the reader is `wiring.module_status()` and the refusal suite is
# `tests/test_orphan_register.py`, both picked up by `just check`. A module with no status,
# a `consumer` whose file no production module imports (AST-verified), a status naming a
# consumer that does not exist, and an `orchestrator-future` row citing no orchestrator
# spec are all refused — the register cannot drift from the tree (spec 042 / B-042-3).
#
# Statuses:
#   consumer            — imported by a production file in src/ or hooks/ (AST, not prose).
#   orchestrator-future — an orchestrator instrument; the reason cites the spec that
#                         records the orchestrator (031/041) and that spec names the module.
#   deferred            — kept, tested, not wired, with the reason it exists.
#
# A production caller is an `import`/`from` statement binding the module — never a
# docstring mention, a comment, a prompt route or a sentence in a SKILL.md. Measured on
# this tree: `evidencing` appears in verify_cold.py's docstring and `trim` in
# loop_guard.py's comment, and neither is an import, which is exactly the false positive
# a text grep would count.

schema = "urn:ai-engineering:module-status:1"
schema_version = "1"

# --- consumer: imported by a production file ---

[[module]]
name = "model_router"
status = "consumer"
consumer = "src/ai_engineering/cli.py, src/ai_engineering/model_router.py"
reason = "spec 042 / B-042-1: cli.py imports it to record tier_model on every command event"

[[module]]
name = "revalidate"
status = "consumer"
consumer = "src/ai_engineering/audit.py"
reason = "spec 030 / B-030-3: audit.py --revalidate consumes it"

[[module]]
name = "cost"
status = "consumer"
consumer = "src/ai_engineering/audit.py"
reason = "spec 029 / B-029-4: audit.py's bounded-sample lane is gated by it"

# --- orchestrator-future: the orchestrator's instruments, per specs 031 and 041 ---

[[module]]
name = "lane_merge"
status = "orchestrator-future"
consumer = ""
reason = "spec 031 / B-031-1 and 041 record it as the orchestrator's verification-DAG merge; no orchestrator exists yet"

[[module]]
name = "loopgate"
status = "orchestrator-future"
consumer = ""
reason = "spec 031 / B-031-2 and 041 record it as the orchestrator's loop terminator; no orchestrator exists yet"

# --- deferred: kept, tested, not wired, with a reason ---

