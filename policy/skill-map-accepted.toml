# The map's accepted real broken references, as data (spec 026).
#
# docs/adr/0025 accepts a dated class of real broken references so the instrument's green
# is honest while they wait for their own repair block. That record names this file: it is
# the exact set of broken (node, target) pairs `sm check --json` reported (non-template)
# on the day the acceptance was written, so "accepted" means a real, verifiable list — a
# reference that is neither fixed nor in this file reddens the gate.
#
# Each entry is bound to BOTH the node that carries the link and the target it points at.
# Binding to the pair, not the bare target, is deliberate: a bare "SKILL.md" or "plan.md"
# as an accepted target would silently forgive any future link with the same bare name
# anywhere in the tree. Only the exact node+target recorded on the accept date is exempt.
# Adding a pair here extends the acceptance, which needs its own dated record (ai-eng
# accept); the follow-up repair is a separate spec named in ADR 0025.

