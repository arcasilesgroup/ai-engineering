[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-engineering"
version = "1.0.0"
description = "Governance framework for agents that write code."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Arcasiles Group" }]
keywords = ["agents", "governance", "hooks", "guardrails", "audit"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
# The first two this wheel has ever had, and the bounds are the ones the version before it
# shipped. They buy a theme, a width calculation that is right on east-asian text, and a
# checkbox — all three of which the alternative was writing again. They may be imported only
# under src/: the guards in hooks/ are executed by path on the hot path, where importing this
# package at all costs about 110 ms, and tests/test_contracts.py fails the build if one of
# them ever appears there. Five more arrive behind these two, and trivy, pip-audit and snyk
# are what stand between that and a governance tool with an advisory of its own.
dependencies = [
  "rich>=13.0,<16.0",
  "questionary>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/arcasilesgroup/ai-engineering"
Source = "https://github.com/arcasilesgroup/ai-engineering"
Security = "https://github.com/arcasilesgroup/ai-engineering/blob/main/SECURITY.md"

[project.scripts]
ai-eng = "ai_engineering.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_engineering"]

[tool.hatch.build.targets.wheel.force-include]
"hooks" = "ai_engineering/hooks"
"surfaces" = "ai_engineering/surfaces"
"git-hooks" = "ai_engineering/git-hooks"
"policy" = "ai_engineering/policy"
"migrations" = "ai_engineering/migrations"
".agents/skills" = "ai_engineering/skills"

[tool.hatch.build.targets.sdist]
include = ["src", "hooks", "surfaces", "git-hooks", "policy", "migrations", ".agents", "tests"]

[tool.mutmut]
# Only the package. mutmut runs the suite inside a `mutants/` copy and keys each mutant on
# the module path it imports under, and the guards are imported bare because they are
# executed by path and never as a package — that is the 110 ms this product refuses to
# spend on its own hot path. mutmut says so itself: "tests import the source under a
# different module path than mutmut sees". Making hooks/ a package to satisfy a test tool
# would slow every tool call in every session, so the guards get tests/mutation.py instead.
source_paths = ["src/ai_engineering"]
# The sandbox holds only source and tests, and this suite reads files: the skills, the
# wiring table, the git hooks, the doctrine. Without these the baseline run is red and
# mutmut reports nothing rather than reporting a survivor.
also_copy = [".agents", ".ai", ".github", "docs", "git-hooks", "hooks", "migrations", "policy",
             "specs", "surfaces", "AGENTS.md", "CHANGELOG.md", "CLAUDE.md", "CONSTITUTION.md",
             "LICENSE", "NOTICE", "README.md", "SECURITY.md", "justfile"]
# test_contracts.py is left out on purpose and not because it is inconvenient: it asserts
# the repository's own shape — the line ceiling, the doctrine's length, the skill contract
# — which no mutant of the product can change, and it counts lines with `git ls-files`,
# which the sandbox has no .git to answer.
# The directory, never a list of files. A list was here first and it silently excluded
# every test file added after it was written: six suites landed, killed 1,100 mutants
# between them, and the score did not move by one point until this line stopped naming
# names. A gate configured by enumeration reports the state of the enumeration.
pytest_add_cli_args_test_selection = ["tests", "--ignore=tests/test_contracts.py"]

[tool.pytest.ini_options]
# Both halves of the product on the path. The guards are deliberately not importable as
# part of the package — they are standard library Python executed by path, because on the
# hot path `import ai_engineering` costs about 110 ms — so the suite reaches them the way
# the dispatcher does. `conftest.py` used to do this with `sys.path.insert` and then import
# the package underneath, which is `E402`, and it carried an inline exemption comment to
# say so. AGENTS.md rule 3 is never to silence a linter; pytest has had this since 7.0.
pythonpath = ["src", "hooks"]

[tool.coverage.run]
# The guards run by path in a subprocess, so without patch the suite that fires every one
# of them counts for nothing and the reported number is half the truth. Branch, not line:
# a deny path is a branch, and a line count says only that the file was imported.
branch = true
parallel = true
patch = ["subprocess", "_exit", "execv"]
source = ["src", "hooks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
