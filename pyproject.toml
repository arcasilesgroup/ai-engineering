[project]
name = "ai-engineering"
version = "0.8.2"
description = "AI governance framework for secure software delivery"
authors = [{ name = "ai-engineering maintainers" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0,<1.0",
  "pyyaml>=6.0,<7.0",
  "pydantic>=2.0,<3.0",
  "keyring>=25.0,<26.0",
  "rich>=13.0,<15.0",
  "questionary>=2.0,<3.0",
  "ruamel-yaml>=0.18,<1.0",
  "packaging>=24.0,<27.0",
  # Transitive via typer; pinned to avoid CVE-2026-7246 (SNYK-PYTHON-CLICK-16347201)
  # Command injection in edit_files() shell=True; affects 8.2.0–8.3.2, fixed in 8.3.3.
  "click>=8.3.3,<9.0",
]

[project.optional-dependencies]
# spec-119 evaluation layer; opt-in via `uv sync --extra eval`. Kept out of the
# core deps so hook scripts and minimal CI lanes do not pay the deepeval
# transitive footprint (pydantic-extras, langchain shims, optional LLM grader
# stubs). Deterministic graders ship with the core extra; LLM graders are
# follow-up work and would land under a separate `eval-llm` extra.
eval = [
  "deepeval>=2.0,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=4.1,<8.0",
  "ruff>=0.6.0",
  "ty>=0.0.1a1",
  "pip-audit>=2.7.0",
  "types-pyyaml>=6.0,<7.0",
  "pytest-xdist>=3.5,<4.0",
  # spec-132 sub-005 D-132-13 — hexagonal direction contract enforcement.
  # ``lint-imports`` runs against ``[tool.importlinter]`` in this file and
  # is policed by ``tests/architecture/test_hexagonal.py``.
  "import-linter>=2.0,<3.0",
]

# === USER CONFIGURATION: Enterprise Artifact Feed ===
#
# If your organization uses a private package feed (Azure Artifacts, JFrog
# Artifactory, Nexus), uncomment and configure the section below.
#
# This enables "distribution lock": ALL packages resolve from your private
# feed only — no fallback to public PyPI.
#
# Authentication: uses system keyring (cross-platform).
#   macOS:   Keychain Access
#   Windows: Credential Manager
#   Linux:   Secret Service (GNOME Keyring / KWallet)
#
# Setup:
#   1. Store credentials: keyring set <feed-url> <username>
#   2. Enable uv keyring: export UV_KEYRING_PROVIDER=subprocess
#   3. Uncomment ONE of the provider blocks below and fill in your values.
#
# In CI (no keyring available), use environment variables instead:
#   UV_INDEX_CORPORATE_USERNAME=<user>
#   UV_INDEX_CORPORATE_PASSWORD=<token>
#
# --- Azure Artifacts ---
# [[tool.uv.index]]
# name = "corporate"
# url = "https://pkgs.dev.azure.com/ORG/PROJECT/_packaging/FEED/pypi/simple/"
# default = true  # replaces PyPI as the default package source
#
# --- JFrog Artifactory ---
# [[tool.uv.index]]
# name = "corporate"
# url = "https://COMPANY.jfrog.io/artifactory/api/pypi/REPO/simple/"
# default = true  # replaces PyPI as the default package source
#
# --- Nexus Repository ---
# [[tool.uv.index]]
# name = "corporate"
# url = "https://nexus.company.com/repository/REPO/simple/"
# default = true  # replaces PyPI as the default package source
#
# IMPORTANT: Do NOT add a pypi.org entry. Omitting it enforces distribution
# lock — uv will only resolve from your private feed.
#
# === END USER CONFIGURATION ===

[project.scripts]
ai-eng = "ai_engineering.cli:app"
# spec-127 M1: conformance lint over SKILL.md + agent .md files.
# Top-level package names per D-127-13 (PEP 8 underscore naming).
skill_lint = "skill_lint.cli:main"
# spec-128 sub-d: repo-wide anti-suppression gate (CONSTITUTION.md Article VII).
no_suppression = "no_suppression.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures/**/*.json"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# D-135-13 — `.ai-engineering/scripts/spec_lifecycle.py` is invoked via
# `#!/usr/bin/env python3` from hooks; on macOS that shebang resolves to
# system Python 3.9, where `datetime.UTC` does not exist. UP017 would force
# the 3.11-only alias and crash the spec lifecycle bootstrap during
# `/ai-brainstorm` and `/ai-spec-draft`. The script uses `timezone.utc` so it
# remains 3.9-importable; the regression is guarded by
# `tests/unit/scripts/test_spec_lifecycle_python_compat.py`.
".ai-engineering/scripts/spec_lifecycle.py" = ["UP017"]
# spec-153 W4 — the install template MUST stay byte-identical to the canonical
# script above (clients run it via the same `#!/usr/bin/env python3` shebang and
# need the same 3.9 `timezone.utc` compat). Byte-parity is the install contract,
# so the same UP017 ignore applies to the template copy.
"src/ai_engineering/templates/.ai-engineering/scripts/spec_lifecycle.py" = ["UP017"]

[tool.ruff.lint.isort]
known-first-party = [
  "ai_engineering",
  "skill_domain",
  "skill_app",
  "skill_infra",
  "skill_lint",
  "no_suppression",
]

# spec-132 D-132-12 — Renderer is the single source of truth for CLI output.
# Direct imports of the four legacy output modules
# (``ai_engineering.cli_envelope`` / ``cli_ui`` / ``cli_progress`` / ``cli_output``)
# from ``src/ai_engineering/cli_commands/`` are scoped-banned and policed by
# ``tests/conformance/test_renderer_banned_imports.py``.
#
# We deliberately do NOT enable ``flake8-tidy-imports.banned-api`` here: that
# rule applies globally and the renderer itself (in ``core/output/renderer.py``)
# legitimately wraps the four modules. The conformance test scopes the ban to
# the cli_commands/ directory, which is the precise boundary D-132-12 mandates.
#
# Sub-002 wave (this commit): conformance test starts in baseline+regression
# mode (count must not increase from 59).
# Sub-004 wave (next): after migration to the Renderer, the baseline drops to
# 0 and the conformance test becomes a strict ban. No ``pyproject.toml`` edit
# is required at that boundary — the migration commit only updates
# ``EXPECTED_VIOLATIONS_BASELINE`` in the conformance test.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m 'not slow'"
# spec-127 M1: expose ``tools/`` so ``skill_domain``, ``skill_app``,
# ``skill_infra``, and ``skill_lint`` import as top-level packages
# without a project-root ``tools/__init__.py`` (which would make
# ``tools`` a namespace package and shadow other tooling).
pythonpath = ["src", "tools", ".ai-engineering/scripts/skills"]
markers = [
  "unit: Pure logic tests, no I/O, fast (<1s per test)",
  "integration: Tests with local I/O (filesystem, git)",
  "e2e: End-to-end flows (install, CLI, hooks)",
  "live: External API tests (requires AI_ENG_LIVE_TEST=1)",
  "perf: Performance benchmarks (spec-104 G-1/G-2/G-3); CI nightly only, opt-in via -m perf",
  "spec_105_red: spec-105 RED tests; excluded by default until corresponding GREEN phase commits",
  "spec_106_red: spec-106 RED tests; excluded by default until corresponding GREEN phase commits",
  "spec_107_red: spec-107 RED tests; excluded by default until corresponding GREEN phase commits",
  "eval: spec-119 evaluation layer unit/integration tests; opt-in via -m eval",
  "eval_slow: spec-119 eval tests that load deepeval graders; opt-in via -m eval_slow; requires `uv sync --extra eval`",
  "slow: marks tests as slow (concurrent stress, real I/O); deselected by default",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
# Override transitive urllib3 (pulled via requests / pip-audit / others).
# CVE-2026-44431 + CVE-2026-44432 affect 2.6.3; 2.7.0 carries the fix.
# Override transitive idna (pulled via requests/httpx) to avoid
# CVE-2026-45409; 3.15 is the current PyPI release as of 2026-05-12.
override-dependencies = [
  "urllib3>=2.7.0",
  "idna>=3.15",
]

# spec-132 sub-005 D-132-13 — Hexagonal direction contract.
#
# Pragmatic scope (orchestrator decision): physical mass relocation of the
# flat ``src/ai_engineering/`` tree into ``core/`` and ``adapters/<surface>/``
# is DEFERRED to a follow-up spec. This contract enforces the DIRECTION
# conceptually over the existing flat tree: modules grouped under ``core``
# are forbidden from importing modules grouped under ``adapters``. New code
# that violates the direction fails CI immediately, regardless of physical
# layout.
#
# Layer membership rationale:
#   - ``core``     = pure-domain modules (governance, state, policy,
#                    validator) + the relocated ``ai_engineering.core``
#                    tree from prior sub-spec waves. Note: ``decisions``
#                    lives inside ``governance.decision_log``;
#                    ``spec_lifecycle`` lives outside the package under
#                    ``.ai-engineering/scripts/`` and is not gated here.
#   - ``adapters`` = delivery surfaces (Typer command callbacks, installer
#                    phases, vcs/gh adapters, ide wirings, updater flow,
#                    issues GitHub-sync adapter).
# Modules NOT in either layer (e.g., ``cli_envelope``, ``cli_ui``,
# ``cli_progress``, ``cli_output``, ``cli_factory``, ``cli``, ``cli_preflight``,
# ``config``, ``credentials``, ``git``, ``hooks``, ``release``, etc.) are
# transitional shared utilities; they ride for free until a follow-up spec
# classifies them. The contract DELIBERATELY does not gate them.
#
# Enforcement: ``uv run lint-imports`` and
# ``tests/architecture/test_hexagonal.py``.
[tool.importlinter]
root_packages = ["ai_engineering"]

[[tool.importlinter.contracts]]
name = "core must not import from adapters (spec-132 D-132-13)"
type = "forbidden"
source_modules = [
  "ai_engineering.core",
  "ai_engineering.governance",
  "ai_engineering.state",
  "ai_engineering.policy",
  "ai_engineering.validator",
]
forbidden_modules = [
  "ai_engineering.cli_commands",
  "ai_engineering.installer",
  "ai_engineering.vcs",
  "ai_engineering.ide",
  "ai_engineering.updater",
  "ai_engineering.issues",
]
# Baseline of pre-existing direction violations recorded at spec-132
# sub-005 land time. The contract BLOCKS any NEW violation; the baseline
# entries below are the legacy entanglements the follow-up relocation
# spec will untangle. Each ``ignore_imports`` line names the precise
# source -> target edge that import-linter would otherwise flag. Adding
# new entries is forbidden without an explicit decision row.
ignore_imports = [
  # Renderer (core/output) wraps the legacy cli_ui module which itself
  # imports updater.service.show_status_after_install. The Renderer
  # migration deferred elimination of this edge to a follow-up spec
  # alongside the cli_ui retirement (D-132-12 wrapper-not-replacement).
  "ai_engineering.cli_ui -> ai_engineering.updater.service",
  # updater.service still inlines installer template helpers. The
  # follow-up "mass relocation" spec will split these into ports.
  "ai_engineering.updater.service -> ai_engineering.installer.templates",
  # policy.checks.stack_runner shells out to installer launchers (the
  # OS-launcher abstraction that the installer owns). This edge will
  # invert once stack_runner depends on a launcher port instead.
  "ai_engineering.policy.checks.stack_runner -> ai_engineering.installer.launchers",
  # validator._shared resolves template paths during file-existence
  # checks. Will invert once a template-path port is introduced.
  "ai_engineering.validator._shared -> ai_engineering.installer.templates",
]

[tool.hatch.build.targets.wheel]
# spec-127 M1: top-level conformance lint packages live under ``tools/``
# but ship as top-level distribution packages (``skill_domain``,
# ``skill_app``, ``skill_infra``, ``skill_lint``) per D-127-13.
packages = [
  "src/ai_engineering",
  "tools/skill_domain",
  "tools/skill_app",
  "tools/skill_infra",
  "tools/skill_lint",
  "tools/no_suppression",
]
include = [
  "src/ai_engineering/templates/**/*.md",
  "src/ai_engineering/templates/**/*.yml",
  "src/ai_engineering/templates/**/*.json",
  "src/ai_engineering/version/registry.json",
]
