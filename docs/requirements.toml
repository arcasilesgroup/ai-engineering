# ─────────────────────────────────────────────────────────────────────────────────────────
# The 26 process commitments from `.ai/reports/process-optimization-research/index.html`.
#
# The product requirements above are about what the wheel does. These are about how work
# happens here — the cadence, the review discipline, what a commit may claim. Their status
# lived only in prose in `docs/audit-2026-08-16.md` until now, which is exactly the shape
# that let 86 product requirements be published as proven without evidence.
#
# Measured on 2026-08-17 by one independent read-only auditor, under the same rule: a verdict
# comes from something executed, and a test whose name matches a commitment is not evidence
# until you break it and watch it go red. It graded this session's own work, and two of its
# findings are corrections to claims made in this repository hours earlier. Those are in the
# rows, not softened around them.
# ─────────────────────────────────────────────────────────────────────────────────────────

[[commitment]]
id = "PO-01"
verdict = "INCOMPLETE"
subject = "a block closes and freezes, and nothing later depends on it until an independent reviewer has cleared it"
evidence = "pytest tests/test_record.py::test_every_block_hand_off_carries_a_reviewer_a_repair_and_a_gate"
note = '''re-measured on 2026-08-19 and the reason this row carried was wrong. The audit said the workflow does not trigger on a push to this branch, so no CI had run on it at all; `check.yml` has run sixty-four times here since 2026-08-17 — 37 green, 22 red, 4 cancelled — the earliest the same day that sentence was written. The gap is real and its stated cause was not, which is worse than no explanation. Each hand-off now carries an `independent` row naming what a stranger can re-check, and for all three it is the same checkable fact: no run exists at that block's final HEAD, because they closed before the first one. The reader refuses a blank one. What keeps this open is unchanged and unreachable by any command: whether the freeze held while the reviewer read.'''

[[commitment]]
id = "PO-02"
verdict = "PROVEN"
subject = "review by capability block plus one final review, not a reviewer after every task"
evidence = "grep -n '## Block checkpoint and review protocol' specs/010-governed-agentic-engineering-foundation/plan.md"

[[commitment]]
id = "PO-03"
verdict = "PROVEN"
subject = "each task still gets its own atomic commit and its own named focal test"
evidence = "sed -n '161,164p' specs/010-governed-agentic-engineering-foundation/plan.md"

[[commitment]]
id = "PO-04"
verdict = "INCOMPLETE"
subject = "the per-task checkpoint commit is atomic and revertible, and is labelled unreviewed"
evidence = "git log --oneline --all --grep=UNREVIEWED"
note = "the rule is written and revertibility is structurally true of every task entry. The label appears once in the whole history, on an audit-doc commit, and never on a task checkpoint — so it marks nothing it was meant to mark"

[[commitment]]
id = "PO-05"
verdict = "UNFALSIFIABLE"
subject = "the writer continues to the next related task without waiting for a reviewer or the full gate"
evidence = "git log --format='%h %ad %s' --date=iso-strict -- specs/010-governed-agentic-engineering-foundation/plan.md"
note = "git records commit times, not reviewer-availability windows, so nothing distinguishes a writer who continued immediately from one who waited and continued anyway"

[[commitment]]
id = "PO-06"
verdict = "INCOMPLETE"
subject = "an independent read-only reviewer inspects every commit in a closed block and the accumulated diff"
evidence = """pytest tests/test_record.py::test_every_block_hand_off_carries_a_reviewer_a_repair_and_a_gate; test -n "$(gh run list --branch "$(git branch -r --contains HEAD --format='%(refname:lstrip=3)' | head -1)" --limit 1 --json databaseId --jq '.[].databaseId')\""""
note = '''the reader bites on a blank reviewer field, and the clause that kept this open was measured against the wrong branch. It named `fix/mutation-lane-green-on-main`, which this work left and which has never had a single run — so "no CI has ever run on this branch" was true of a branch nobody was on. The command now resolves the branch that actually contains HEAD, and on it the gate has run and the last completed pair is green at 97cce08b. What stays prose is the part no command reaches: whether the reviewer was independent and read the whole range.'''

[[commitment]]
id = "PO-07"
verdict = "PROVEN"
subject = "the gate runs once per block, and a second time only if the first failed and code changed"
evidence = """gh run list --branch "$(git branch -r --contains HEAD --format='%(refname:lstrip=3)' | head -1)" --workflow=check.yml --limit 100 --json headSha | jq -r '.[].headSha' | sort | uniq -d"""
note = "measured remotely instead of asserted, because the branch it was graded against had never run CI at all. On this branch the gate ran 24 times over 24 distinct head commits and not one commit was gated twice — and a commit gated twice on the same tree is the only thing the rule forbids, since code changing produces a new sha. The command above prints nothing, which is the whole of the finding"

[[commitment]]
id = "PO-08"
verdict = "PROVEN"
subject = "a final review at the wave's close covers integration, authority, renames, readiness and an exact gate run"
evidence = "grep -n 'The final review covers Spec 010 traceability' specs/010-governed-agentic-engineering-foundation/plan.md"

[[commitment]]
id = "PO-09"
verdict = "PROVEN"
subject = "the specification stays draft until a candidate proves its own exact-HEAD receipts"
evidence = "grep -n '^status:' specs/010-governed-agentic-engineering-foundation/spec.md; gh api repos/arcasilesgroup/ai-engineering/commits/$(git rev-parse HEAD)/check-runs"
note = "spec 010 is still draft, and the half that could not be shown now can: this branch has a pull request and a run against its exact head, so which lanes are red and why is a remote fact rather than prose. Twelve checks pass on this head and one blocks — CI Result, on missing SAST evidence from an expired credential, which is the aggregate refusing to call a lane that scanned nothing a lane that found nothing"

[[commitment]]
id = "PO-10"
verdict = "INCOMPLETE"
subject = "the removed practices stay removed: per-task review, per-fix waiting, the gate after every task"
evidence = "git log --format='%h %(trailers:key=Ai-Eng-Ran,valueonly)' main..HEAD"
note = '''a commit now carries `Ai-Eng-Ran: <suite> content=<digest>` when, and only when, a suite is on record against exactly the bytes that commit ships. The trailer is absent by default and withdrawn by any edit after the run, so a commit without one means nobody ran anything — which is the reading this row wanted and had no way to take. What it still cannot say is whether a *removed* practice came back: the trailer records what ran, not what was skipped, and the history before this instrument existed carries none of them.'''

[[commitment]]
id = "PO-11"
verdict = "PROVEN"
subject = "an intermediate commit is never called done or a pass"
evidence = '''
! git log --oneline main..HEAD --format='%s' | grep -E '\bPASS\b' && ! git log --oneline main..HEAD --format='%s' | grep -iE '\bdone\b|approved'
'''

[[commitment]]
id = "PO-12"
verdict = "INCOMPLETE"
subject = "every commit's named focal test fails before the change and passes after it"
evidence = '''
python tests/red_then_green.py --since main
'''
note = "a runner walks every commit on the branch, lays the parent's `src` and `hooks` under that commit's new tests and reports four states. A commit that changed behaviour owes red; one that only added tests over unchanged code owes nothing and says PINS, because demanding red from a mutation-killing test is demanding that it fail against the code it was written to describe"

[[commitment]]
id = "PO-13"
verdict = "INCOMPLETE"
subject = "one bounded re-review: one consolidated ledger, one repair pass, one bounded second read"
evidence = "pytest tests/test_record.py::test_every_block_hand_off_carries_a_reviewer_a_repair_and_a_gate"
note = '''re-measured on 2026-08-19 and the reason this row carried was wrong. The audit said the workflow does not trigger on a push to this branch, so no CI had run on it at all; `check.yml` has run sixty-four times here since 2026-08-17 — 37 green, 22 red, 4 cancelled — the earliest the same day that sentence was written. The gap is real and its stated cause was not, which is worse than no explanation. Each hand-off now carries an `independent` row naming what a stranger can re-check, and for all three it is the same checkable fact: no run exists at that block's final HEAD, because they closed before the first one. The reader refuses a blank one. What keeps this open is unchanged and unreachable by any command: whether the freeze held while the reviewer read.'''

[[commitment]]
id = "PO-14"
verdict = "INCOMPLETE"
subject = "every commit runs the module's cheap immediate suite instead of the full gate"
evidence = "just quick ran_receipt; git log --format='%h %(trailers:key=Ai-Eng-Ran,valueonly)' main..HEAD"
note = '''both halves exist now. `just quick <module>` runs one module's suite and records `quick:<module>` against a digest of the bytes it ran over; `commit-msg` writes that into the commit only while the digest still matches, so `git log` answers which suite ran per commit and answers nothing at all where none did. The record line runs after the suite and a control holds that order, because a receipt written after a red suite is a false green with a digest on it. What keeps this INCOMPLETE is the history: the requirement is about every commit, and every commit before this instrument existed carries no trailer and never will.'''

