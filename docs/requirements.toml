# What is proven, what is not, and the command that decides each one.
#
# `docs/audit-2026-08-16.md` published "266 of 385 proven" and could not say which 266. Its
# second and third passes re-measured in bulk and named only the notable movements, so the
# counts were recorded and the membership was not. Nobody could read this repository and say
# which specific requirement was open. This file is that membership.
#
# Measured on 2026-08-17 at HEAD of `fix/mutation-lane-green-on-main` by four independent
# read-only auditors, one per range, each told the same thing: a verdict must come from
# something you executed, and a test whose name matches the requirement is not evidence until
# you break it and watch it go red.
#
# `evidence` is the command, not its output. A pasted result goes stale the day after it is
# pasted; a command can be re-run by whoever doubts the row. That is the whole point of the
# field and it is why the auditors' captured output is deliberately not copied in here.
#
# The vocabulary is closed. PROVEN: something ran that would fail if the requirement were
# unmet. INCOMPLETE: partly built, and the row says which half. NO-EVIDENCE: nothing in the
# tree addresses it. CONTRADICTED: the tree does the opposite, and here every instance is a
# recorded decision rather than an accident. BLOCKED: unreachable by construction, not by
# effort. UNFALSIFIABLE: the requirement names no observable, so no evidence could settle it.
#
# Read `tests/test_requirements_ledger.py` before editing: it holds this file to one row per
# id, a verdict from that vocabulary, and an evidence command on every row.

# Where the two numberings come from, and what can and cannot be checked about them.
#
# Neither `EP-nnn` nor `PO-nn` appears in the source documents. Both are this audit's own
# index, assigned by reading prose in document order. Measured on 2026-08-17: the evolution
# proposal carries 32 evidence-type spans, 88 list items and 62 third-level headings, and the
# process research carries 55 list items and 9 headings. Nothing in either counts to 385 or to
# 26. The two totals are a reading, not a count, and no command can re-derive them — which is
# the likeliest explanation for the sixty ids the fourth pass found with no locatable text:
# the numbering may simply have been finer than the prose.
#
# And the documents are not in this repository. `.ai/.gitignore` begins with `*`, so the whole
# directory is disposable by design except the pin — which means nobody who clones this can
# re-derive any of it, and the ledger below is the only in-tree record of what the two reports
# asked for. That is a property of the tree's layout and not an accident, but it is worth
# saying out loud beside the numbers it makes uncheckable.
#
# What is checkable is provenance: these are the exact bytes the ledger was measured against.
# `tests/test_requirements_ledger.py` verifies them where the file is present and says it
# cannot decide where it is not, rather than passing over an absence.
