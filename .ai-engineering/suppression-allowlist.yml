# Suppression allowlist (CONSTITUTION.md Article VII enforcement).
#
# Every entry below is a TIME-BOXED exception to the no-suppression rule.
# `no_suppression` (tools/no_suppression) scans the repo and blocks any
# suppression marker whose (path, pattern, rule_target) tuple is not
# covered by an active, non-expired entry in this file.
#
# Lifecycle:
# 1. Open a DEC via `ai-eng risk accept --finding-id <rule> ...` whenever
#    possible so the binding lives in `state.db::risk_acceptances`.
# 2. Add an entry below that references the DEC id (`dec_id:`) so the gate
#    can verify the DEC status (active + not expired) at scan time.
# 3. Renew via `ai-eng risk renew` before `expires_at`; otherwise the
#    gate flips the entry to `expired` and blocks the next commit.
#
# Schema (per entry):
#   path:           glob matching the file(s) carrying the suppression.
#   rule:           bypassed analyser rule. Use ``*`` to wildcard, or an
#                   exact code like ``python:S5852`` for precise binding.
#   pattern:        marker family — must match a ``rule_id`` from the
#                   scanner (see `tools/no_suppression/scanner.py`).
#                   Currently: nosonar | noqa | nosec | type_ignore |
#                              pragma_no_cover | ts_ignore | nolint_hash |
#                              nolint_slash | eslint_disable_hash |
#                              eslint_disable_slash | sonar_multicriteria |
#                              nosemgrep_hash (spec-141 M3 — Article VII parity).
#   justification:  WHY the bypass is required (full sentence).
#   spec_ref:       owning spec or DEC reference.
#   expires_at:     ISO-8601 expiry. Optional but recommended.
#   dec_id:         optional foreign key into state.db risk_acceptances.
#   severity:       informational; one of critical|high|medium|low.

