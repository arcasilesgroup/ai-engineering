# ai-engineering manifest (dogfood)
#
# This file holds USER configuration only. Framework-managed sections
# (skills, agents, control_plane, ownership.root_entry_points, prereqs,
# required_tools, tooling, hot_path_slos, session.context_files,
# contexts.precedence, python_env) are injected by the loader from
# `ai_engineering.config.framework_defaults`. Declare those sections
# here only when overriding a default.

schema_version: "2.0"
framework_version: "0.7.0"
name: ai-engineering
version: "1.0.0"

# Providers
# spec-128 D-128-09, D-128-11: stacks accepts bare-language tokens
# matching .ai-engineering/overrides/<stack>/ directory names.
providers:
  vcs: github
  stacks:
  - python

# Surfaces — unified AI Provider + IDE Integration axis (spec-133 D-133-16,
# spec-128 Wave 4 supersedes D-133-06/D-133-07: OpenCode + Cursor now activated
# with native skills at .{ide}/skills/<name>/SKILL.md, folder per skill).
# Closed enum: claude-code, codex, github-copilot, opencode, cursor,
# antigravity. Gemini CLI was retired pre-release in favor of Antigravity.
surfaces:
  enabled:
  - claude-code
  - codex
  - github-copilot
  - opencode
  - cursor
  - antigravity

# Work items — board/issue tracker integration (project-specific overrides)
work_items:
  provider: github
  azure_devops:
    area_path: "Project\\TeamName"
  github:
    team_label: "team:core"
  state_mapping:
    refinement: "Backlog"
    ready: "Ready"
    in_progress: "In progress"
    in_review: "In review"
    done: "Done"
  process_template: "github_projects_v2"
  custom_fields:
  - id: "PVTSSF_lADOC-uI1c4BQt9Azg-wcuM"
    name: "Priority"
    type: "single_select"
    options: ["P0", "P1", "P2"]
  - id: "PVTSSF_lADOC-uI1c4BQt9Azg-wcuQ"
    name: "Size"
    type: "single_select"
    options: ["XS", "S", "M", "L", "XL"]
  - id: "PVTF_lADOC-uI1c4BQt9Azg-wcuU"
    name: "Estimate"
    type: "number"
  - id: "PVTF_lADOC-uI1c4BQt9Azg-wcuY"
    name: "Start date"
    type: "date"
  - id: "PVTF_lADOC-uI1c4BQt9Azg-wcuc"
    name: "Target date"
    type: "date"
  github_project:
    owner: arcasilesgroup
    number: 4
    status_field_id: "PVTSSF_lADOC-uI1c4BQt9Azg-wcrY"
    status_options:
      refinement: "f75ad846"
      ready: "61e4505c"
      in_progress: "47fc9ee4"
      in_review: "df73e18b"
      done: "98236657"

# Quality gates
quality:
  coverage: 80
  duplication: 3
  cyclomatic: 10
  cognitive: 15

# Gate execution mode (spec-105 D-105-02): regulated | prototyping.
gates:
  mode: regulated

# Documentation auto-update
documentation:
  auto_update:
    readme: true
    changelog: true
    solution_intent: true

# CI/CD standards
# Set standards_url to your team's CI/CD documentation.
# /ai-pipeline reads this URL to generate compliant pipelines.
cicd:
  standards_url:

# Telemetry
telemetry:
  consent: strict-opt-in
  default: disabled

# spec-137 D-137-01 -- Event Relevance Discipline.
# Manifest-driven relevance contract enforced at the writer boundary
# (src/ai_engineering/state/relevance.py). Three layers:
#   1. kind_allowlist -- empty means "no restriction" (allow every
#      declared kind in ALLOWED_EVENT_KINDS). Operators shrink the
#      list to silence categories.
#   2. severity_floor -- per-kind severity floor (S0..S3, S0 highest
#      signal). Events at or above the floor pass; below the floor
#      drop, except when failure-emission asymmetry fires.
#   3. failure_emission=always -- a failure outcome (anything other
#      than "success" or "allow") emits regardless of the floor, so
#      failures never get silenced by the gate.
# Default block below preserves the existing behaviour for every
# emit site that has not yet been migrated to set severity
# explicitly; it raises the floor for the two noisiest categories
# (framework_operation, ide_hook) to S2 so future S3 debug-tier
# emissions can be added without re-touching the manifest.
audit_policy:
  kind_allowlist:
  - skill_invoked
  - agent_dispatched
  - context_load
  - ide_hook
  - framework_error
  - framework_operation
  - git_hook
  - control_outcome
  - task_trace
  - memory_event
  - eval_run
  - retention_applied
  - policy_decision
  severity_floor:
    default: S1
    framework_operation: S2
    ide_hook: S2
    framework_error: S0
  sampling:
    policy_decision_allow: 0.10
  failure_emission: always

# /ai-build operator defaults (spec-134 D-134-03).
# Reserved namespace: `no_hitl_default` is documentation-only today; the
# canonical gate for unattended single-concern builds is the `--no-hitl`
# flag. Flipping the default to `true` is out-of-scope for spec-134.
build:
  no_hitl_default: false

# /ai-brainstorm auto-spec gate (spec-134 D-134-04).
# The gate classifies the working-tree diff BEFORE interrogation begins;
# trivial changes route to the condensed-spec path, everything else
# enters full interrogation. `enabled: false` is the opt-out knob.
# `regulated_overrides` is substituted over `thresholds` when
# `gates.mode == "regulated"` (currently regulated by default).
brainstorm:
  auto_spec_gate:
    enabled: true
    thresholds:
      files: 3
      loc: 50
      cross_module: 1
    hard_triggers:
      public_api: true
      state_or_schema: true
      new_dependency: true
      security_surface: true
    regulated_overrides:
      files: 1
      loc: 20
      cross_module: 1
