# SonarCloud — the analysis the `sonarcloud` job in .github/workflows/check.yml feeds.
# The project is the same one this repository has used since the 0.x line, so the
# quality gate below is the gate those earlier analyses were graded by.
sonar.projectKey=arcasilesgroup_ai-engineering
sonar.organization=arcasilesgroup
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Sources and tests. The exclusions are payload this repository does not author line by
# line: the skill canon, the templates the binary embeds, node_modules, the binary's own
# build output, and the governance folder ai-eng writes into the checkout.
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/templates/**,**/skills/**,**/.ai-engineering/**,**/.github/**
sonar.cpd.exclusions=**/skills/**

# The lcov report the job writes before it scans (coverage is off in bunfig, so the job
# runs the suite against a config of its own — see the workflow).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Two files cannot carry a coverage number, and neither is excluded from analysis
# (bugs, smells, duplication and secrets rules still apply to both):
#  · src/cli.ts — the entrypoint. AGENTS.md fixes its contract: flags → verb → command
#    module, "logic lives in src/{…}, never in cli.ts". A file that only dispatches has
#    nothing to cover; its behaviour is covered through the verbs it calls.
#  · src/embedded.d.ts — type declarations, no executable line.
sonar.coverage.exclusions=src/cli.ts,src/embedded.d.ts

# One rule, excluded by name and with the reason next to it (the pattern the 0.x line
# used for python:S5852). typescript:S4036 fires on every subprocess this tool runs — git,
# gitleaks, bun, npm — because the PATH it hands them is the one the user has: "make sure
# PATH only contains fixed, unwriteable directories". That PATH is the product. ai-eng
# runs the developer's own tools in the developer's own environment, and pinning it would
# break the thing it exists for: gitleaks lives in /opt/homebrew/bin or ~/.local/bin, and
# the git it must respect is the one on the user's PATH. Excluded here, in the tree, where
# a reviewer can argue with it — not marked "Safe" twelve times in a web UI nobody reads.
sonar.issue.ignore.multicriteria=path
sonar.issue.ignore.multicriteria.path.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.path.resourceKey=src/**/*.ts

# The gate now blocks (wait=true). Every OVERALL condition passes: coverage 97.3%,
# duplicated lines 0.0%, reliability A, security A, maintenance A, hotspots 100%.
# The one failing condition — new-code maintainability rating D — came from the six
# functions over the cognitive-complexity limit (doctor.ts runChecks 227, uninstallMain
# 66, initMain 65, doctor.ts gc 36, configMain 16, init.ts surfaceHint 16) plus nested
# ternaries, all carried by a branch that counts the whole tree as new code (first
# TypeScript analysis against a baseline that only knew the Python line). Splitting
# those functions and flattening the ternaries clears it.
sonar.qualitygate.wait=true
