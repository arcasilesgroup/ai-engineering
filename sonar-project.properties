# SonarCloud, blocking. Written for this tree and not inherited from the last one: every
# exclusion the old file carried named a directory that does not exist here, and an
# exclusion that excludes nothing is a line somebody later mistakes for a decision.

sonar.projectKey=arcasilesgroup_ai-engineering
sonar.organization=arcasilesgroup
sonar.host.url=https://sonarcloud.io

# Blocking. The scan waits for the Quality Gate and the job fails when it is red.
# A scan that only uploads is a dashboard, and nobody is paged by a dashboard.
sonar.qualitygate.wait=true

# Both halves of the product. The old file analysed `src` alone because the guards did
# not exist yet; they are half of what ships and all of what can deny, so they are here.
# `surfaces/` and `git-hooks/` are left out because SonarCloud has no analyser for a
# 60-line TypeScript plugin's runtime or for shell hooks — they are covered by the
# adversarial suite instead, and a language Sonar cannot read produces zero findings
# whether the file is safe or not.
sonar.sources=src,hooks
sonar.tests=tests
sonar.python.version=3.11

# Coverage, produced by `just cover` and converted to Cobertura in the workflow.
# One file, because this repository has one coverage run, not three tiers.
sonar.python.coverage.reportPaths=coverage.xml

# The only exclusions that earn a line here: build output and tool sandboxes, none of
# which are source. `mutants/` is where `just mutate` copies the tree to deliberately
# corrupt it, so analysing it would report our own injected defects as findings.
sonar.exclusions=**/__pycache__/**,dist/**,mutants/**,.venv/**

# No coverage exclusions and no rule exclusions. Every one the old file carried pointed
# at a path this rebuild deleted (installer mechanisms, templates, test fixtures) or at
# a finding in a file that no longer exists. If a rule needs silencing here it needs an
# ADR first — CONSTITUTION forbids shipping a suppression, and a properties file is not
# a loophole in that.
