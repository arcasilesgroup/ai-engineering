name: Setup environment
description: |
  Install Python via `actions/setup-python`, install uv via
  `astral-sh/setup-uv`, and run `uv sync --dev`. Replaces the repeated
  setup-python+setup-uv+uv-sync block that lived in every CI workflow step.
  Spec-140 W2.T3 / D-140-06.

  IMPORTANT: callers MUST run `actions/checkout` BEFORE this composite
  so the action.yml is reachable on the runner. The composite no longer
  performs its own checkout — local-action invocation requires the file
  to exist at the path BEFORE the runner can execute it.

inputs:
  python-version:
    description: "Python version uv should provision (default 3.12)."
    required: false
    default: "3.12"
  uv-version:
    description: "Pinned uv release (default 0.9.0 — matches ci-check.yml)."
    required: false
    default: "0.9.0"
  enable-cache:
    description: "Toggle uv's setup-uv cache (default true)."
    required: false
    default: "true"
  sync:
    description: |
      When "true" (default) runs `uv sync --dev` after uv is installed. Pass
      "false" for callers that must run a custom install step before sync.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: ${{ inputs.enable-cache }}

    - name: uv sync --dev
      if: ${{ inputs.sync == 'true' }}
      shell: bash
      run: uv sync --dev
