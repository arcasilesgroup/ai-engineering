<text x="598" y="251" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="14" fill="#00ED64" font-weight="700">/ai-orchestrator</text>
<text x="598" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">phase two: runs the plan, three</text>
<text x="598" y="289" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">gates per checkpoint</text>
