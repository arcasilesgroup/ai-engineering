<text x="639" y="71" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" letter-spacing="2.4">THE SKILLS CHAIN</text>
<text x="690" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="44" fill="#FFFFFF" font-weight="800" text-anchor="end">One pipeline,</text>
<text x="710" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="44" fill="#00ED64" font-weight="800" text-anchor="start">five phases.</text>
<text x="40" y="208" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#FFFFFF" font-weight="700" letter-spacing="1.6">01</text>
<text x="68" y="208" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#889397" letter-spacing="1.6">· FRAME</text>
<rect x="40" y="226" width="232" height="118" rx="12" fill="#112733" stroke="#25505F" stroke-width="1.25"/>
<text x="54" y="251" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="14" fill="#FFFFFF" font-weight="700">/ai-brainstorm</text>
<text x="54" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">the idea, said in plain language</text>
<text x="54" y="332" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="11.5" fill="#00ED64">writes brainstorm.html</text>
<path d="M 278 285 L 304 285" fill="none" stroke="#00ED64" stroke-width="1.75" stroke-linecap="round" marker-end="url(#head)"/>
<text x="312" y="208" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#FFFFFF" font-weight="700" letter-spacing="1.6">02</text>
<text x="340" y="208" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#889397" letter-spacing="1.6">· CONTRACT</text>
<rect x="312" y="226" width="232" height="118" rx="12" fill="#112733" stroke="#25505F" stroke-width="1.25"/>
<text x="326" y="251" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="14" fill="#FFFFFF" font-weight="700">/ai-orchestrator</text>
<text x="326" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">writes what must hold, and the</text>
<text x="326" y="289" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">check that proves it</text>
<text x="326" y="332" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="11.5" fill="#00ED64">writes spec.html · plan.html</text>
<rect x="312" y="434" width="232" height="28" rx="7" fill="none" stroke="#00ED64" stroke-dasharray="4 3" opacity="0.9"/>
<text x="322" y="453" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700">STOP · a human approves</text>
<path d="M 550 285 L 576 285" fill="none" stroke="#00ED64" stroke-width="1.75" stroke-linecap="round" marker-end="url(#head)"/>
<text x="584" y="208" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#FFFFFF" font-weight="700" letter-spacing="1.6">03</text>
<text x="612" y="208" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#889397" letter-spacing="1.6">· THE LOOP</text>
