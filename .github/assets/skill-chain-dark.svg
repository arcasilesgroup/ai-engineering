<text x="870" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">judges the work against the</text>
<text x="870" y="289" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">standard it was given</text>
<text x="870" y="332" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="11.5" fill="#00ED64">reads spec.html</text>
