<text x="108" y="450" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="17" fill="#FFFFFF" font-weight="700">ai-brainstorm</text>
<text x="108" y="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">the idea, said in plain</text>
<text x="108" y="493" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">language</text>
