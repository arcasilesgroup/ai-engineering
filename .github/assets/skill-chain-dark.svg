<text x="418" y="450" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="17" fill="#FFFFFF" font-weight="700">ai-orchestrator</text>
<text x="418" y="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">builds it in gated</text>
<text x="418" y="493" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">checkpoints you approve</text>
<rect x="710" y="420" width="250" height="96" rx="12" fill="#112733" stroke="#25505F" stroke-width="1.25"/>
<text x="728" y="450" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="17" fill="#FFFFFF" font-weight="700">ai-verify</text>
<text x="728" y="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">a verdict with evidence,</text>
<text x="728" y="493" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">not an impression</text>
<rect x="1020" y="420" width="250" height="96" rx="12" fill="#112733" stroke="#25505F" stroke-width="1.25"/>
<text x="1038" y="450" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="17" fill="#FFFFFF" font-weight="700">ai-visual-recap</text>
