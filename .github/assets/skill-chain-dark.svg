<defs>
<marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#00ED64"/></marker>
</defs>
<rect width="1400" height="1090" fill="#001E2B"/>
<defs><radialGradient id="tint" cx="50%" cy="0%" r="72%"><stop offset="0%" stop-color="#00ED64" stop-opacity="0.07"/><stop offset="100%" stop-color="#00ED64" stop-opacity="0"/></radialGradient></defs><rect width="1400" height="1090" fill="url(#tint)"/><path d="M 585 66 L 625 66" stroke="#00ED64" stroke-width="1.5"/>
<text x="639" y="71" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" letter-spacing="2.4">THE ORCHESTRATOR LOOP</text>
<text x="690" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" fill="#FFFFFF" font-weight="800" text-anchor="end">One loop.</text>
<text x="710" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" fill="#00ED64" font-weight="800" text-anchor="start">Everything else is optional.</text>
<text x="700" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15.5" fill="#C1C7C6" text-anchor="middle">ai-orchestrator is the whole workflow: it splits the feature into checkpoints, runs each one through its gates,</text>
<text x="700" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15.5" fill="#C1C7C6" text-anchor="middle">and stops for you twice. Every other skill is optional, and they compose with whatever else you already run.</text>
<text x="40" y="266" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" letter-spacing="1.8">OPTIONAL · BEFORE THE LOOP</text>
<rect x="40" y="282" width="420" height="84" rx="12" fill="none" stroke="#3D4F58" stroke-dasharray="5 4"/>
<text x="56" y="314" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#FFFFFF" font-weight="700">/ai-brainstorm</text>
<text x="56" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">optional · pins the idea in plain language</text>
<rect x="490" y="282" width="420" height="84" rx="12" fill="none" stroke="#3D4F58" stroke-dasharray="5 4"/>
<text x="506" y="314" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#FFFFFF" font-weight="700">/ai-research</text>
<text x="506" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">optional · evidence from outside the repo</text>
<rect x="940" y="282" width="420" height="84" rx="12" fill="none" stroke="#3D4F58" stroke-dasharray="5 4"/>
<text x="956" y="314" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#FFFFFF" font-weight="700">/ai-architect</text>
<text x="956" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">optional · the approach and the layer rules</text>
<rect x="40" y="400" width="1320" height="280" rx="16" fill="#0F2C36" stroke="#00ED64" stroke-width="1.5"/>
<text x="72" y="442" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="21" fill="#00ED64" font-weight="700">/ai-orchestrator · the loop that runs it all</text>
<text x="72" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#C1C7C6">The only skill you have to run. It plans the checkpoints, then builds each one through its gates.</text>
<circle cx="112" cy="536" r="19" fill="#00ED64" stroke="#00ED64" stroke-width="1.5"/>
<text x="112" y="542" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#001E2B" font-weight="700" text-anchor="middle">1</text>
<path d="M 133 536 L 199 536" stroke="#00ED64" stroke-width="1.5"/>
<circle cx="220" cy="536" r="19" fill="#00ED64" stroke="#00ED64" stroke-width="1.5"/>
<text x="220" y="542" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#001E2B" font-weight="700" text-anchor="middle">2</text>
<path d="M 241 536 L 307 536" stroke="#00ED64" stroke-width="1.5"/>
<circle cx="328" cy="536" r="19" fill="#00ED64" stroke="#00ED64" stroke-width="1.5"/>
<text x="328" y="542" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#001E2B" font-weight="700" text-anchor="middle">3</text>
<path d="M 349 536 L 415 536" stroke="#00ED64" stroke-width="1.5"/>
<circle cx="436" cy="536" r="19" fill="#112733" stroke="#00ED64" stroke-width="1.5"/>
<text x="436" y="542" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#C1C7C6" font-weight="700" text-anchor="middle">4</text>
<path d="M 457 536 L 523 536" stroke="#00ED64" stroke-width="1.5"/>
<circle cx="544" cy="536" r="19" fill="#112733" stroke="#3D4F58" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="544" y="542" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#C1C7C6" font-weight="700" text-anchor="middle">5</text>
<path d="M 565 536 L 631 536" stroke="#00ED64" stroke-width="1.5"/>
<circle cx="652" cy="536" r="19" fill="#112733" stroke="#3D4F58" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="652" y="542" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#C1C7C6" font-weight="700" text-anchor="middle">N</text>
<text x="682" y="542" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#889397">one at a time · smallest first</text>
<text x="72" y="596" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#889397">A checkpoint passes its gates, or it cannot move on</text>
<rect x="72" y="610" width="86.8" height="32" rx="8" fill="#112733" stroke="#00ED64"/>
<text x="115.4" y="631" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13.5" fill="#00ED64" font-weight="700" text-anchor="middle">behavior</text>
<rect x="170.8" y="610" width="41.2" height="32" rx="8" fill="#112733" stroke="#00ED64"/>
<text x="191.4" y="631" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13.5" fill="#00ED64" font-weight="700" text-anchor="middle">UI</text>
<rect x="224" y="610" width="162.79999999999998" height="32" rx="8" fill="#112733" stroke="#00ED64"/>
<text x="305.4" y="631" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13.5" fill="#00ED64" font-weight="700" text-anchor="middle">adversarial review</text>
<text x="72" y="668" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#889397">A failed gate re-plans and retries. Three failures on a split checkpoint stop and ask you.</text>
<rect x="962" y="434" width="362" height="38" rx="9" fill="none" stroke="#00ED64" stroke-dasharray="4 3"/>
<text x="982" y="459" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="14" fill="#00ED64" font-weight="700">STOP 1 · you approve the plan</text>
<path d="M 1143 474 L 1143 526" fill="none" stroke="#00ED64" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="962" y="532" width="362" height="38" rx="9" fill="none" stroke="#00ED64" stroke-dasharray="4 3"/>
<text x="982" y="557" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="14" fill="#00ED64" font-weight="700">STOP 2 · you review the app</text>
<text x="982" y="602" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#889397">The only two times it asks you</text>
<text x="982" y="626" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#889397">anything, from the first idea</text>
<text x="982" y="650" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#889397">to the finished pull request.</text>
<text x="40" y="726" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" letter-spacing="1.8">OPTIONAL · AFTER THE LOOP</text>
<rect x="40" y="742" width="315" height="84" rx="12" fill="none" stroke="#3D4F58" stroke-dasharray="5 4"/>
<text x="56" y="774" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#FFFFFF" font-weight="700">/ai-verify</text>
<text x="56" y="798" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">optional · a verdict with evidence</text>
<rect x="375" y="742" width="315" height="84" rx="12" fill="none" stroke="#3D4F58" stroke-dasharray="5 4"/>
<text x="391" y="774" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#FFFFFF" font-weight="700">/ai-security</text>
<text x="391" y="798" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">optional · the six-phase audit</text>
<rect x="710" y="742" width="315" height="84" rx="12" fill="none" stroke="#3D4F58" stroke-dasharray="5 4"/>
<text x="726" y="774" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="15" fill="#FFFFFF" font-weight="700">/ai-write</text>
<text x="726" y="798" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">optional · the README, the wiki, the API</text>
<text x="726" y="815" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">doc</text>
<rect x="1045" y="742" width="315" height="84" rx="12" fill="none" stroke="#3D4F58" stroke-dasharray="5 4"/>
