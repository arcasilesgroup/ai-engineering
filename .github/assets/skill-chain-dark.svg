</defs>
<rect width="1360" height="842" fill="#001E2B"/>
<text x="40" y="54" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="25" fill="#FFFFFF" font-weight="700">{ai} engineering · one pipeline</text>
<text x="40" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#C1C7C6">30 skills. Each declares in its front matter what it writes, who reads it,</text>
<text x="40" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#C1C7C6">when it dies, and what runs next — so the handoff is a contract, not a convention.</text>
<text x="40" y="148" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" letter-spacing="2">LANES</text>
<rect x="118" y="160" width="104" height="26" rx="7" fill="#112733" stroke="#25505F"/>
<text x="170" y="178" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#00ED64" font-weight="700" text-anchor="middle">light</text>
<text x="238" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#C1C7C6">ai-brainstorm → ai-verify · a verdict, no contract</text>
<rect x="118" y="194" width="104" height="26" rx="7" fill="#112733" stroke="#25505F"/>
<text x="170" y="212" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#00ED64" font-weight="700" text-anchor="middle">standard</text>
<text x="238" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#C1C7C6">ai-brainstorm → ai-orchestrator → ai-verify → the recap</text>
<rect x="118" y="228" width="104" height="26" rx="7" fill="#112733" stroke="#25505F"/>
<text x="170" y="246" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#00ED64" font-weight="700" text-anchor="middle">full</text>
<text x="238" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#C1C7C6">the same, plus research, architecture, security and docs when a trigger fires</text>
<text x="40" y="282" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" letter-spacing="1.6">FEEDS THE CONTRACT</text>
