<text x="1061" y="798" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6">optional · the diff, as a page</text>
<text x="700" y="866" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#889397" text-anchor="middle">Every skill is optional except the loop · bring your own skills, and run them beside any other harness</text>
<text x="40" y="916" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" letter-spacing="1.8">ON DEMAND · ANYWHERE IN THE CHAIN</text>
