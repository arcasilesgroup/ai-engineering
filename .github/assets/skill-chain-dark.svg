<text x="1038" y="493" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">interactive page</text>
<text x="40" y="554" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" letter-spacing="1.6">FIRES AFTER VERIFY</text>
