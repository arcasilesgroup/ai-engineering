<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 730" width="1360" height="730" role="img">
<title>ai-engineering - the skill chain</title>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#00ED64"/></marker>
</defs>
<rect width="1360" height="730" fill="#001E2B"/>
<text x="40" y="50" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="start">{ai} engineering · the skill chain</text>
<text x="40" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#C1C7C6" font-weight="400" text-anchor="start">Twenty skills run as one pipeline. Each one declares its next step in front matter,</text>
<text x="40" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#C1C7C6" font-weight="400" text-anchor="start">so the handoff is a contract the next skill can read — not a convention in somebody's head.</text>
<text x="40" y="142" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" text-anchor="start" letter-spacing="2">LANES</text>
<rect x="128" y="152" width="98" height="24" rx="6" fill="#112733" stroke="#25505F"/>
<text x="177" y="168" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#00ED64" font-weight="700" text-anchor="middle">light</text>
<text x="238" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#C1C7C6" font-weight="400" text-anchor="start">ai-brainstorm → ai-verify  ·  no contract written</text>
<rect x="128" y="186" width="98" height="24" rx="6" fill="#112733" stroke="#25505F"/>
<text x="177" y="202" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#00ED64" font-weight="700" text-anchor="middle">standard</text>
<text x="238" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#C1C7C6" font-weight="400" text-anchor="start">ai-brainstorm → ai-plan → ai-goal ⇄ ai-proof → ai-verify → the close</text>
<rect x="128" y="220" width="98" height="24" rx="6" fill="#112733" stroke="#25505F"/>
<text x="177" y="236" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#00ED64" font-weight="700" text-anchor="middle">full</text>
<text x="238" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#C1C7C6" font-weight="400" text-anchor="start">the same, plus ai-research · ai-architect · ai-design · ai-security on their triggers</text>
<text x="42" y="288" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" text-anchor="start" letter-spacing="1.6">01 · FRAME</text>
<text x="312" y="288" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" text-anchor="start" letter-spacing="1.6">02 · CONTRACT</text>
<text x="582" y="288" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" text-anchor="start" letter-spacing="1.6">03 · THE LOOP</text>
<text x="852" y="288" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" text-anchor="start" letter-spacing="1.6">04 · VERDICT</text>
<text x="1122" y="288" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700" text-anchor="start" letter-spacing="1.6">05 · THE CLOSE</text>
<rect x="40" y="304" width="236" height="132" rx="12" fill="#112733" stroke="#25505F" stroke-width="1.25"/>
<text x="58" y="346" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="start">ai-brainstorm</text>
<text x="58" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6" font-weight="400" text-anchor="start">the idea, said in plain</text>
<text x="58" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6" font-weight="400" text-anchor="start">language</text>
<text x="58" y="418" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#71F6BA" font-weight="400" text-anchor="start">writes brainstorm.md</text>
<rect x="310" y="304" width="236" height="132" rx="12" fill="#112733" stroke="#25505F" stroke-width="1.25"/>
<text x="328" y="346" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="start">ai-plan</text>
<text x="328" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6" font-weight="400" text-anchor="start">what must hold, and the</text>
<text x="328" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6" font-weight="400" text-anchor="start">check that proves it</text>
<text x="328" y="418" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="13" fill="#71F6BA" font-weight="400" text-anchor="start">writes spec.html · plan.html</text>
<rect x="580" y="304" width="236" height="60" rx="12" fill="#112733" stroke="#25505F" stroke-width="1.25"/>
<text x="598" y="333" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">ai-goal</text>
<text x="598" y="353" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#C1C7C6" font-weight="400" text-anchor="start">runs the plan, step by step</text>
<rect x="580" y="376" width="236" height="60" rx="12" fill="#112733" stroke="#25505F" stroke-width="1.25"/>
<text x="598" y="405" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">ai-proof</text>
