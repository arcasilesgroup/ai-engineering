<text x="293" y="320" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="17" fill="#FFFFFF" font-weight="700">ai-research</text>
<text x="293" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">answers what the repo</text>
<text x="293" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">cannot</text>
<rect x="550" y="290" width="250" height="72" rx="12" fill="#112733" stroke="#25505F" stroke-width="1.25"/>
<text x="568" y="320" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="17" fill="#FFFFFF" font-weight="700">ai-architect</text>
<text x="568" y="344" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">the approach, the stack,</text>
<text x="568" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">the tradeoff</text>
