<text x="594" y="453" font-family="'JetBrains Mono','Fira Code','SF Mono',ui-monospace,monospace" font-size="12" fill="#00ED64" font-weight="700">ai-eng spec run</text>
<path d="M 822 285 L 848 285" fill="none" stroke="#00ED64" stroke-width="1.75" stroke-linecap="round" marker-end="url(#head)"/>
