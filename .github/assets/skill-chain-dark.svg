<text x="1038" y="614" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">the README, the wiki,</text>
<text x="1038" y="633" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#C1C7C6">the API doc</text>
