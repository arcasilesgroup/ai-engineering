name: Install Time Budget

# Spec-101 G-11 — time-to-first-commit on a clean machine with prereqs MUST
# complete in <= 600s for any single-stack project. The matrix runs the
# fixture across 3 OSes with median-of-3 timings to absorb runner-load
# jitter.
#
# Trigger surface (T-4.7 contract):
#   - nightly schedule (cost-controlled regression sweep)
#   - manual workflow_dispatch (operator-driven on-demand)
#   - PR labelled `perf` (opt-in PR feedback for changes that may move the
#     budget; deliberately NOT every push to keep PR feedback latency low)

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC — quiet hours, before US morning
  workflow_dispatch: {}
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: install-time-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-perf-label:
    # Cheap gate: only proceed for nightly + dispatch + `perf`-labelled PRs.
    name: Guard perf trigger
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      eligible: ${{ steps.decide.outputs.eligible }}
    steps:
      - id: decide
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.label.name }}" == "perf" ]]; then
              echo "eligible=true" >> "$GITHUB_OUTPUT"
            else
              echo "eligible=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

  budget:
    name: Time Budget (${{ matrix.os }})
    needs: guard-perf-label
    if: needs.guard-perf-label.outputs.eligible == 'true'
    runs-on: ${{ matrix.os }}
    # G-11 budget is 600s wall-clock per run, median of 3 — total bound on
    # the job is ~30 minutes including matrix overhead.
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      AIENG_TEST: "1"
      FIXTURE_DIR: tests/fixtures/install-time-budget/python-single-stack
      BUDGET_SECONDS: "600"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-env
        with:
          sync: "false"

      - name: Configure git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"

      - name: Build and install ai-eng
        run: |
          uv build
          python -m venv .smoke-venv
          . .smoke-venv/bin/activate || . .smoke-venv/Scripts/activate
          pip install dist/*.whl
          which ai-eng

      # Provision the fixture's baseline prereq binaries (gitleaks + jq +
      # semgrep) into a user-scope prefix BEFORE the timed loop. Same root
      # cause as worktree-fast (ARC-268), now across the full 3-OS matrix:
      # the fixture manifest sets `python_env.mode: uv-tool`, so the installer
      # verify guard (D-101-02 user-scope allowlist,
      # user_scope_install.py::_install_target_prefixes) accepts a tool ONLY
      # when it resolves under a user-scope prefix. Runner-prebaked binaries in
      # /usr/bin or /usr/local/bin raise UserScopeViolation and are counted
      # MISSING even though they are on PATH -- `ai-eng install` then exits 80
      # on unresolved tool gaps before wiring the post-install gate.
      #
      # `$HOME/.local` is an allowlisted install-target prefix on EVERY OS, so
      # we land gitleaks + jq there uniformly (Linux/macOS/Windows) rather than
      # depending on OS-specific brew/scoop prefixes. semgrep goes through
      # `uv tool install` (shim -> the uv user-executable dir under ~/.local),
      # NOT `pip install` -- pip would drop the console script in the
      # hosted-toolcache Python bin, which is OUTSIDE the allowlist and would
      # itself trip UserScopeViolation. semgrep has no Windows release, so it
      # is skipped there (fixture manifest: platform_unsupported: [windows]).
      #
      # All provisioning is outside the timed loop, so the G-11 600s budget is
      # unaffected.
      - name: Install prereq binaries (gitleaks + jq [+ semgrep])
        env:
          GITLEAKS_VERSION: "8.30.0"
          JQ_VERSION: "1.7.1"
        run: |
          set -euo pipefail
          BIN="$HOME/.local/bin"
          mkdir -p "$BIN"
          # Prepend the user-scope bin to PATH for all later steps. On Windows,
          # translate the msys path to a native Windows path so the (native)
          # Python installer resolves it via shutil.which -- a raw /c/... msys
          # entry is invisible to native-Windows PATH lookup.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cygpath -w "$BIN" >> "$GITHUB_PATH"
          else
            echo "$BIN" >> "$GITHUB_PATH"
          fi

          case "${RUNNER_OS}" in
            Linux)
              curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
                | tar xz -C "$BIN" gitleaks
              chmod +x "$BIN/gitleaks"
              install -m 0755 "$(command -v jq)" "$BIN/jq"
              ;;
            macOS)
              # macos-latest runners are Apple Silicon (arm64).
              curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz" \
                | tar xz -C "$BIN" gitleaks
              chmod +x "$BIN/gitleaks"
              install -m 0755 "$(command -v jq)" "$BIN/jq"
              ;;
            Windows)
              curl -sSfL -o gitleaks.zip "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"
              # Git-bash `tar` is GNU tar (no zip support); use PowerShell.
              powershell -NoProfile -Command "Expand-Archive -Force gitleaks.zip gitleaks_unzip"
              cp gitleaks_unzip/gitleaks.exe "$BIN/gitleaks.exe"
              # The runner's `jq` is a Chocolatey shim whose payload carries a
              # relative `..\lib\jq\tools\jq.exe` reference; copying it to
              # ~/.local/bin breaks that reference ("Cannot find file at
              # ..\lib\jq\tools\jq.exe"). Download the standalone, relocatable
              # jq.exe release binary instead so it runs from the user-scope bin.
              curl -sSfL -o "$BIN/jq.exe" "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-windows-amd64.exe"
              ;;
          esac

          # gitleaks + jq land user-scoped on every OS; verify from ~/.local/bin.
          "$BIN/gitleaks" version
          "$BIN/jq" --version

          # semgrep: Linux + macOS only (no Windows release). uv is provisioned
          # by ./.github/actions/setup-env; `uv tool install` shims semgrep into
          # the user-scope executable dir under ~/.local so the verify guard
          # accepts it.
          if [ "${RUNNER_OS}" != "Windows" ]; then
            uv tool install --quiet semgrep
            semgrep --version
          fi

      # T-4.7: median-of-3. Each run is `git clone <fixture> && cd <fixture>
      # && ai-eng install . && git switch -c smoke/run-N && git commit
      # --allow-empty -m "chore: smoke"`.
      # The conventional-commit prefix satisfies the framework's own
      # commit-msg-format gate, which the just-installed hooks enforce. The
      # smoke commit runs on a feature branch, never the default branch: the
      # branch-protection gate (also part of the commit-msg gate) correctly
      # blocks direct commits to `main`, so committing there would fail the
      # step even though the install succeeded. The smoke commit exists to
      # prove the installed hooks fire and PASS on a legitimate commit. We
      # use a local file:// clone to keep network noise out of the wall-clock.
      - name: T-4.7 median-of-3 install + smoke commit
        run: |
          . .smoke-venv/bin/activate || . .smoke-venv/Scripts/activate
          # The fixture is tracked as plain files inside this repo, not as a
          # nested git repo, so `git clone --bare "$FIXTURE_DIR"` fails with
          # `fatal: repository '<dir>' does not exist` (exit 128). Stage the
          # fixture into a throwaway repo first, then bare-clone from that so
          # the per-run `git clone` stays realistic. Staging is outside the
          # timed loop, so it does not count against the G-11 budget.
          rm -rf fixture-src fixture.git
          mkdir -p fixture-src
          cp -R "$FIXTURE_DIR"/. fixture-src/
          (cd fixture-src && git init -b main -q && git add -A && git commit -q -m "chore: fixture init")
          git clone --bare fixture-src fixture.git
          declare -a TIMINGS
          for run in 1 2 3; do
            rm -rf "run-$run"
            START=$(date +%s)
            git clone fixture.git "run-$run"
            (cd "run-$run" && ai-eng install . --non-interactive)
            (cd "run-$run" && git switch -c "smoke/run-$run" && git commit --allow-empty -m "chore: smoke commit")
            END=$(date +%s)
            ELAPSED=$((END - START))
            echo "Run $run: ${ELAPSED}s"
            TIMINGS+=("$ELAPSED")
          done
          SORTED=$(printf '%s\n' "${TIMINGS[@]}" | sort -n)
          # POSIX median-of-3: middle element after sort.
          MEDIAN=$(printf '%s\n' "$SORTED" | sed -n '2p')
          echo "Median: ${MEDIAN}s (budget: ${BUDGET_SECONDS}s)"
          echo "MEDIAN_SECONDS=${MEDIAN}" >> "$GITHUB_ENV"
          if [ "$MEDIAN" -gt "$BUDGET_SECONDS" ]; then
            echo "G-11 budget violated: median ${MEDIAN}s > ${BUDGET_SECONDS}s"
            exit 1
          fi

      - name: Record timing artifact
        if: always()
        run: |
          mkdir -p timing-artifacts
          {
            echo "os=${{ matrix.os }}"
            echo "median_seconds=${MEDIAN_SECONDS:-unknown}"
            echo "budget_seconds=${BUDGET_SECONDS}"
            echo "trigger=${{ github.event_name }}"
            echo "ref=${{ github.sha }}"
          } > "timing-artifacts/g11-${{ matrix.os }}.txt"

      - name: Upload timing artifact (7-day)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: install-time-budget-${{ matrix.os }}
          path: timing-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  install-time-budget:
    name: install-time-budget
    needs: [budget]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate time-budget result
        run: |
          if [[ "${{ needs.budget.result }}" == "skipped" ]]; then
            echo "Budget guard suppressed run (no perf trigger)"
            exit 0
          fi
          if [[ "${{ needs.budget.result }}" != "success" ]]; then
            echo "Time-budget matrix failed: ${{ needs.budget.result }}"
            exit 1
          fi
          echo "All time-budget runs within G-11 (600s median)"
