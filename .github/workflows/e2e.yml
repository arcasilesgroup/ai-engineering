name: e2e
# The pipeline we plant, exercised on every push and PR against the binary built from
# this commit — the channel is *ephemeral on purpose*: an Actions artifact dies with
# the run (7 days at most) and needs a token to download, so no client can pin it.
# Clients pin the release; this proves the release's payload before it exists (§17).
# It exists because the planted workflow had never been run by anyone: it installed a
# package that is not on npm and named a trivy ref that does not exist.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # bun comes from npm, not from `oven-sh/setup-bun`: this repository's action
      # policy allows GitHub-owned actions plus nine org patterns, and a workflow that
      # names anything else never starts (startup_failure, no logs). Node is on every
      # hosted runner, and the registry pins the version's integrity itself.
      - run: npm install -g bun@1.4.2
      - run: bun install --frozen-lockfile
      - name: Build the binary the client would download
        run: bun run build
      - name: Prove the planted pipeline — templates/ci.yml.tpl, machine side, workflow, fail-closed gate, pins
        env:
          # absolute: the proof script changes directory between proofs
          AI_ENG_BIN: ${{ github.workspace }}/dist/ai-eng
        run: sh scripts/proof-planted-ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: planted-ci-binary
          path: dist/ai-eng
          retention-days: 7
