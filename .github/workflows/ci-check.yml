name: CI Check

# spec-152 (W5): step-security/harden-runner and ossf/scorecard-action require
# the repository Actions allowlist to permit `step-security/*` and `ossf/*`
# (Settings → Actions → General → Allowed actions). Without those patterns the
# whole workflow startup-fails before any job runs.

on:
  push:
    branches: [main, "rewrite/**"]
    # spec-152 T-34 (D-152-22): 'docs/**' is intentionally NOT ignored. A
    # docs-only change still runs the lightweight `docs-gate` floor (content
    # integrity + secret scan + workflow sanity) so it cannot fully bypass CI
    # while the required `CI Result` check reports success by default. The
    # heavy test matrix stays gated to `code == true`. Pure prose extensions
    # (.mdx/.rst/.txt) remain ignored — they touch no governed surface.
    paths-ignore:
      - '**.mdx'
      - '**.rst'
      - '**.txt'
  pull_request:
    branches: [main]
    # spec-152 T-34 (D-152-22): 'docs/**' is intentionally NOT ignored. A
    # docs-only change still runs the lightweight `docs-gate` floor (content
    # integrity + secret scan + workflow sanity) so it cannot fully bypass CI
    # while the required `CI Result` check reports success by default. The
    # heavy test matrix stays gated to `code == true`. Pure prose extensions
    # (.mdx/.rst/.txt) remain ignored — they touch no governed surface.
    paths-ignore:
      - '**.mdx'
      - '**.rst'
      - '**.txt'

permissions:
  contents: read

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      test-config: ${{ steps.filter.outputs.test-config }}
      has-snyk-token: ${{ steps.tokens.outputs.has-snyk-token }}
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check optional tokens
        id: tokens
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "has-snyk-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-snyk-token=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - '**/*.py'
              - '**/*.toml'
              - 'uv.lock'
              - '.github/workflows/**'
              - '**/*.yml'
            docs:
              # tests/docs walks repo markdown (link/anchor integrity) and
              # gates README/CONTRIBUTING/CHANGELOG/ai-ide-audit acceptance +
              # anonymous-content (D-131-15). Markdown-only edits must trigger
              # it — the `code` filter omits **/*.md, so a pure-doc PR that
              # adds a machine path would otherwise skip the gate.
              - '**/*.md'
            test-config:
              - 'pyproject.toml'
              - 'tests/conftest.py'
              - '.github/workflows/ci-check.yml'
              - 'scripts/**'
              - 'uv.lock'
              - '.semgrep.yml'
              - '.gitleaks.toml'

  docs-gate:
    name: Docs Floor (content integrity + secret scan)
    # spec-152 T-34 (D-152-22): the lightweight floor that runs when docs
    # change so a docs-only change is no longer fully CI-bypassed (it used to
    # be skipped via `paths-ignore: docs/**`, and `CI Result` then defaulted to
    # success). Runs the CHEAP, docs-relevant checks only — content integrity,
    # the docs link/anchor + anonymous-content suite, a secret scan, and the
    # workflow policy check — NOT the heavy test matrix (that stays
    # `code == 'true'`). Runs whenever docs OR code changed; on a code PR the
    # full gates run alongside it.
    needs: [change-scope]
    if: needs.change-scope.outputs.docs == 'true' || needs.change-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: Install gitleaks
        # Pinned release + sha256 verify (mirrors the `security` job, D-152-12).
        # Checksum is the linux_x64 line from gitleaks_8.30.0_checksums.txt.
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          scripts/ci/install_tool.sh \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "${GITLEAKS_SHA256}" \
            /usr/local/bin \
            gitleaks
      - name: Secret scan (docs floor)
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ] && [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --no-banner \
              --redact \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            gitleaks detect --source . --config .gitleaks.toml --no-banner --redact
          fi
      - name: Content integrity (links, anchors, anonymous content)
        run: uv run pytest tests/docs -q
      - name: Governance content checks
        run: uv run ai-eng check
      - name: Workflow policy sanity
        run: uv run python scripts/check_workflow_policy.py

  lint:
    name: Lint & Format
    needs: [change-scope]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-env
      - name: Cache spec-104 gate-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ai-engineering/cache/gate/
          key: gate-cache-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', '.ruff.toml', '.gitleaks.toml') }}-${{ github.sha }}
          restore-keys: |
            gate-cache-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', '.ruff.toml', '.gitleaks.toml') }}-
      - name: Ruff check
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  duplication:
    name: Duplication Check
    needs: [change-scope]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-env
      - name: Check code duplication
        run: uv run python -m ai_engineering.policy.duplication --path src/ai_engineering --threshold 3

  opa-policies:
    name: OPA Policy Tests & Coverage
    needs: [change-scope]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: v1.16.1
      - name: opa fmt --diff
        run: opa fmt --diff .ai-engineering/policies/
      - name: opa test (verbose)
        run: opa test --verbose .ai-engineering/policies/
      - name: opa test --coverage (≥90% gate)
        run: python3 scripts/check_opa_coverage.py --threshold 90

  risk-acceptance:
    name: Risk Acceptance Check
    needs: [change-scope]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-env
      - name: Check risk acceptances
        run: uv run ai-eng gate risk-check --strict

  no-suppression:
    name: Anti-Suppression Gate (Article VII)
    needs: [change-scope]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-env
      - name: Scan for suppression markers
        run: uv run no_suppression --root .

  typecheck:
    name: Type Check
    needs: [change-scope]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-env
      - name: Cache spec-104 gate-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ai-engineering/cache/gate/
          key: gate-cache-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', '.ruff.toml', '.gitleaks.toml') }}-${{ github.sha }}
          restore-keys: |
            gate-cache-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', '.ruff.toml', '.gitleaks.toml') }}-
      - name: ty check
        run: uv run ty check --exclude 'src/ai_engineering/templates/**' src/

  test-unit:
    name: Unit (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    needs: [change-scope]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # spec-140 W2 (D-140-03): PR-blocking matrix collapsed to 3.12 only.
        # Full 3.11/3.12/3.13 sweep moved to `nightly-matrix.yml` (advisory).
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: Cache spec-104 gate-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ai-engineering/cache/gate/
          key: gate-cache-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', '.ruff.toml', '.gitleaks.toml') }}-${{ github.sha }}
          restore-keys: |
            gate-cache-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', '.ruff.toml', '.gitleaks.toml') }}-
      - name: Run unit tests
        # spec-104 platform/timing flakes (deselected, not ignored — keeps
        # the rest of each module running):
        #   - wave2_wall_clock: 1.5x slowest=90ms threshold too tight for
        #     loaded macos/windows runners (observed 117ms+).
        #   - emit_findings_atomic_write / atomic_write_atomic_under_concurrent_writes:
        #     POSIX-only os.replace semantics; Windows raises PermissionError
        #     when another writer still has the file open.
        #   - wave1_intra_wave_rerun_on_changes / wave1_records_files_modified:
        #     mtime-based change detection misfires on Windows (FAT/NTFS
        #     mtime resolution ~1-2s; write_text + immediate stat returns
        #     unchanged mtime so the orchestrator records files_modified=[]).
        #
        # SKIP_HOT_PATH_SLO=1: the ``tests/unit/hooks/test_hot_path_slo``
        # benchmarks measure real wall-clock subprocess timing. Under
        # xdist parallel load on shared macOS / Windows runners the p95
        # exceeds even the 2x CI slack budget (thermal scaling + noisy
        # disk + cold cache). Per the test docstring those tests are
        # local-machine guards; the framework's own hot-path SLO
        # contract is governed by ``ai-eng doctor --check hot-path`` on
        # the dedicated workflow, not the unit suite.
        env:
          SKIP_HOT_PATH_SLO: "1"
        run: |
          set -o pipefail  # pytest exit must survive the pipe to tee
          uv run pytest tests/unit -v -n auto --dist worksteal --durations=25 \
            --deselect tests/unit/test_orchestrator_wave2.py::test_wave2_wall_clock_ms_is_max_not_sum \
            --deselect tests/unit/test_orchestrator_emit_findings.py::test_emit_findings_atomic_write \
            --deselect tests/unit/test_gate_cache_persist.py::test_atomic_write_atomic_under_concurrent_writes \
            --deselect tests/unit/test_orchestrator_wave1.py::test_wave1_intra_wave_rerun_on_changes \
            --deselect tests/unit/test_orchestrator_wave1.py::test_wave1_records_files_modified \
            --deselect tests/unit/test_orchestrator_wave1.py::test_wave1_reruns_when_relative_staged_file_changes_under_project_root \
            | tee test-output.log
      - name: Run unit tests with coverage (ubuntu/3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          SKIP_HOT_PATH_SLO: "1"
        run: |
          uv run pytest tests/unit -v -n auto --dist worksteal \
            --deselect tests/unit/test_orchestrator_wave2.py::test_wave2_wall_clock_ms_is_max_not_sum \
            --deselect tests/unit/test_orchestrator_emit_findings.py::test_emit_findings_atomic_write \
            --deselect tests/unit/test_gate_cache_persist.py::test_atomic_write_atomic_under_concurrent_writes \
            --deselect tests/unit/test_orchestrator_wave1.py::test_wave1_intra_wave_rerun_on_changes \
            --deselect tests/unit/test_orchestrator_wave1.py::test_wave1_records_files_modified \
            --deselect tests/unit/test_orchestrator_wave1.py::test_wave1_reruns_when_relative_staged_file_changes_under_project_root \
            --cov=src/ai_engineering --cov-report=xml:coverage-unit.xml
      - name: Upload slow-tests artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: slow-tests-report
          path: test-output.log
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-unit
          path: coverage-unit.xml

  test-integration:
    name: Integration (${{ matrix.os }})
    needs: [change-scope]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: Cache spec-104 gate-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ai-engineering/cache/gate/
          key: gate-cache-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', '.ruff.toml', '.gitleaks.toml') }}-${{ github.sha }}
          restore-keys: |
            gate-cache-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', '.ruff.toml', '.gitleaks.toml') }}-
      - name: Configure git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"
      - name: Run integration tests
        run: |
          uv run pytest tests/integration -v -n auto --dist worksteal --durations=25
      - name: Run integration tests with coverage (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run pytest tests/integration -v -n auto --dist worksteal \
            --cov=src/ai_engineering --cov-report=xml:coverage-integration.xml
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-integration
          path: coverage-integration.xml

  test-e2e:
    name: E2E
    needs: [change-scope]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: Configure git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"
      - name: Run e2e tests
        run: |
          uv run pytest tests/e2e -v --durations=10
      - name: Run e2e tests with coverage
        run: |
          uv run pytest tests/e2e -v \
            --cov=src/ai_engineering --cov-report=xml:coverage-e2e.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-e2e
          path: coverage-e2e.xml

  test-docs:
    name: Docs (link integrity + acceptance gates)
    needs: [change-scope]
    # tests/docs is enforced by no other gate: the pre-push/PR gate runs
    # `pytest -m smoke` (these tests carry no smoke marker) and the Stop-loop
    # convergence run is observe-only. CI is the only authoritative home.
    if: needs.change-scope.outputs.code == 'true' || needs.change-scope.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-env
      - name: Run docs tests
        run: uv run pytest tests/docs -q

  sonarcloud:
    name: SonarCloud
    needs: [change-scope, test-unit, test-integration, test-e2e]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Verify coverage reports
        run: |
          # List downloaded coverage XMLs (informational)
          find . -maxdepth 1 -name 'coverage-*.xml' -print | sort
          count=$(find . -maxdepth 1 -name 'coverage-*.xml' -print | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found $count coverage report(s)"
          else
            echo "ERROR: No coverage reports found — tests may have been skipped but coverage is required"
            exit 1
          fi
      # SonarCloud blocking gate — Quality Gate green at HEAD (spec-101 Waves 35-37
      # closed acknowledged findings). Job runs in parallel with the integration
      # matrix; reactivation does not extend CI wall-clock.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage-unit.xml,coverage-integration.xml,coverage-e2e.xml

  framework-smoke:
    name: Framework Smoke (${{ matrix.os }})
    needs: [change-scope]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AIENG_TEST: "1"
      # Smoke jobs short-circuit network-bound install mechanisms; the
      # synthetic-OK record lets the install pipeline pass on clean CI
      # runners that lack brew / winget. See spec-101 install-smoke.yml
      # for the same setup.
      AIENG_TEST_SIMULATE_INSTALL_OK: "*"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}
      - name: Init smoke repository
        run: |
          rm -rf smoke-repo
          mkdir -p smoke-repo
          git init -b main smoke-repo
          git -C smoke-repo config user.email "ci@test.com"
          git -C smoke-repo config user.name "CI"
      - name: Install framework
        run: uv run ai-eng install smoke-repo
        env:
          PYTHONUTF8: "1"
      - name: Doctor diagnostics
        run: |
          set +e
          uv run ai-eng doctor smoke-repo --json
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "ERROR: Doctor reported failures"
            exit 1
          fi
          # Exit 0 (all ok) or 2 (warnings only) are acceptable in smoke
        env:
          PYTHONUTF8: "1"
      - name: Commit-msg gate smoke
        run: |
          printf "chore: smoke commit" > smoke-repo/.git/COMMIT_EDITMSG
          uv run ai-eng gate commit-msg smoke-repo/.git/COMMIT_EDITMSG --target smoke-repo
        env:
          PYTHONUTF8: "1"
      - name: Hook verification smoke
        run: uv run python -c "from pathlib import Path; from ai_engineering.hooks.manager import verify_hooks; assert all(verify_hooks(Path('smoke-repo')).values())"

  workflow-sanity:
    name: Workflow Sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-env
      - name: Install actionlint
        # spec-152 T-22 (D-152-12): pinned release + sha256 verify, replacing the
        # mutable `main`-branch curl|bash bootstrap. Checksum is the linux_amd64
        # line from the official actionlint_1.7.12_checksums.txt.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          scripts/ci/install_tool.sh \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "${ACTIONLINT_SHA256}" \
            /usr/local/bin \
            actionlint
      - name: Run actionlint
        run: find .github/workflows -name '*.yml' -exec actionlint {} +
      - name: Workflow policy checks
        run: uv run python scripts/check_workflow_policy.py
      - name: Mirror sync integrity
        run: uv run ai-eng dev sync --check

  verify-gate-trailers:
    name: Verify Gate Trailers
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Ensure PR commits include gate trailer
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FAILED=0
          for sha in $(git log --no-merges --format=%H "$BASE".."$HEAD"); do
            msg="$(git log -1 --format=%B "$sha")"
            if ! printf "%s" "$msg" | grep -q "^Ai-Eng-Gate: passed$"; then
              echo "Missing trailer in commit: $sha"
              echo "  Message: $(git log -1 --format=%s "$sha")"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "One or more commits are missing the Ai-Eng-Gate trailer."
            exit 1
          fi
          echo "All $(git log --no-merges --format=%H "$BASE".."$HEAD" | wc -l | tr -d ' ') commits verified."

  dependency-review:
    name: Dependency Review
    # spec-152 T-24 (D-152-14): blocking dependency-ingress gate. Reviews the
    # PR's dependency diff and fails on a newly-introduced high+ vulnerability,
    # matching the Snyk SCA `--severity-threshold=high`. Runs on EVERY pull
    # request, dependabot included (it is NOT in the dependabot-exempting
    # `pr_only` aggregate class). Skips on push (no dependency diff exists).
    needs: [change-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    # Least-privilege: the action only reads the PR's dependency graph. No
    # `pull-requests: write` because the summary-comment feature is disabled.
    permissions:
      contents: read
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # OQ4 default: block on high+ to match the Snyk SCA threshold.
          fail-on-severity: high
          comment-summary-in-pr: never

  snyk-security:
    name: Snyk Security
    needs: [change-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.change-scope.outputs.has-snyk-token == 'true'
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-env
      - name: Install Snyk CLI
        # spec-152 T-22 (D-152-12): pin the Snyk CLI version (current stable from
        # `npm view snyk version`). `--ignore-scripts` retained.
        run: npm install -g snyk@1.1305.0 --ignore-scripts
      - name: Export pinned requirements for Snyk
        run: |
          uv pip freeze > requirements.txt
          echo "Exported $(wc -l < requirements.txt) pinned packages"
      - name: Snyk dependency test
        run: |
          . .venv/bin/activate
          snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Snyk code test (SAST)
        run: snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Snyk monitor (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          . .venv/bin/activate
          snyk monitor --file=requirements.txt --package-manager=pip
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-env
      - name: Install gitleaks
        # spec-152 T-22 (D-152-12): add sha256 verification before extracting.
        # Checksum is the linux_x64 line from the official
        # gitleaks_8.30.0_checksums.txt (defence-in-depth on the pinned tarball).
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          scripts/ci/install_tool.sh \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "${GITLEAKS_SHA256}" \
            /usr/local/bin \
            gitleaks
      - name: gitleaks
        # Article XII §4: scope to the PR's commits, not full repo history.
        # Historical fakes in deleted docs (pre-spec-126) would otherwise
        # always block the gate. Tracked as a follow-up: spec for
        # git-filter-repo scrub OR migrate to `ai-eng gate pre-commit`.
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ] && [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --no-banner \
              --redact \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            gitleaks detect --source . --config .gitleaks.toml --no-banner --redact
          fi
      - name: pip-audit
        run: uv run python -m ai_engineering.verify.tls_pip_audit
      - name: Cache semgrep pack registry
        # spec-141 M2.T3 (D-141-02): community packs are fetched from the
        # registry on first invocation; the resolved YAML lives under
        # ~/.semgrep. Cache key includes the pinned CLI version + OS so
        # bumping the pin invalidates cleanly (D-141-05 reproducibility).
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.semgrep
          key: semgrep-packs-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ runner.os }}-1.163.0
          restore-keys: |
            semgrep-packs-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ runner.os }}-
      - name: Install semgrep
        # spec-141 M2.T2 (D-141-05): pinned CLI version is the
        # deterministic reproducibility anchor. Pack aliases (p/python,
        # p/owasp-top-ten, …) roll forward from HEAD; pinning the CLI
        # is the only documented way to fix the scan surface.
        #
        # Bumped 1.96.0 → 1.163.0: the 1.96.0 wheel exits 1 without
        # writing JSON on the Ubuntu 24.04 ubuntu-latest runner.
        # 1.163.0 is the current latest with active OCaml binary
        # maintenance — pack aliases still roll forward from HEAD,
        # pinning only the CLI is the documented primitive.
        run: python -m pip install "semgrep==1.163.0"
      - name: semgrep (in-tree rules — must pass)
        # spec-141 M2.T1 (D-141-01): in-tree rules under aieng.<area>.
        # namespace run as the authoritative gate. ``--error`` is kept
        # in the command line to honour the spec-141 contract test
        # (``test_semgrep_packs::test_semgrep_step_keeps_in_tree_config``).
        # ``--metrics=off`` + ``--disable-version-check`` silence the
        # two semgrep.dev network calls that have been observed to
        # leak HTTP 403 into the semgrep 1.96.0 exit code on the
        # ubuntu-latest runner. As a defence-in-depth, the shell
        # verifies the actual finding count from the JSON and exits 1
        # iff ``len(results) > 0``; this preserves the gate semantics
        # for real findings without depending on semgrep's exit code
        # under flaky network conditions.
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          set +e
          echo "::group::semgrep environment diagnostics"
          which semgrep || echo "(semgrep not on PATH)"
          semgrep --version || echo "(semgrep --version failed; exit=$?)"
          echo "PATH: ${PATH}"
          echo "python: $(which python)"
          echo "::endgroup::"
          # Run semgrep capturing BOTH stdout and stderr to separate files
          # so we can dump the actual failure reason on diagnostic.
          semgrep \
            --config .semgrep.yml \
            --metrics=off \
            --disable-version-check \
            --error --json . > semgrep-results.json 2> semgrep-stderr.log
          semgrep_exit=$?
          set -e
          echo "semgrep exit code: ${semgrep_exit}"
          echo "::group::semgrep stderr (full)"
          cat semgrep-stderr.log || echo "(no stderr file)"
          echo "::endgroup::"
          echo "::group::semgrep stdout (first 200 lines)"
          head -200 semgrep-results.json || echo "(no stdout file)"
          echo "::endgroup::"
          if [ ! -s semgrep-results.json ]; then
            echo "::error::semgrep produced no results JSON (see stderr above)."
            exit 1
          fi
          findings=$(python3 -c 'import json; print(len(json.load(open("semgrep-results.json")).get("results", [])))' 2>/dev/null || echo "PARSE_ERROR")
          echo "findings=${findings}"
          if [ "${findings}" = "PARSE_ERROR" ]; then
            echo "::error::semgrep JSON could not be parsed. stderr tail:"
            tail -50 semgrep-stderr.log || true
            head -20 semgrep-results.json || true
            exit 1
          fi
          if [ "${findings}" -gt 0 ]; then
            echo "::error::semgrep in-tree gate found ${findings} violation(s)."
            python3 -c 'import json; d=json.load(open("semgrep-results.json")); [print(f"  - {r[\"check_id\"]}: {r[\"path\"]}:{r[\"start\"][\"line\"]}") for r in d.get("results", [])]'
            exit 1
          fi
          echo "semgrep in-tree gate passed (0 findings)"
      - name: semgrep (community packs — advisory)
        # spec-141 M2.T1 follow-up: as of 2026-05, semgrep.dev returns
        # HTTP 403 for unauthenticated registry fetches. The community
        # packs are advisory until SEMGREP_APP_TOKEN is provisioned in
        # CI secrets. Run as continue-on-error so the in-tree gate stays
        # authoritative; pack findings surface in the log for triage but
        # do not block the build. Tracked for follow-up alongside spec-141
        # M5 (CI finding triage).
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/bash \
            --json . > semgrep-packs-results.json || {
              echo "::warning::Semgrep community packs unavailable (likely registry auth required). In-tree rules still enforced."
              echo '{"results":[],"paths":{"scanned":[],"skipped":[]}}' > semgrep-packs-results.json
            }
      - name: Check semgrep skip ratio
        run: |
          python3 -c "
          import json, sys
          data = json.load(open('semgrep-results.json'))
          scanned = len(data.get('paths', {}).get('scanned', []))
          skipped = len(data.get('paths', {}).get('skipped', []))
          total = scanned + skipped
          if total == 0:
              print('No files processed by semgrep')
              sys.exit(1)
          ratio = skipped / total * 100
          print(f'Semgrep: {scanned} scanned, {skipped} skipped ({ratio:.1f}%)')
          if ratio > 50:
              print(f'ERROR: Skip ratio {ratio:.1f}% exceeds 50% threshold')
              sys.exit(1)
          print('Skip ratio within threshold')
          "

  content-integrity:
    name: Content Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: Guard governed version surfaces
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: uv run python -m ai_engineering.policy.release_version_guard
      - name: Validate content integrity
        run: uv run ai-eng check
      - name: Governance consistency
        run: uv run ai-eng check --json
      - name: Manifest validation
        run: |
          # spec-133: raw manifest.yml is user-config only (16 lines);
          # framework-managed sections (skills/agents/required_tools/…) are
          # injected by the loader from framework_defaults.py. Validate via
          # the loader path so the injection contract is exercised.
          uv run python -c "
          import yaml
          from pathlib import Path
          from ai_engineering.config.framework_defaults import apply_framework_defaults
          raw = yaml.safe_load(Path('.ai-engineering/manifest.yml').read_text())
          merged = apply_framework_defaults(raw or {})
          gs = merged.get('governance_surface', merged)
          assert 'skills' in gs or 'agents' in gs, 'manifest (post-injection) missing governance_surface.skills/agents'
          print('Manifest OK')
          "
      - name: Skill schema validation
        run: |
          # Verify all skills have valid SKILL.md with frontmatter
          python -c "
          from pathlib import Path
          skills_dir = Path('src/ai_engineering/templates/project/.claude/skills')
          errors = []
          # Skip non-skill subdirs prefixed with '_' (spec-106 D-106-01:
          # _shared/ houses execution-kernel.md and other shared handlers
          # consumed by orchestrators; not a skill, no SKILL.md required).
          for skill_dir in sorted(skills_dir.iterdir()):
              if not skill_dir.is_dir():
                  continue
              if skill_dir.name.startswith('_'):
                  continue
              skill_file = skill_dir / 'SKILL.md'
              if not skill_file.exists():
                  errors.append(f'{skill_dir.name}: missing SKILL.md')
                  continue
              text = skill_file.read_text()
              if not text.startswith('---'):
                  errors.append(f'{skill_dir.name}: missing frontmatter')
              if 'name:' not in text[:500]:
                  errors.append(f'{skill_dir.name}: missing name in frontmatter')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              raise SystemExit(1)
          skills_count = sum(1 for d in skills_dir.iterdir() if d.is_dir() and not d.name.startswith('_'))
          print(f'All {skills_count} skills valid')
          "

  build-check:
    name: Build Check
    needs:
      [
        change-scope,
        lint,
        duplication,
        risk-acceptance,
        no-suppression,
        typecheck,
        test-unit,
        test-integration,
        test-e2e,
        sonarcloud,
        framework-smoke,
        security,
        content-integrity,
        workflow-sanity,
      ]
    if: needs.change-scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-env
        with:
          sync: "false"
      - name: Build
        run: uv build

  ci-check-result:
    name: CI Result
    if: always()
    timeout-minutes: 5
    needs:
      [
        change-scope,
        docs-gate,
        lint,
        duplication,
        opa-policies,
        risk-acceptance,
        no-suppression,
        typecheck,
        test-unit,
        test-integration,
        test-e2e,
        test-docs,
        sonarcloud,
        framework-smoke,
        workflow-sanity,
        verify-gate-trailers,
        dependency-review,
        snyk-security,
        security,
        content-integrity,
        build-check,
      ]
    runs-on: ubuntu-latest
    steps:
      # spec-152 T-31 (D-152-19): egress monitor first, non-blocking audit mode.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Evaluate CI results
        run: |
          set -euo pipefail

          CODE="${{ needs.change-scope.outputs.code }}"
          DOCS="${{ needs.change-scope.outputs.docs }}"
          IS_PR="${{ github.event_name == 'pull_request' }}"
          IS_DEPENDABOT="${{ github.actor == 'dependabot[bot]' }}"

          # -- always-required: MUST succeed --
          always_required=(
            "workflow-sanity:${{ needs.workflow-sanity.result }}"
            "security:${{ needs.security.result }}"
            "content-integrity:${{ needs.content-integrity.result }}"
          )

          # -- code-conditional: MUST succeed when code changed, skip accepted otherwise --
          code_conditional=(
            "lint:${{ needs.lint.result }}"
            "duplication:${{ needs.duplication.result }}"
            "opa-policies:${{ needs.opa-policies.result }}"
            "risk-acceptance:${{ needs.risk-acceptance.result }}"
            "no-suppression:${{ needs.no-suppression.result }}"
            "typecheck:${{ needs.typecheck.result }}"
            "test-unit:${{ needs.test-unit.result }}"
            "test-integration:${{ needs.test-integration.result }}"
            "test-e2e:${{ needs.test-e2e.result }}"
            "test-docs:${{ needs.test-docs.result }}"
            "framework-smoke:${{ needs.framework-smoke.result }}"
            "build-check:${{ needs.build-check.result }}"
            "sonarcloud:${{ needs.sonarcloud.result }}"
          )

          # -- docs-conditional: MUST succeed when docs OR code changed --
          # spec-152 T-34 (D-152-22). The lightweight docs CI floor. It runs
          # whenever docs or code change, so a docs-only change is still
          # inspected (content integrity + secret scan + workflow policy)
          # instead of fully bypassing CI. A skip is tolerated only when
          # neither docs nor code changed (the workflow would not normally
          # trigger then). A failure always fails the aggregate.
          docs_conditional=(
            "docs-gate:${{ needs.docs-gate.result }}"
          )

          # -- pr-only: MUST succeed on non-dependabot PRs, skip accepted otherwise --
          pr_only=(
            "verify-gate-trailers:${{ needs.verify-gate-trailers.result }}"
          )

          # -- pr-all: MUST succeed on EVERY pull request, dependabot INCLUDED --
          # spec-152 T-24 (D-152-14). Distinct from pr_only (which exempts
          # dependabot). dependency-review is the blocking dependency-ingress
          # gate; a malicious-dependency PR must not merge even from dependabot.
          # Skip tolerated on push (the job's `if: pull_request` skips it there).
          pr_all=(
            "dependency-review:${{ needs.dependency-review.result }}"
          )

          # -- token-conditional: required when the gating token is provisioned --
          # spec-152 T-28 (D-152-07/08). snyk-security runs only when
          # `has-snyk-token == 'true'`. A *failure* always fails the aggregate.
          # A *skip* is a FAIL when the token is present (the job must run), but
          # is TOLERATED when the token is absent — including on a fork PR where
          # GitHub withholds repo secrets, so `has-snyk-token` resolves to
          # 'false'. This keeps CI green with no token and becomes enforcing the
          # moment the operator provisions SNYK_TOKEN.
          token_conditional=(
            "snyk-security:${{ needs.snyk-security.result }}"
          )

          HAS_SNYK_TOKEN="${{ needs.change-scope.outputs.has-snyk-token }}"

          FAILED=0

          echo "=== CI Result Gate ==="
          echo "code=$CODE is_pr=$IS_PR is_dependabot=$IS_DEPENDABOT"
          echo ""

          # -- change-scope must succeed (upstream data provider) --
          CHANGE_SCOPE="${{ needs.change-scope.result }}"
          echo "change-scope: $CHANGE_SCOPE"
          if [[ "$CHANGE_SCOPE" != "success" ]]; then
            echo "  FAIL: change-scope must succeed but got $CHANGE_SCOPE"
            FAILED=1
          fi
          echo ""

          echo "-- Always Required --"
          for entry in "${always_required[@]}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            echo "  $name: $result"
            if [[ "$result" != "success" ]]; then
              echo "  FAIL: $name is required but got $result"
              FAILED=1
            fi
          done

          echo ""
          echo "-- Code-Conditional --"
          for entry in "${code_conditional[@]}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            echo "  $name: $result (code=$CODE)"
            if [[ "$CODE" == "true" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "  FAIL: $name is required (code changed) but got $result"
                FAILED=1
              fi
            else
              if [[ "$result" == "failure" ]]; then
                echo "  FAIL: $name failed unexpectedly"
                FAILED=1
              fi
            fi
          done

          echo ""
          echo "-- Docs-Conditional (docs floor; required when docs OR code changed) --"
          # spec-152 T-34 (D-152-22): docs-gate runs the cheap floor whenever
          # docs or code change. Required to succeed in that case; a skip is
          # tolerated only when neither changed; a failure always fails.
          for entry in "${docs_conditional[@]}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            echo "  $name: $result (docs=$DOCS, code=$CODE)"
            if [[ "$DOCS" == "true" || "$CODE" == "true" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "  FAIL: $name is required (docs or code changed) but got $result"
                FAILED=1
              fi
            else
              if [[ "$result" == "failure" ]]; then
                echo "  FAIL: $name failed unexpectedly"
                FAILED=1
              fi
            fi
          done

          echo ""
          echo "-- PR-Only (dependabot exempt) --"
          for entry in "${pr_only[@]}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            echo "  $name: $result (is_pr=$IS_PR, is_dependabot=$IS_DEPENDABOT)"
            if [[ "$IS_PR" == "true" && "$IS_DEPENDABOT" == "false" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "  FAIL: $name is required for non-dependabot PRs but got $result"
                FAILED=1
              fi
            else
              if [[ "$result" == "failure" ]]; then
                echo "  FAIL: $name failed unexpectedly"
                FAILED=1
              fi
            fi
          done

          echo ""
          echo "-- PR-All (dependabot INCLUDED) --"
          # MUST succeed on every PR including dependabot; skip tolerated on push.
          for entry in "${pr_all[@]}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            echo "  $name: $result (is_pr=$IS_PR, is_dependabot=$IS_DEPENDABOT)"
            if [[ "$IS_PR" == "true" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "  FAIL: $name is required on all PRs (dependabot included) but got $result"
                FAILED=1
              fi
            else
              if [[ "$result" == "failure" ]]; then
                echo "  FAIL: $name failed unexpectedly"
                FAILED=1
              fi
            fi
          done

          echo ""
          echo "-- Token-Conditional (snyk; required iff token provisioned) --"
          # has-snyk-token == 'true'  -> snyk MUST succeed; a skip is a FAIL.
          # has-snyk-token == 'false' -> token unprovisioned OR a fork PR where
          #   GitHub withholds repo secrets; a skip is TOLERATED, only an
          #   explicit failure fails the gate (D-152-08). This is what keeps the
          #   repo's CI green today and flips to enforcing on token provisioning.
          for entry in "${token_conditional[@]}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            echo "  $name: $result (has_snyk_token=$HAS_SNYK_TOKEN)"
            if [[ "$HAS_SNYK_TOKEN" == "true" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "  FAIL: $name is required when SNYK_TOKEN is provisioned but got $result"
                FAILED=1
              fi
            else
              # No token (or fork PR secret withheld): tolerate a skip; a real
              # failure (e.g. the job ran via a different path and broke) fails.
              if [[ "$result" == "failure" ]]; then
                echo "  FAIL: $name failed unexpectedly"
                FAILED=1
              fi
            fi
          done

          echo ""
          if [[ "$FAILED" -eq 1 ]]; then
            echo "CI Result: FAILED"
            exit 1
          fi
          echo "CI Result: PASSED"
