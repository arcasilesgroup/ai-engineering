name: check
# CI gate — build · lint · typecheck · test · arch · spec run · security · SonarCloud · Snyk (§17).
# Every action is pinned by commit SHA: a tag is mutable, a SHA is not.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bun comes from npm, not from `oven-sh/setup-bun`: this repository's action
      # policy allows GitHub-owned actions plus nine org patterns, and a workflow that
      # names anything else never starts (startup_failure, no logs). Node is on every
      # hosted runner, and the registry pins the version's integrity itself.
      - run: npm install -g bun@1.4.2
      # A workflow GitHub cannot parse never starts: startup_failure, no logs, no jobs.
      # The schema is linted here, template included.
      - name: Workflow schema
        run: |
          set -euo pipefail
          sh scripts/toolchain.sh actionlint
          cp templates/ci.yml.tpl "$RUNNER_TEMP/ci-tpl.yml"
          actionlint .github/workflows/*.yml "$RUNNER_TEMP/ci-tpl.yml"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint (oxlint)
        run: bun run lint
      - name: Unit + adversarial tests
        run: bun test
      - name: CLI sandbox proofs (NO_COLOR, six init paths, update idempotence, uninstall)
        run: sh scripts/proof-cli-ux.sh
      - name: Architecture
        run: bun run arch
      # The spec runner needs the binary and the canon it executes: without the
      # build, `bun dist/ai-eng` dies with "Script not found" (dist/ is gitignored).
      # A contract check that cannot run is a FAIL, never silence (§09.3).
      - name: Build the binary the contract runner executes
        run: bun run build
      # One verb, not two: `update` restores the git floor (.git/hooks is not
      # versioned, so every clone starts without it — a state no contributor caused)
      # AND installs the canon the contract runner reads.
      - name: Make this checkout match the binary (canon + floor + lock)
        run: ./dist/ai-eng update --yes
      # Between milestones there is no live contract, and that is a legitimate state,
      # not a failure — but a lock that still pins an approved contract whose
      # spec.html has vanished is not: that is a contract someone deleted. A check
      # that cannot run stays a FAIL.
      - name: Spec run — a live contract is enforced, a vanished one is a failure
        run: |
          set -euo pipefail
          if [ ! -f .ai-engineering/spec.html ]; then
            if grep -q spec_sha256 .ai-engineering/ai-eng.lock; then
              echo "::error::the lock pins an approved contract and spec.html is gone — restore it, or reopen the slot."
              exit 1
            fi
            echo "no live contract — nothing to enforce between milestones"
            exit 0
          fi
          ./dist/ai-eng spec run
      - name: Doctor (canon drift · lock version · spec pin · receipts)
        run: ./dist/ai-eng doctor

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # bun comes from npm, not from `oven-sh/setup-bun`: this repository's action
      # policy allows GitHub-owned actions plus nine org patterns, and a workflow that
      # names anything else never starts (startup_failure, no logs). Node is on every
      # hosted runner, and the registry pins the version's integrity itself.
      - run: npm install -g bun@1.4.2
      - name: The scanners (version + sha256, no action, no unpinned download)
        run: sh scripts/toolchain.sh gitleaks trivy
      - run: gitleaks detect --redact -v --no-banner
      # --config p/ci, never `auto`: auto refuses to run with metrics off, and a
      # governance gate that phones home is not a governance gate.
      - name: semgrep (pinned, no telemetry)
        run: |
          pipx install semgrep==1.172.0
          semgrep scan --error --config p/ci --metrics=off
      # trivy comes from scripts/toolchain.sh, where the digest lives in this
      # repository: an action that installs trivy by version carries no checksum
      # (audit SC-06).
      - name: trivy (filesystem, HIGH+CRITICAL)
        run: trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --quiet .
      # `npm audit` cannot read bun.lock (ENOLOCK: it wants a package-lock.json).
      # `bun audit` is the same check for the lockfile this repository actually has,
      # and it fails the step on a finding instead of discarding the result.
      - name: bun audit (a result that is discarded is decoration)
        run: bun audit --audit-level=high

  guards-adversarial:
    runs-on: ubuntu-latest
    # The 21 payloads that try to break a guard, routed by path: if the PR did not
    # touch governance, the oracle has nothing new to say. This is NOT mutation
    # testing — generating mutants is its own milestone (§17.1).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bun comes from npm, not from `oven-sh/setup-bun`: this repository's action
      # policy allows GitHub-owned actions plus nine org patterns, and a workflow that
      # names anything else never starts (startup_failure, no logs). Node is on every
      # hosted runner, and the registry pins the version's integrity itself.
      - run: npm install -g bun@1.4.2
      - run: bun install --frozen-lockfile
      - name: Adversarial oracle over changed guards
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" -- src/guards src/chain src/floor | head -1)
          if [ -n "$CHANGED" ]; then bun test tests/adversarial/; else echo "governance untouched — oracle skipped"; fi

  # The two gates that need an external account (SONAR_TOKEN, SNYK_TOKEN). A fork PR is
  # handed no secret, and a job-level `if` cannot read one, so the tokens are probed in
  # a step and the jobs are SKIPPED when they are absent — never run green as if they
  # had checked something.
  tokens:
    runs-on: ubuntu-latest
    outputs:
      sonar: ${{ steps.probe.outputs.sonar }}
      snyk: ${{ steps.probe.outputs.snyk }}
    steps:
      - id: probe
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$SONAR_TOKEN" ] && echo "sonar=true" >> "$GITHUB_OUTPUT" || echo "sonar=false" >> "$GITHUB_OUTPUT"
          [ -n "$SNYK_TOKEN" ] && echo "snyk=true" >> "$GITHUB_OUTPUT" || echo "snyk=false" >> "$GITHUB_OUTPUT"

  sonarcloud:
    name: SonarCloud
    needs: [tokens]
    if: needs.tokens.outputs.sonar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar cannot tell new code from old without the history.
          fetch-depth: 0
      - run: npm install -g bun@1.4.2
      - run: bun install --frozen-lockfile
      # Coverage is off in bunfig (`[test] coverage = false`), and bun 1.4.2 lets the
      # config file beat the flag: `bun test --coverage` alone wrote no report
      # (measured). So this job runs the suite against a config of its own and leaves
      # the fast local default untouched.
      - name: Tests with the lcov report Sonar reads
        run: |
          set -euo pipefail
          printf '[test]\ncoverage = true\ncoverageReporter = ["lcov"]\ncoverageDir = "coverage"\n' > "$RUNNER_TEMP/bunfig.coverage.toml"
          bun --config="$RUNNER_TEMP/bunfig.coverage.toml" test
          # bun records every file it loaded, and the carrier tests materialize their own
          # copies under the system temp dir — files that are not in this project, so
          # Sonar can map them nowhere and they only blur the metric. Keep what Sonar
          # can resolve: the sources it analyzes.
          awk '/^SF:/{keep = ($0 ~ /^SF:src\//)} keep' coverage/lcov.info > coverage/lcov.src.info
          mv coverage/lcov.src.info coverage/lcov.info
          test -s coverage/lcov.info
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk:
    name: Snyk
    needs: [tokens]
    if: needs.tokens.outputs.snyk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The CLI, not `snyk/actions`: the snyk pattern is not in this repository's action
      # policy, and a workflow naming an action outside that list never starts at all.
      # 1.1307.1 is the newest stable older than the 7-day floor bunfig.toml sets.
      - name: Snyk CLI (pinned, no install scripts)
        run: npm install -g snyk@1.1307.1 --ignore-scripts
      # Snyk's npm plugin reads a package-lock.json, and this repository installs from
      # bun.lock, which Snyk does not parse. The lock is generated from package.json, so
      # the dependency SET is what Snyk tests against its database; `bun audit` in the
      # security job stays the lockfile-accurate gate, and this one adds SAST.
      - name: The lockfile Snyk reads (generated, never committed)
        run: npm install --package-lock-only --ignore-scripts
      - name: Snyk open source (high and critical)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=package-lock.json --severity-threshold=high
      - name: Snyk Code, SAST (high and critical)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          # The runner's shell is `bash -e`, and a failing command substitution in an
          # assignment (`out=$(cmd)`) makes -e exit the step on the spot: the first
          # version of this gate died 59s in with the reason unprinted. Collect through
          # `if`, which -e does not short-circuit, and print before deciding.
          if out=$(snyk code test --severity-threshold=high 2>&1); then
            printf '%s\n' "$out"
            exit 0
          else
            code=$?
          fi
          printf '%s\n' "$out"
          echo "snyk code test exited ${code}"
          # A plan out of tests, or a Snyk Code that is not provisioned for this org, is
          # not a vulnerability: name what was skipped and let semgrep keep its verdict.
          if printf '%s' "$out" | grep -qiE 'test limit|increase your tests|rate.?limit|429|too many requests|authentication (error|failed)|not authori|quota|not enabled|not provisioned|unsupported'; then
            echo "::warning title=Snyk Code non-blocking::snyk code test unavailable — non-blocking; semgrep covers SAST."
            exit 0
          fi
          exit "$code"
      - name: Monitor (main only)
        if: github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --file=package-lock.json || echo "::warning title=Snyk monitor non-blocking::snyk monitor failed — the badge keeps the last good report."
