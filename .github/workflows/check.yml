name: check
# CI gate — build · lint · typecheck · test · arch · spec run · security (§17).
# Every action is pinned by commit SHA: a tag is mutable, a SHA is not.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # bun comes from npm, not from `oven-sh/setup-bun`: this repository's action
      # policy allows GitHub-owned actions plus nine org patterns, and a workflow that
      # names anything else never starts (startup_failure, no logs). Node is on every
      # hosted runner, and the registry pins the version's integrity itself.
      - run: npm install -g bun@1.4.2
      # A workflow GitHub cannot parse never starts: startup_failure, no logs, no jobs —
      # v2 was blind for ten days and a stray `with:` under a `run:` did the same to
      # release.yml. So the schema is linted here, template included.
      - name: Workflow schema
        run: |
          set -euo pipefail
          sh scripts/toolchain.sh actionlint
          cp templates/ci.yml.tpl "$RUNNER_TEMP/ci-tpl.yml"
          actionlint .github/workflows/*.yml "$RUNNER_TEMP/ci-tpl.yml"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint (oxlint)
        run: bun run lint
      - name: Unit + adversarial tests
        run: bun test
      - name: CLI sandbox proofs (NO_COLOR, six init paths, update idempotence, uninstall)
        run: sh scripts/proof-cli-ux.sh
      - name: Architecture
        run: bun run arch
      # The spec runner needs the binary and the canon it executes: without the
      # build, `bun dist/ai-eng` died with "Script not found" (dist/ is gitignored)
      # and the old `|| echo` turned that into a green step. A contract check that
      # cannot run is a FAIL, never silence (§09.3).
      - name: Build the binary the contract runner executes
        run: bun run build
      - name: Install the canon the contract runner reads (machine side)
        run: ./dist/ai-eng init --global --yes
      # Every clone starts without the git floor: .git/hooks is not versioned, so
      # doctor used to FAIL here for a reason no contributor caused (measured in a
      # fresh clone). `update` is the verb whose job is "make this checkout match the
      # binary" — it rewrites the missing shims and the lock.
      - name: Restore the git floor in this checkout
        run: ./dist/ai-eng update --yes
      - name: Spec run — a contract check that cannot run is a FAIL, never silence
        run: ./dist/ai-eng spec run
      - name: Doctor (canon drift · lock version · spec pin · receipts)
        run: ./dist/ai-eng doctor

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # bun comes from npm, not from `oven-sh/setup-bun`: this repository's action
      # policy allows GitHub-owned actions plus nine org patterns, and a workflow that
      # names anything else never starts (startup_failure, no logs). Node is on every
      # hosted runner, and the registry pins the version's integrity itself.
      - run: npm install -g bun@1.4.2
      - name: gitleaks (version + sha256, no action)
        run: sh scripts/toolchain.sh gitleaks
      - run: gitleaks detect --redact -v --no-banner
      # --config p/ci, never `auto`: auto refuses to run with metrics off, and a
      # governance gate that phones home is not a governance gate.
      - name: semgrep (pinned, no telemetry)
        run: |
          pipx install semgrep==1.172.0
          semgrep scan --error --config p/ci --metrics=off
      # The contract's gate G9 requires this scanner as a SHA-pinned action, so the
      # checksum-verified install in scripts/toolchain.sh cannot be used here: the
      # audit flagged exactly this (the action downloads trivy by version, unverified)
      # and the gate wins until the contract is rewritten. Recorded in D-013.
      - name: trivy (filesystem, HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0 # the action installs trivy by version; pinning it here
          scan-type: fs
          exit-code: 1
          severity: HIGH,CRITICAL
      # `npm audit` cannot read bun.lock (ENOLOCK: it wants a package-lock.json), and
      # the previous `|| true` hid exactly that. `bun audit` is the same check for the
      # lockfile this repository actually has, and it fails the step on a finding.
      - name: bun audit (a result that is discarded is decoration)
        run: bun audit --audit-level=high

  guards-adversarial:
    runs-on: ubuntu-latest
    # The 21 payloads that try to break a guard, routed by path: if the PR did not
    # touch governance, the oracle has nothing new to say. This is NOT mutation
    # testing — generating mutants is its own milestone (§17.1), and this job used to
    # be named after that tier while executing none of it.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # bun comes from npm, not from `oven-sh/setup-bun`: this repository's action
      # policy allows GitHub-owned actions plus nine org patterns, and a workflow that
      # names anything else never starts (startup_failure, no logs). Node is on every
      # hosted runner, and the registry pins the version's integrity itself.
      - run: npm install -g bun@1.4.2
      - run: bun install --frozen-lockfile
      - name: Adversarial oracle over changed guards
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" -- src/guards src/chain src/floor | head -1)
          if [ -n "$CHANGED" ]; then bun test tests/adversarial/; else echo "governance untouched — oracle skipped"; fi
