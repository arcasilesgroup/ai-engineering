name: Test Hooks Matrix

# spec-114 G-4 + D-114-04: targeted cross-OS matrix that exercises only
# the hook surface (Codex bridges, _lib, Copilot adapters).
# Full-suite cross-OS lives in ci-check.yml; this workflow gives us the
# 95% cross-platform signal at <10% of the runtime cost (D-114-04).
#
# Per D-114-03 hot-path SLO violations are advisory through 2026-05-31;
# we do NOT run `ai-eng doctor --check hot-path` as a blocking step here.
#
# Action SHAs are pinned to match ci-check.yml so dependabot can update
# both workflows in lockstep (spec-110 Article VI governance).

on:
  push:
    branches: [main, "rewrite/**", "run/**"]
    paths:
      - '.ai-engineering/scripts/hooks/**'
      - 'src/ai_engineering/templates/.ai-engineering/scripts/hooks/**'
      - 'tests/unit/_lib/**'
      - 'tests/unit/hooks/**'
      - 'tests/integration/test_codex_hooks.py'
      - 'tests/integration/test_copilot_*'
      - '.github/workflows/test-hooks-matrix.yml'
  pull_request:
    branches: [main]
    paths:
      - '.ai-engineering/scripts/hooks/**'
      - 'src/ai_engineering/templates/.ai-engineering/scripts/hooks/**'
      - 'tests/unit/_lib/**'
      - 'tests/unit/hooks/**'
      - 'tests/integration/test_codex_hooks.py'
      - 'tests/integration/test_copilot_*'
      - '.github/workflows/test-hooks-matrix.yml'

permissions:
  contents: read

concurrency:
  group: test-hooks-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-hooks:
    name: Hook Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: Cache spec-104 gate-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ai-engineering/cache/gate/
          key: gate-cache-hooks-${{ runner.os }}-${{ hashFiles('pyproject.toml', '.ruff.toml') }}
          restore-keys: |
            gate-cache-hooks-${{ runner.os }}-
      - name: Configure git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"
      - name: Run hook tests
        # D-114-04: scope intentionally narrow to the hook surface.
        # Full-suite cross-OS continues to live in ci-check.yml.
        run: |
          uv run pytest \
            tests/unit/_lib \
            tests/unit/hooks \
            tests/integration/test_codex_hooks.py \
            tests/integration/test_copilot_explorer_rename.py \
            -v --durations=10
      - name: Run slow hook tests
        # spec-126 D-126-03: the slow concurrent-append stress test
        # (tests/unit/hooks/test_ndjson_concurrent_append.py) is
        # deselected by default via pyproject.toml `addopts = "-m 'not
        # slow'"` to keep the local pre-commit hot path under budget.
        # The matrix run still exercises it cross-OS via this dedicated
        # step (-m slow flips the selector to include only slow tests).
        run: |
          uv run pytest -m slow \
            tests/unit/hooks \
            -v --durations=10
