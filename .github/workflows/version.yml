name: version
# Changesets owns the version arithmetic: it reads the pending changesets, bumps
# package.json and the CHANGELOG, and opens the Version Packages PR. It does NOT
# publish — publishing is release.yml's job, behind the `release` environment, so a
# package can never exist without the binaries it names and there is one channel per
# artifact. Merge this PR, then dispatch the deployment with the channel you mean:
#
#   integration → a candidate: GitHub prerelease + npm dist-tag `next`
#   production  → the real one: GitHub release (latest) + npm dist-tag `latest`
on:
  push:
    branches: [main]

jobs:
  version:
    if: github.repository == 'arcasilesgroup/ai-engineering'
    permissions:
      contents: write # pushing the version branch
      pull-requests: write # opening/updating the Version Packages PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npm install -g bun@1.4.2
      - run: bun install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: npx changeset version
          # Deliberately not a publish: a workflow that both versions and deploys makes
          # the deployment a side effect of merging, and that is exactly what made
          # "release" and "version" read as two competing channels.
          publish-script: echo "versioning only — the deployment is release.yml (channel=integration|production)"
