name: version
# Changesets owns the version arithmetic: it reads the pending changesets, bumps
# package.json and the CHANGELOG, and opens the Version Packages PR. It does NOT
# publish — publishing is release.yml's job, behind the `release` environment, so a
# package can never exist without the binaries it names and there is one channel per
# artifact. Merge this PR, then dispatch the deployment with the channel you mean:
#
#   integration → a candidate: GitHub prerelease + npm dist-tag `next`
#   production  → the real one: GitHub release (latest) + npm dist-tag `latest`
on:
  push:
    branches: [main]

jobs:
  version:
    if: github.repository == 'arcasilesgroup/ai-engineering'
    permissions:
      contents: write # pushing the version branch
      pull-requests: write # opening/updating the Version Packages PR
      actions: write # approving the runs the bounce creates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g bun@1.4.4
      - run: bun install --frozen-lockfile
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        id: changesets
        with:
          version-script: npx changeset version
          # Deliberately not a publish: a workflow that both versions and deploys makes
          # the deployment a side effect of merging, so versioning stays here and the
          # deployment is release.yml's job with an explicit channel.
          publish-script: echo "versioning only — the deployment is release.yml (channel=integration|production)"
      # GITHUB_TOKEN-created PRs are a CI dead zone: a pull_request event raised by
      # this workflow's own token starts nothing (docs.github.com/en/actions/
      # concepts/security/github_token), so the Version Packages PR merged green-on-
      # nothing (PR #769). Close and reopen it — the reopen event carries an identity
      # that is not this job's token, and that one does trigger the pull_request
      # workflows. No open PR means there was nothing to version: stop quietly.
      - name: Bounce the Version Packages PR so its own CI runs (close + reopen)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head changeset-release/main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "no Version Packages PR open — nothing to version, nothing to bounce"
            exit 0
          fi
          reason="Closed and reopened by the version workflow so the pull_request workflows run: a PR opened with GITHUB_TOKEN does not trigger them (github.com/actions/docs#suppressed-workflow-runs)."
          gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --comment "$reason"
          gh pr reopen "$pr" --repo "$GITHUB_REPOSITORY"
          # The reopened runs carry this token's identity and GitHub parks them in
          # action_required, which is CI dead in a different costume. Approve them here;
          # actions: write is already granted above, and if the token cannot approve the
          # step logs the ids so a person can click Approve instead.
          sleep 10
          gh run list --repo "$GITHUB_REPOSITORY" --branch changeset-release/main --limit 10 \
            --json databaseId,conclusion --jq '.[] | select(.conclusion == "action_required") | .databaseId' \
            | while read -r run; do
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve" >/dev/null \
                  && echo "approved run $run" \
                  || echo "run $run still needs a person: approve it in Actions"
              done
