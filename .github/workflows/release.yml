name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Protected recovery version (for example, 1.2.3 or v1.2.3)."
        required: true
        type: string
      recovery_reason:
        description: "Required audit reason for manually recovering the tag-triggered release."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name || github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve version and recovery context
    if: >-
      github.repository == 'arcasilesgroup/ai-engineering' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag-name: ${{ steps.resolve.outputs.tag_name }}
      recovery: ${{ steps.resolve.outputs.recovery }}
      recovery-reason: ${{ steps.resolve.outputs.recovery_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version and recovery context
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          RECOVERY_REASON: ${{ github.event.inputs.recovery_reason || '' }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
            RECOVERY="false"
            RECOVERY_REASON=""
          else
            if [ -z "${INPUT_VERSION}" ]; then
              echo "::error::workflow_dispatch recovery requires version"
              exit 1
            fi
            if [ -z "${RECOVERY_REASON}" ]; then
              echo "::error::workflow_dispatch recovery requires recovery_reason"
              exit 1
            fi
            VERSION="${INPUT_VERSION#v}"
            TAG_NAME="v${VERSION}"
            RECOVERY="true"
          fi

          if [[ ! "${TAG_NAME}" == v* ]]; then
            echo "::error::release tag must start with v*: ${TAG_NAME}"
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG_NAME} does not exist"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "tag_name=${TAG_NAME}"
            echo "recovery=${RECOVERY}"
            echo "recovery_reason<<EOF"
            printf '%s\n' "${RECOVERY_REASON}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "Resolved release ${TAG_NAME} (recovery=${RECOVERY})"

  release-readiness:
    name: Release readiness
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout release tag source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-version.outputs.tag-name }}
          path: release-source
          fetch-depth: 0

      - uses: ./.github/actions/setup-env
        with:
          enable-cache: "false"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Generate release-readiness.json
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          uv run ai-eng --json verify --release "${VERSION}" --target release-source > release-readiness-envelope.json
          VERIFY_STATUS=$?
          set -e
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          envelope_path = Path("release-readiness-envelope.json")
          envelope = json.loads(envelope_path.read_text(encoding="utf-8"))
          version = os.environ["VERSION"]

          def find_readiness(value):
              if not isinstance(value, dict):
                  return None
              nested = value.get("release_readiness")
              if isinstance(nested, dict):
                  return nested
              if {"verdict", "dimensions", "artifact_path"}.issubset(value):
                  return value
              for key in ("result", "data", "payload"):
                  nested_payload = find_readiness(value.get(key))
                  if nested_payload is not None:
                      return nested_payload
              return None

          payload = find_readiness(envelope)
          if payload is None:
              cli_artifact = (
                  Path("release-source")
                  / ".ai-engineering"
                  / "runtime"
                  / "release"
                  / version
                  / "release-readiness.json"
              )
              if cli_artifact.is_file():
                  payload = json.loads(cli_artifact.read_text(encoding="utf-8"))

          if payload is None:
              result = envelope.get("result") if isinstance(envelope, dict) else None
              error = envelope.get("error") if isinstance(envelope, dict) else None
              print(
                  "::error::release readiness JSON missing release_readiness payload; "
                  f"top-level keys={sorted(envelope) if isinstance(envelope, dict) else type(envelope).__name__}; "
                  f"result keys={sorted(result) if isinstance(result, dict) else type(result).__name__}; "
                  f"error={error!r}"
              )
              sys.exit(1)

          Path("release-readiness.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          verdict = str(payload.get("verdict", "")).upper().replace("_", "-")
          print(f"Release readiness verdict: {verdict}")
          if verdict == "NO-GO":
              print("::error::release readiness returned NO-GO")
              sys.exit(1)
          if verdict not in {"GO", "CONDITIONAL GO"}:
              print(f"::error::release readiness JSON missing valid verdict: {verdict!r}")
              sys.exit(1)
          PY
          if [ "${VERIFY_STATUS}" -ne 0 ]; then
            echo "::error::ai-eng verify --release exited ${VERIFY_STATUS}"
            exit "${VERIFY_STATUS}"
          fi

      - name: Upload release readiness evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-readiness
          path: release-readiness.json
          if-no-files-found: warn
          retention-days: 7

  release-build:
    name: Build release artifacts once
    needs: [resolve-version, release-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-version.outputs.tag-name }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-env
        with:
          enable-cache: "false"

      - name: Build package distributions
        run: uv build

      - name: Validate package metadata version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          import tarfile
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          expected = os.environ["VERSION"]
          dist = Path("dist")
          artifacts = sorted(dist.glob("*.whl")) + sorted(dist.glob("*.tar.gz"))
          if not artifacts:
              print("::error::dist/ contains no wheel or sdist artifacts")
              sys.exit(1)

          for artifact in artifacts:
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      metadata_name = next(
                          name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
                      )
                      metadata_text = archive.read(metadata_name).decode("utf-8")
              else:
                  with tarfile.open(artifact, "r:gz") as archive:
                      member = next(
                          item for item in archive.getmembers() if item.name.endswith("/PKG-INFO")
                      )
                      extracted = archive.extractfile(member)
                      if extracted is None:
                          print(f"::error::{artifact} is missing PKG-INFO")
                          sys.exit(1)
                      metadata_text = extracted.read().decode("utf-8")
              version = Parser().parsestr(metadata_text).get("Version")
              if version != expected:
                  print(f"::error::{artifact} metadata Version {version!r} != {expected!r}")
                  sys.exit(1)
              print(f"{artifact}: Version {version}")
          PY

      - name: Clean environment install smoke from local dist
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/release-dist-smoke
          /tmp/release-dist-smoke/bin/python -m pip install --upgrade pip
          /tmp/release-dist-smoke/bin/python -m pip install --find-links dist "ai-engineering==${VERSION}"
          /tmp/release-dist-smoke/bin/ai-eng version

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          uv export --no-dev --frozen > requirements-prod.txt
          uv run --with "cyclonedx-bom==7.3.0" cyclonedx-py requirements requirements-prod.txt \
            --output-format json \
            -o sbom.cdx.json \
            --spec-version 1.5

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          sha256sum dist/* sbom.cdx.json > CHECKSUMS-SHA256.txt
          cat CHECKSUMS-SHA256.txt

      - name: Upload release-dists artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dists
          path: dist/*
          retention-days: 7

      - name: Upload release-supply-chain artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-supply-chain
          path: |
            sbom.cdx.json
            CHECKSUMS-SHA256.txt
          retention-days: 7

  attest-and-verify:
    name: Attest and verify GitHub provenance
    needs: [resolve-version, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download release-dists artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dists
          path: dist

      - name: Generate GitHub artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Verify GitHub artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p packet
          : > packet/github-attestation-verify.log
          for artifact in dist/*; do
            echo "## gh attestation verify $(basename "${artifact}")" | tee -a packet/github-attestation-verify.log
            if output="$(gh attestation verify "${artifact}" --repo "${REPO}" 2>&1)"; then
              if [ -n "${output}" ]; then
                printf '%s\n' "${output}" | tee -a packet/github-attestation-verify.log
              fi
              echo "Result: PASS (exit 0)" | tee -a packet/github-attestation-verify.log
            else
              status=$?
              if [ -n "${output}" ]; then
                printf '%s\n' "${output}" | tee -a packet/github-attestation-verify.log
              fi
              echo "Result: FAIL (exit ${status})" | tee -a packet/github-attestation-verify.log
              exit "${status}"
            fi
            echo | tee -a packet/github-attestation-verify.log
          done

      - name: Upload attestation verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-attestation-proof
          path: packet/github-attestation-verify.log
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [resolve-version, release-readiness, release-build, attest-and-verify]
    if: >-
      github.repository == 'arcasilesgroup/ai-engineering' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ai-engineering/${{ needs.resolve-version.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release-dists artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dists
          path: dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Capture TestPyPI publish proof
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          cat > testpypi-proof.txt <<EOF
          TestPyPI publish completed
          Package: ai-engineering==${VERSION}
          URL: https://test.pypi.org/project/ai-engineering/${VERSION}/
          CI run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Upload TestPyPI publish proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-testpypi-proof
          path: testpypi-proof.txt
          retention-days: 7

  verify-testpypi-install:
    name: Verify TestPyPI install
    needs: [resolve-version, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release from TestPyPI
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/testpypi-smoke
          /tmp/testpypi-smoke/bin/python -m pip install --upgrade pip
          # TestPyPI's index can lag seconds-to-minutes behind a successful
          # upload before "pkg==version" resolves (the publish itself already
          # succeeded upstream), so poll with backoff instead of failing on the
          # first miss. 20 attempts x 15s caps polling at ~5 min, well inside
          # this job's 10-minute timeout.
          ATTEMPTS=20
          SLEEP_SECONDS=15
          installed=false
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            if /tmp/testpypi-smoke/bin/python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "ai-engineering==${VERSION}"; then
              installed=true
              echo "Installed ai-engineering==${VERSION} from TestPyPI (attempt ${attempt}/${ATTEMPTS})"
              break
            fi
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              echo "::warning::ai-engineering==${VERSION} not resolvable on TestPyPI yet (attempt ${attempt}/${ATTEMPTS}); retrying in ${SLEEP_SECONDS}s — TestPyPI index propagation lag"
              sleep "${SLEEP_SECONDS}"
            fi
          done
          if [ "${installed}" != "true" ]; then
            echo "::error::ai-engineering==${VERSION} did not become installable from TestPyPI after ${ATTEMPTS} attempts (~$((ATTEMPTS * SLEEP_SECONDS / 60)) min of polling)"
            exit 1
          fi
          /tmp/testpypi-smoke/bin/ai-eng version
          cat > testpypi-install-proof.txt <<EOF
          TestPyPI install proof completed
          Package: ai-engineering==${VERSION}
          EOF

      - name: Upload TestPyPI install proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-testpypi-install-proof
          path: testpypi-install-proof.txt
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs:
      - resolve-version
      - release-readiness
      - release-build
      - attest-and-verify
      - publish-testpypi
      - verify-testpypi-install
    if: >-
      github.repository == 'arcasilesgroup/ai-engineering' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ai-engineering/${{ needs.resolve-version.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release-dists artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dists
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

      - name: Capture PyPI publish proof
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          cat > pypi-proof.txt <<EOF
          PyPI publish completed
          Package: ai-engineering==${VERSION}
          URL: https://pypi.org/project/ai-engineering/${VERSION}/
          CI run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Upload PyPI publish proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-pypi-proof
          path: pypi-proof.txt
          retention-days: 7

  finalize-release-packet:
    name: Finalize GitHub Release packet
    needs:
      - resolve-version
      - release-readiness
      - release-build
      - attest-and-verify
      - publish-testpypi
      - verify-testpypi-install
      - publish-pypi
    if: >-
      github.repository == 'arcasilesgroup/ai-engineering' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-version.outputs.tag-name }}
          fetch-depth: 0

      - name: Download release-dists artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dists
          path: dist

      - name: Download release-supply-chain artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-supply-chain
          path: supply-chain

      - name: Download release-readiness artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-readiness
          path: packet

      - name: Download attestation verification proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-attestation-proof
          path: packet

      - name: Download TestPyPI publish proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-testpypi-proof
          path: packet

      - name: Download TestPyPI install proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-testpypi-install-proof
          path: packet

      - name: Download PyPI publish proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-pypi-proof
          path: packet

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TAG_NAME: ${{ needs.resolve-version.outputs.tag-name }}
        run: |
          set -euo pipefail
          awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" \
            CHANGELOG.md > packet/release-notes-full.md
          if [ ! -s packet/release-notes-full.md ]; then
            echo "::error::CHANGELOG.md is missing non-empty release notes for ${VERSION}"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          GITHUB_RELEASE_BODY_LIMIT = 125_000
          RELEASE_BODY_HEADROOM = 4_096
          MAX_RELEASE_BODY_BYTES = GITHUB_RELEASE_BODY_LIMIT - RELEASE_BODY_HEADROOM

          packet_dir = Path("packet")
          full_notes_path = packet_dir / "release-notes-full.md"
          release_notes_path = packet_dir / "release-notes.md"
          version = os.environ["VERSION"]
          tag = os.environ["TAG_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          full_notes = full_notes_path.read_text(encoding="utf-8")
          full_notes_bytes = len(full_notes.encode("utf-8"))

          if full_notes_bytes <= MAX_RELEASE_BODY_BYTES:
              release_notes_path.write_text(full_notes, encoding="utf-8")
              raise SystemExit(0)

          def truncate_utf8(text: str, max_bytes: int) -> str:
              encoded = text.encode("utf-8")
              if len(encoded) <= max_bytes:
                  return text
              return encoded[:max_bytes].decode("utf-8", errors="ignore").rstrip()

          changelog_url = f"https://github.com/{repo}/blob/{tag}/CHANGELOG.md"
          prefix = f"""# ai-engineering {tag}

          The full CHANGELOG section for `{version}` is {full_notes_bytes} bytes, which
          exceeds GitHub's {GITHUB_RELEASE_BODY_LIMIT}-byte release body limit. This
          GitHub Release body is therefore capped deliberately; the complete notes are
          attached as `release-notes-full.md` and remain canonical in CHANGELOG.md.

          Full changelog at tag: {changelog_url}

          ---

          """
          suffix = """

          ---

          _Release notes truncated for GitHub's release body limit. Download
          `release-notes-full.md` from this release packet, or read the full
          CHANGELOG.md section at the tag link above._
          """
          remaining = MAX_RELEASE_BODY_BYTES - len(prefix.encode("utf-8")) - len(
              suffix.encode("utf-8")
          )
          if remaining <= 0:
              release_notes = prefix + suffix
          else:
              release_notes = prefix + truncate_utf8(full_notes, remaining) + suffix
          release_notes_path.write_text(release_notes, encoding="utf-8")
          PY

      - name: Write release-packet.json manifest
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TAG_NAME: ${{ needs.resolve-version.outputs.tag-name }}
          RECOVERY: ${{ needs.resolve-version.outputs.recovery }}
          RECOVERY_REASON: ${{ needs.resolve-version.outputs.recovery-reason }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          packet_dir = Path("packet")
          readiness = json.loads((packet_dir / "release-readiness.json").read_text(encoding="utf-8"))
          checksums = Path("supply-chain/CHECKSUMS-SHA256.txt").read_text(encoding="utf-8")
          tag = os.environ["TAG_NAME"]
          version = os.environ["VERSION"]
          release_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}"
          ci_run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          manifest = {
              "schema": "ai-engineering/release-packet/v1",
              "version": version,
              "tag": tag,
              "release_url": release_url,
              "ci_run_url": ci_run_url,
              "artifact_sources": {
                  "release-dists": sorted(path.name for path in Path("dist").glob("*")),
                  "release-supply-chain": ["CHECKSUMS-SHA256.txt", "sbom.cdx.json"],
              },
              "checksums_sha256": checksums,
              "readiness": readiness,
              "attestation_verification": "github-attestation-verify.log",
              "testpypi": {
                  "publish_proof": "testpypi-proof.txt",
                  "install_proof": "testpypi-install-proof.txt",
                  "url": f"https://test.pypi.org/project/ai-engineering/{version}/",
              },
              "pypi": {
                  "publish_proof": "pypi-proof.txt",
                  "url": f"https://pypi.org/project/ai-engineering/{version}/",
              },
              "changelog_source": "CHANGELOG.md",
              "release_notes": "release-notes.md",
              "release_notes_full": "release-notes-full.md",
              "recovery": {
                  "used": os.environ.get("RECOVERY") == "true",
                  "reason": os.environ.get("RECOVERY_REASON", ""),
              },
          }
          (packet_dir / "release-packet.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (packet_dir / "release-packet-url.txt").write_text(release_url + "\n", encoding="utf-8")
          PY

      - name: Create or update GitHub Release and upload packet assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-version.outputs.tag-name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG_NAME}" \
              --notes-file packet/release-notes.md \
              --latest
          else
            gh release create "${TAG_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${TAG_NAME}" \
              --notes-file packet/release-notes.md \
              --latest
          fi
          gh release upload "${TAG_NAME}" dist/* supply-chain/* packet/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
