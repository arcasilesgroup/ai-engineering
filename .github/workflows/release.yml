name: release

# Releases are signed by the workflow that built them, not by a long-lived token on
# somebody's laptop. Attestations ship with the wheel so `ai-eng doctor` can verify that
# the running wheel is the one this tag produced.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because the check below asks whether the default branch already
          # contains this commit, and a shallow clone cannot answer that.
          fetch-depth: 0
          persist-credentials: false
      # No tool cache on the job that builds what gets published: a poisoned cache entry
      # would end up inside the wheel this workflow then signs.
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: false

      # A tag can be pushed from any commit on any branch, including one nobody reviewed.
      # Publishing from it puts code on PyPI that the default branch never held, and the
      # only record afterwards is a version number. So the tag has to name something main
      # already contains, and this asks git rather than trusting the person who tagged.
      - name: the tag must name a commit the default branch already holds
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "this tag names a commit origin/main does not contain, so publishing it"
            echo "would ship code the default branch never held"
            exit 1
          }
          echo "the tagged commit is contained in origin/main"

      - name: the tag and the package must agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          test "$tag" = "$pkg" || { echo "tag $tag does not match version $pkg"; exit 1; }
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - run: uv build

      - name: the wheel must carry the guards, or it is not the product
        run: |
          uv run python - <<'PY'
          import zipfile, glob
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["ai_engineering/hooks/chain.py", "ai_engineering/policy/iocs.yml",
                  "ai_engineering/git-hooks/pre-push", "ai_engineering/skills/ai-spec/SKILL.md",
                  "ai_engineering/hooks/change_scope_guard.py",
                  "ai_engineering/policy/risk-acceptance-v1.schema.json",
                  "ai_engineering/acceptance.py", "ai_engineering/acceptance_privacy.py"]
          gone = [n for n in names if n.endswith(("hooks/design_gate.py", "/plan.py", "/digest.py"))]
          if gone:
              raise SystemExit(f"the wheel still carries a hard-renamed file: {gone}")
          missing = [n for n in need if n not in names]
          if missing:
              raise SystemExit(f"the wheel is missing {missing}")
          print("the wheel carries the guards, the policy, the git hooks and the skills")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write      # trusted publishing
      attestations: write
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
