name: release
# Binary release: a v* tag builds the 8 cross-compiled binaries + SBOM + codesign
# macOS and attaches them to the GitHub release version.yml's changesets/action
# created. npm publishing is version.yml's job (OIDC trusted publishing); release.yml
# never publishes npm — one publish path, signed by the registry (§7.1).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
          - target: bun-linux-arm64
            os: ubuntu-latest
          - target: bun-darwin-x64
            os: macos-latest
          - target: bun-darwin-arm64
            os: macos-latest
          - target: bun-windows-x64
            os: windows-latest
          - target: bun-windows-arm64
            os: windows-latest
          - target: bun-linux-musl-x64
            os: ubuntu-latest
          - target: bun-linux-musl-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build --target ${{ matrix.target }} || bun build src/cli.ts --compile --target ${{ matrix.target }} --minify --sourcemap --bytecode --outfile dist/ai-eng
      - name: Codesign macOS binary (Gatekeeper) — skips without the cert secret
        if: runner.os == 'macOS'
        run: |
          if [ -z "$MACOS_CERT" ]; then
            echo "::warning::MACOS_CERT not set — macOS binary unsigned (fine for local/CI dev; ad-hoc only)"
            exit 0
          fi
          echo "$MACOS_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" run.keychain
          security default-keychain -s run.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" run.keychain
          security import "$RUNNER_TEMP/cert.p12" -k run.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" run.keychain
          codesign --force --options runtime --timestamp --keychain run.keychain --sign "$MACOS_CERT_ID" dist/ai-eng
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_CERT_ID: ${{ secrets.MACOS_CERT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ai-eng-${{ matrix.target }}
          path: dist/ai-eng*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: SBOM (CycloneDX — v1 shipped one; so does v2)
        run: |
          curl -sSfL https://github.com/CycloneDX/cdxgen/releases/latest/download/cdxgen-linux-x64 -o cdxgen && chmod +x cdxgen
          ./cdxgen -o sbom.json .
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/**/*
            sbom.json
          generate_release_notes: true
