name: release
# THE deployment: one door, two channels.
#
#   integration → GitHub prerelease + npm dist-tag `next`   (a candidate, for testing)
#   production  → GitHub release (latest) + npm dist-tag `latest`
#
# The version comes from package.json — changesets owns the arithmetic and proposes it
# in a Version Packages PR — so there is exactly one source of truth and the tag is
# derived from it. `channel` declares the intent, and the two must agree: a version
# with a prerelease suffix cannot ship as production, and a final version cannot ship
# as a candidate. A mismatch fails the run instead of publishing the wrong thing.
#
# Dispatch is the only door: `workflow_dispatch` always starts a run, while a tag
# pushed by a workflow using GITHUB_TOKEN starts nothing (docs.github.com/en/actions/
# concepts/security/github_token), and one door means the deployment is an act rather
# than a side effect of pushing a ref. The publish job sits behind the `release`
# environment: the human press is an approval.
#
# npm publishing lives here and nowhere else: one channel per artifact, so a package
# can never exist without the binaries it names.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "integration (prerelease + npm next) or production (latest)"
        required: true
        default: integration
        type: choice
        options: [integration, production]

# Raised per job, never for the whole workflow: the build job runs `bun install` and
# third-party build code, and needs no write access to the repository at all.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: darwin-x64
            os: macos-latest
          - target: darwin-arm64
            os: macos-latest
          - target: windows-x64
            os: windows-latest
          - target: windows-arm64
            os: windows-latest
          - target: linux-musl-x64
            os: ubuntu-latest
          - target: linux-musl-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # minting the attestation
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # bun comes from npm, not from `oven-sh/setup-bun`: this repository's action
      # policy allows GitHub-owned actions plus org patterns, and a workflow that
      # names anything else never starts (startup_failure, no logs). Node is on every
      # hosted runner, and the registry pins the version's integrity itself.
      - run: npm install -g bun@1.4.2
      - run: bun install --frozen-lockfile
      # build.ts names the artifact after the target (dist/ai-eng-<target>): eight
      # legs writing dist/ai-eng collide on the release page, where asset names must
      # be unique — and the client's CI downloads one of them by name.
      - run: bun run build --target "bun-$TARGET"
        shell: bash # Windows runners default to pwsh, where $TARGET is not a shell variable
        env:
          TARGET: ${{ matrix.target }}
      - name: Codesign macOS binary (Gatekeeper) — skips without the cert secret
        if: runner.os == 'macOS'
        run: |
          if [ -z "$MACOS_CERT" ]; then
            echo "::warning::MACOS_CERT not set — macOS binary unsigned (fine for local/CI dev; ad-hoc only)"
            exit 0
          fi
          echo "$MACOS_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" run.keychain
          security default-keychain -s run.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" run.keychain
          security import "$RUNNER_TEMP/cert.p12" -k run.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" run.keychain
          codesign --force --options runtime --timestamp --keychain run.keychain --sign "$MACOS_CERT_ID" "dist/ai-eng-$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_CERT_ID: ${{ secrets.MACOS_CERT_ID }}
      # The v1 line shipped a build-provenance attestation and verified it inside the
      # release. The v2 path had lost it: the binaries travelled with a checksum and
      # nothing that says who built them, from which commit. This is that property.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # the glob carries the extension Windows adds (ai-eng-windows-x64.exe):
          # a bare path there was "Could not find subject at path dist/ai-eng-windows-x64"
          subject-path: dist/ai-eng-${{ matrix.target }}*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-eng-${{ matrix.target }}
          path: dist/ai-eng-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers live on this environment (Settings → Environments): the job
    # waits for an approval, and the environment's secrets are not exposed while it
    # waits. One click is the press; everything else here is mechanical.
    environment: release
    permissions:
      contents: write # creating the release
      id-token: write # the attestations and the npm trusted publish
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npm install -g bun@1.4.2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist-artifacts

      - name: Resolve the version — and what it means
        id: flags
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          flags="$(bun scripts/release-flags.ts "$version")"
          tag="$(printf '%s\n' "$flags" | sed -n 's/^tag=//p')"
          prerelease="$(printf '%s\n' "$flags" | sed -n 's/^prerelease=//p')"
          # The version decides what it is; the channel declares what we mean. They have
          # to agree, or the run stops before publishing anything. (The values are read
          # from the command, not from this step's own outputs: GitHub resolves
          # `steps.<id>.outputs` before the step runs, so those would be empty here.)
          if [ "$CHANNEL" = "integration" ] && [ "$prerelease" != "true" ]; then
            echo "::error::$version is a final version — integration ships candidates. Use channel=production, or let changesets cut a prerelease."
            exit 1
          fi
          if [ "$CHANNEL" = "production" ] && [ "$prerelease" = "true" ]; then
            echo "::error::$version is a prerelease — production ships final versions. Use channel=integration."
            exit 1
          fi
          { echo "tag=$tag"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL · version=$version · tag=$tag · prerelease=$prerelease"

      - name: The released revision must be on main
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not an ancestor of main — a deployment ships reviewed history, or nothing."
            exit 1
          fi

      - name: SBOM (CycloneDX, pinned by version + sha256)
        run: |
          set -euo pipefail
          ver=v13.1.0
          base="https://github.com/cdxgen/cdxgen/releases/download/${ver}"
          curl -sSfL -o cdxgen "$base/cdxgen-linux-amd64"
          echo "b9575914c36e601296d75f322123643b2531251235159f51578b507da6d9931f  cdxgen" | sha256sum -c -
          chmod +x cdxgen
          ./cdxgen -o sbom.json .

      - name: Checksums (the client's CI verifies the binary against this file)
        run: |
          set -euo pipefail
          (cd dist-artifacts && find . -type f -name 'ai-eng-*' ! -name '*.map' -exec sha256sum {} \; | sed 's|\./ai-eng-[^/]*/||' | sort -k2) > CHECKSUMS-SHA256.txt
          sha256sum sbom.json >> CHECKSUMS-SHA256.txt
          cat CHECKSUMS-SHA256.txt

      # Attesting the checksums file attests every subject it names — the eight
      # binaries AND sbom.json. Without this, the pair (checksums + SBOM) could be
      # swapped together: the digests are what the verification below believes.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: CHECKSUMS-SHA256.txt

      # The proof the v1 release carried: verification runs here, in the release, and
      # its log ships as an asset — a claim of provenance nobody verified is a slogan.
      - name: Verify the provenance of every binary about to be published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-artifacts -type f -name 'ai-eng-*' ! -name '*.map')
          : > attestation-verify.log
          for file in "${files[@]}"; do
            {
              echo "## gh attestation verify $(basename "$file")"
              # --repo alone accepts an attestation minted by any workflow on any tag
              # of this repository (audit SC-01); the signer and the ref are the claim.
              if gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
                   --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                   --source-ref "$GITHUB_REF" --deny-self-hosted-runners >/dev/null 2>&1; then
                echo "Result: PASS (exit 0)"
              else
                echo "Result: FAIL"
                exit 1
              fi
            } | tee -a attestation-verify.log
          done

      # The registry first: an npm version cannot be rewritten, a release's assets can
      # be re-uploaded by hand. The one-way door goes first so a failure here leaves
      # nothing half-published that a human has to unpick.
      - name: Publish to npm (the registry channel)
        env:
          TAG: ${{ steps.flags.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          # trusted publishing needs npm >= 11.5.1 and the runner ships an older one;
          # unprivileged and pinned, because installing over /usr/local needs root.
          npm install -g npm@11.19.1 --prefix "$HOME/.local"
          export PATH="$HOME/.local/bin:$PATH"
          if [ "$CHANNEL" = "production" ]; then dist_tag=latest; else dist_tag=next; fi
          npm publish --provenance --tag "$dist_tag"
          {
            echo "npm publish completed (OIDC trusted publishing)"
            echo "Package: ai-engineering@$(node -p 'require("./package.json").version')"
            echo "dist-tag: $dist_tag"
            echo "CI run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | tee publish-proof.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.flags.outputs.tag }}
          PRERELEASE: ${{ steps.flags.outputs.prerelease }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-artifacts -type f -name 'ai-eng-*' ! -name '*.map')
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already published and its assets are append-only — cut a new version instead of re-pointing a released one."
            exit 1
          fi
          # A tag that already exists must name THIS commit: attaching assets built
          # here to a tag pointing elsewhere is the release-integrity gap the audit
          # left open once the ancestry guard was in place (SC-02).
          ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if existing="$(gh api "$ref" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$(gh api "$ref" --jq '.object.type')" = "tag" ]; then
              existing="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$existing" --jq '.object.sha')"
            fi
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already exists at $existing, not at $GITHUB_SHA — refusing to attach assets to a tag that names another commit."
              exit 1
            fi
          fi
          # Immutable releases lock the assets when the release is published, so the
          # documented order is the one used here: draft → attach everything → publish.
          # A half-attached release is not a state anyone can finish by hand.
          gh release create "$TAG" --draft --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          gh release upload "$TAG" "${files[@]}" CHECKSUMS-SHA256.txt sbom.json attestation-verify.log publish-proof.txt
          published_flags=()
          if [ "$PRERELEASE" = "true" ]; then published_flags+=(--prerelease); fi
          gh release edit "$TAG" --draft=false "${published_flags[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-proof
          path: publish-proof.txt
