name: Worktree Fast (Second)

# Spec-101 G-12 — second-worktree install + commit MUST complete in <= 30s
# wall-clock when `python_env.mode: uv-tool` (D-101-12) because Python tools
# live in `~/.local/share/uv/tools/` instead of a per-cwd `.venv/`.
#
# Scope:
#   - ubuntu-latest only this iteration. Windows worktree variance is
#     explicitly out-of-scope per the spec — `UV_PROJECT_ENVIRONMENT`
#     path-separator handling needs a dedicated investigation tracked in
#     plan.md "Out-of-scope".
#
# Trigger surface mirrors install-time-budget.yml:
#   - nightly schedule
#   - workflow_dispatch
#   - PR labelled `perf`
# Median-of-3 absorbs runner-load jitter.

on:
  schedule:
    - cron: "30 3 * * *"  # 03:30 UTC — staggered after time-budget
  workflow_dispatch: {}
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worktree-fast-second-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-perf-label:
    name: Guard perf trigger
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      eligible: ${{ steps.decide.outputs.eligible }}
    steps:
      - id: decide
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.label.name }}" == "perf" ]]; then
              echo "eligible=true" >> "$GITHUB_OUTPUT"
            else
              echo "eligible=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

  worktree-fast:
    name: Worktree Fast Second (ubuntu)
    needs: guard-perf-label
    if: needs.guard-perf-label.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      AIENG_TEST: "1"
      FIXTURE_DIR: tests/fixtures/worktree-fast/python-multi-worktree
      BUDGET_SECONDS: "30"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-env
        with:
          sync: "false"

      - name: Configure git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"

      - name: Build and install ai-eng
        run: |
          uv build
          python -m venv .smoke-venv
          . .smoke-venv/bin/activate
          pip install dist/*.whl
          which ai-eng

      # Provision the fixture's baseline prereq binaries the G-12 "clean
      # machine with prereqs" scenario assumes. ai-eng's installer has no real
      # network mechanism to fetch gitleaks (see install-smoke.yml), and
      # semgrep ships as a Python package; without them `ai-eng install` exits
      # 80 on unresolved tool gaps before it can wire the post-install gate.
      #
      # CRITICAL (ARC-268): the fixture manifest sets `python_env.mode: uv-tool`,
      # so the installer's verify guard (D-101-02 user-scope allowlist) ONLY
      # accepts tools resolved under a user-scope prefix (~/.local, the uv tools
      # dir, ...). Binaries in /usr/local/bin or /usr/bin (jq is prebaked there)
      # raise UserScopeViolation at verify time and are counted MISSING even
      # though they are on PATH -- the real cause of the never-green exit 80.
      # Install gitleaks AND jq into ~/.local/bin and put it ahead on PATH so
      # the verify guard accepts them. semgrep flows through uv-tool user-scope
      # already. Provisioned outside the timed loop so the G-12 budget is
      # unaffected.
      - name: Install prereq binaries (gitleaks + jq + semgrep)
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" gitleaks
          chmod +x "$HOME/.local/bin/gitleaks"
          "$HOME/.local/bin/gitleaks" version
          # jq is prebaked at /usr/bin/jq (outside the user-scope allowlist);
          # copy it into ~/.local/bin so it resolves user-scoped for verify.
          install -m 0755 "$(command -v jq)" "$HOME/.local/bin/jq"
          "$HOME/.local/bin/jq" --version
          python -m pip install --quiet semgrep
          semgrep --version

      - name: Stage primary worktree
        run: |
          . .smoke-venv/bin/activate
          mkdir -p primary
          cp -R "$FIXTURE_DIR"/. primary/
          (cd primary && git init -b main && git add -A && git commit -m "fixture init" --allow-empty)
          # Prime: install once so the user-global tool cache
          # (~/.local/share/uv/tools/) is hot for subsequent worktrees.
          (cd primary && ai-eng install . --non-interactive)

      # T-4.8: median-of-3 second-worktree wall-clock. Each iteration adds a
      # fresh worktree, runs install + smoke commit, and removes it.
      - name: T-4.8 median-of-3 second-worktree install + commit
        run: |
          . .smoke-venv/bin/activate
          declare -a TIMINGS
          for run in 1 2 3; do
            WT_PATH="../wt-$run"
            rm -rf "$WT_PATH"
            (cd primary && git worktree prune)
            START=$(date +%s)
            (cd primary && git worktree add "$WT_PATH")
            (cd "primary/$WT_PATH" && ai-eng install . --non-interactive)
            (cd "primary/$WT_PATH" && git commit --allow-empty -m "chore: smoke commit")
            END=$(date +%s)
            ELAPSED=$((END - START))
            echo "Worktree run $run: ${ELAPSED}s"
            TIMINGS+=("$ELAPSED")
            (cd primary && { git worktree remove --force "$WT_PATH" || true; })
          done
          SORTED=$(printf '%s\n' "${TIMINGS[@]}" | sort -n)
          MEDIAN=$(printf '%s\n' "$SORTED" | sed -n '2p')
          echo "Median: ${MEDIAN}s (budget: ${BUDGET_SECONDS}s)"
          echo "MEDIAN_SECONDS=${MEDIAN}" >> "$GITHUB_ENV"
          if [ "$MEDIAN" -gt "$BUDGET_SECONDS" ]; then
            echo "G-12 budget violated: median ${MEDIAN}s > ${BUDGET_SECONDS}s"
            exit 1
          fi

      - name: Record timing artifact
        if: always()
        run: |
          mkdir -p timing-artifacts
          {
            echo "os=ubuntu-latest"
            echo "median_seconds=${MEDIAN_SECONDS:-unknown}"
            echo "budget_seconds=${BUDGET_SECONDS}"
            echo "mode=uv-tool"
            echo "trigger=${{ github.event_name }}"
            echo "ref=${{ github.sha }}"
          } > "timing-artifacts/g12-ubuntu.txt"

      - name: Upload timing artifact (7-day)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worktree-fast-second-ubuntu
          path: timing-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  worktree-fast-second:
    name: worktree-fast-second
    needs: [worktree-fast]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate worktree-fast result
        run: |
          if [[ "${{ needs.worktree-fast.result }}" == "skipped" ]]; then
            echo "Worktree-fast guard suppressed run (no perf trigger)"
            exit 0
          fi
          if [[ "${{ needs.worktree-fast.result }}" != "success" ]]; then
            echo "Worktree-fast failed: ${{ needs.worktree-fast.result }}"
            exit 1
          fi
          echo "Worktree-fast within G-12 (30s median)"
