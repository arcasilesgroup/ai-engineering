name: planted-e2e
# The pipeline we plant, exercised on every push and PR against the binary built from
# this commit — the channel is *ephemeral on purpose*: an Actions artifact dies with
# the run (7 days at most) and needs a token to download, so no client can pin it.
# Clients pin the release; this proves the release's payload before it exists (§17).
# It exists because the planted workflow had never been run by anyone: it installed a
# package that is not on npm and named a trivy ref that does not exist.
on: [push, pull_request]

jobs:
  planted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Build the binary the client would download
        run: bun run build
      - name: Prove the planted pipeline — templates/ci.yml.tpl, machine side, workflow, fail-closed gate, pins
        env:
          AI_ENG_BIN: "bun dist/ai-eng"
        run: sh scripts/proof-planted-ci.sh templates/ci.yml.tpl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: planted-ci-binary
          path: dist/ai-eng
          retention-days: 7
