# The whole tree, on a clock, because it does not fit in a pull request.
#
# Measured on 2026-08-16: 20,816 mutants, 121 minutes on a developer machine, against a job
# capped at 30. So the lane inside `check.yml` never finished, never printed a score, and was
# reported as `cancelled` on every commit for weeks — a required gate whose output nobody had
# ever seen. Raising the cap there would put two hours on every push; running it here puts it
# on a clock instead, and the pull request runs over its own diff against this run's receipt.
#
# This job blocks nothing. It is not in `CI Result`'s needs and it is not a required check,
# and that is deliberate: measured on 2026-08-17 over 21,960 mutants, the whole-tree score is
# 72% against a floor of 89, so making it blocking would mean nothing merges until roughly
# 3,700 more mutants are killed. What it owes is a number, published on a schedule, that
# somebody can act on — and, since that run, the names behind the number as well.
#
# The floor stays at 89. That was decided by the owner on 2026-08-17 in those words: the
# tests get better, the number does not come down.
name: mutation nightly

on:
  schedule:
    # 03:20 UTC. Not on the hour: every scheduled workflow on the platform is, and a queue
    # that deep delays a two-hour job by more than the twenty minutes this offset costs.
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Only so a failing run can open the issue that says so. A nightly that fails at 03:20 and
  # blocks nothing is a nightly nobody reads, and the narrowest way to fix that is to let it
  # go and find a person. Nothing else here writes.
  issues: write

concurrency:
  # Never cancel-in-progress. This job is two hours long and its whole purpose is to finish;
  # a second trigger must wait rather than kill the run that is most of the way through.
  group: mutation-nightly
  cancel-in-progress: false

env:
  JUST_VERSION: "1.58.0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  whole-tree:
    runs-on: ubuntu-latest
    # 121 minutes measured locally; a runner is slower and the cap has to survive that
    # without becoming the thing that decides the answer. If this starts timing out, the
    # number to raise is here and the reason is that the tree grew, which is worth knowing.
    timeout-minutes: 240
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - name: install gitleaks and just
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/
          uv tool install "rust-just==${JUST_VERSION}"

      # Before breaking the product on purpose, find out whether the document that says
      # what the product proves is still true. `docs/requirements.toml` names a command
      # beside every requirement it calls proven and the suite only ever checked that the
      # command was long enough to be a command. This runs them. It belongs on the nightly
      # rather than in `just check` because it is two hundred and twenty-two subprocesses,
      # and it belongs before the mutation run because a false verdict in the answer key
      # makes every number after it a measurement of the wrong tree.
      - name: run the answer key
        run: uv run python tests/ledger_run.py

      # `PO-12` asks that a commit's focal test fail before the change and pass after it.
      # This is that, over the whole branch: the parent's product under the commit's own new
      # tests. It does not block, because a branch cut from a shallow fetch has no parents to
      # check out, and a job that reports nothing is worse than one that reports a skip.
      - name: every new test, against the code from before it
        run: uv run python tests/red_then_green.py --since origin/main || true

      # `|| true`, and the score is read from the log rather than from the exit code. The run
      # failing its floor is the expected state today and it still has to publish the number:
      # a job that exits before printing is exactly the shape this whole change is undoing.
      - name: break it on purpose, over everything
        run: just mutate | tee "$RUNNER_TEMP/mutate.log" || true

      - name: it has to prove it ran over everything
        run: uv run python tests/anti_theatre.py "$RUNNER_TEMP/mutate.log" . mutants

      - name: say the score out loud
        run: |
          grep -E "killed=|RAN mutants=" "$RUNNER_TEMP/mutate.log" | tail -2 >> "$GITHUB_STEP_SUMMARY"

      # The score says how much is unproven; only the names say what. The justfile makes this
      # argument for the local recipe and writes both files out beside the tree — and then
      # this job threw them away, so the 21,960-mutant run of 2026-08-17 published "72%" and
      # nothing at all about which defects nobody would notice. Learning that cost another
      # full run, which is one hour and forty-six minutes of somebody's day.
      #
      # `if: always()`, because the run that fails its floor is exactly the run whose names
      # are worth having, and `if-no-files-found: warn` so a run that died before mutmut
      # wrote anything says so instead of failing a second time for a missing file.
      - name: keep the names, not only the number
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-survivors
          path: |
            mutants-survivors.txt
            mutants-stats.json
          if-no-files-found: warn
          retention-days: 30

      # A nightly that fails at 03:20 is a nightly nobody reads. This is the whole reason the
      # run exists — it blocks nothing, so the only way its answer reaches a person is if it
      # goes and finds one. One issue, reopened rather than duplicated, so a fortnight of
      # failures is one conversation and not fourteen.
      - name: if this run failed, open the issue that says so
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The whole-tree mutation run is failing"
          # The label before anything that names it. `gh issue create --label mutation` fails
          # outright when the label is absent, and it was: the first real failure of this
          # workflow ran this step, could not open the issue, and left the run red with
          # nobody told — the alarm silent in exactly the case it exists for. `--force` so a
          # repository that already has it is untouched, and so a consumer's fresh clone gets
          # one without a manual step.
          gh label create mutation --color B60205 --force \
            --description "the whole-tree mutation run needs a person" || true
          existing=$(gh issue list --state all --label mutation --json number --jq ".[0].number" \
            2>/dev/null || true)
          body="The scheduled whole-tree mutation run did not complete.
          ${RUN_URL}
          The scoped lane inside a pull request stands on this run: when a diff is too wide
          to measure inside the pull request, check.yml requires a whole-tree receipt no
          older than four days. A receipt is a run that finished, passing or not, so this
          failure does not by itself stop a merge — what stops one is nobody running the
          whole tree at all. This issue is the part that asks for a person."
          if [ -n "$existing" ]; then
            gh issue reopen "$existing" 2>/dev/null || true
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label mutation --body "$body"
          fi
