name: Weekly Maintenance

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    name: Maintenance Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-env
        with:
          fetch-depth: "0"
      - name: Run maintenance
        run: uv run ai-eng maintenance all
