name: mutation
# The mutation tier (§17.1) — it asks whether the core's own tests would notice a guard
# that stopped denying. Off the fast path by construction: nightly, on demand, and on a
# pull request that touches the governance core. Never on an ordinary push.
#
# Every action is GitHub-owned and pinned by SHA: a tag is mutable, a SHA is not.
on:
  schedule:
    # 03:17 UTC — off-peak and fixed, the way scheduled runs should be. Nobody waits.
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/guards/**"
      - "src/chain/**"
      - "src/floor/**"

permissions:
  contents: read

jobs:
  # Two legs, one body: the nightly runs on schedule/dispatch; the pr leg runs on
  # pull requests. Split to avoid an actionlint false-positive on matrix.leg in a
  # job-level if (actionlint doesn't support it; GitHub Actions does).
  campaign:
    runs-on: ubuntu-latest
    # The hard ceiling, not the estimate. Measured: this campaign took 4m29s on the
    # first real run of the job (59.72% of 1,946 mutants, cold cache, ubuntu-latest)
    # and 11m21s at `concurrency: 2` on the 8-core laptop that built the tier. The
    # ceiling covers the slower of the two, with room for the plugin's known flake (one
    # spurious dry-run failure in seven when the machine is loaded).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bun
        run: npm install -g bun@1.4.2
      - name: Dependencies
        run: bun install --frozen-lockfile
      - name: Node the campaign runs on
        run: node -v
      - name: Restore the previous campaign's results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports
          key: stryker-incremental-${{ hashFiles('bun.lock') }}
          restore-keys: stryker-incremental-
      # The exit code IS the gate: below thresholds.break the step fails and the
      # clear-text report names the survivors. Nothing here re-reads the report to
      # decide — a gate that parses its own output is a gate that can be wrong twice.
      - name: Mutation campaign
        run: bunx stryker run
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/
          if-no-files-found: error

  campaign-pr:
    # Only runs on pull requests that touch governance files.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bun
        run: npm install -g bun@1.4.2
      - name: Dependencies
        run: bun install --frozen-lockfile
      - name: Node the campaign runs on
        run: node -v
      # Name the diff the campaign was routed on, and fail hard when it
      # cannot be computed — a shallow checkout once made the sibling job in check.yml
      # spend its life reporting "oracle skipped" instead of failing.
      - name: The governance files this pull request touches
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if ! CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" -- src/guards src/chain src/floor); then
            echo "::error::cannot compute the diff against origin/$BASE_REF — the campaign would have no verdict to give, so it does not start."
            exit 1
          fi
          printf 'governance files in this pull request:\n%s\n' "$CHANGED"
      - name: Restore the previous campaign's results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports
          key: stryker-incremental-${{ hashFiles('bun.lock') }}
          restore-keys: stryker-incremental-
      - name: Mutation campaign
        run: bunx stryker run
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-pr
          path: reports/
          if-no-files-found: error

