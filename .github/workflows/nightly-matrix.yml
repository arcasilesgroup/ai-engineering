name: Nightly Matrix (advisory)

# spec-140 W2 D-140-03: full 3-python x 3-OS matrix moved off the PR
# hot path and into a nightly advisory sweep. PRs run 3.12 only
# (`ci-check.yml`); the full Python-version coverage signal lives here.
#
# This workflow is ADVISORY — `continue-on-error: true` per matrix cell
# means cell failures surface in the run summary but do NOT block any
# PR or push. Failures triage on the morning sweep, not on the merge
# queue.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily — quiet hours before US morning
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-matrix:
    name: Nightly Matrix (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows cells legitimately run the full unit+integration suite in ~29min
    # (2x ubuntu; no compiled-wheel cache parity). A 30min cap cancelled the
    # slowest Windows cell mid-run every night, and a *cancelled* job forces the
    # whole run's conclusion to `cancelled` even under continue-on-error — which
    # masked the real advisory signal. 45min leaves headroom without hiding a
    # genuine hang (GitHub's hard job ceiling is 6h).
    timeout-minutes: 45
    # spec-140 W2 D-140-03: advisory only — cell failures do not block.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: Configure git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"
      - name: Run unit + integration tests (advisory)
        # No `-x`: `-x` is `--maxfail=1` and silently overrode `--maxfail=3`,
        # aborting the sweep at the first failing test and hiding every later
        # cell result. Let the intended 3-failure budget stand so one flaky
        # cell no longer masks real regressions elsewhere in the suite.
        run: |
          uv run pytest tests/unit tests/integration -q --maxfail=3

  reachability-audit:
    name: Pinned-SHA reachability audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # spec-152 T-37 (D-152-06): off the PR hot path. Resolves every pinned
    # action SHA via `git ls-remote` and fails (exit 1) on a shaped-but-
    # unreachable ref — the audit found `label-sync` pinned to an annotated-tag
    # object that was never a published ref tip. Advisory here (continue-on-
    # error) so an upstream retag/outage surfaces on the morning sweep without
    # blocking a merge; the PR hot path stays regex-only.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env
      - name: Check pinned-SHA reachability
        run: uv run python scripts/check_workflow_policy.py --check-reachability
