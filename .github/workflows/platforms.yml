name: platforms
# The compiled binary is another artifact than the TS — only the e2e knows (§17).
on:
  push:
    branches: [main]
    # A release tag runs the cross-OS matrix on the exact revision release.yml's
    # ci-gate demands — the tag cannot ship code its own SHA never saw on Windows.
    tags: ['v*']
  pull_request:

# One matrix at a time per ref: a pushed-over PR run is dead weight. On main nothing
# is cancelled — every result a branch reaches is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  init-doctor-uninstall:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bun comes from npm, not from `oven-sh/setup-bun`: this repository's action
      # policy allows GitHub-owned actions plus nine org patterns, and a workflow that
      # names anything else never starts (startup_failure, no logs). Node is on every
      # hosted runner, and the registry pins the version's integrity itself.
      - run: npm install -g bun@1.4.4
      - run: bun install --frozen-lockfile
      - name: Tested revision (${{ matrix.os }})
        shell: bash
        run: git rev-parse HEAD
      # Before the build, so no test can lean on a dist/ left behind by a later step.
      # I76 is flaky on windows-latest CI (failed on 977ecfdb, passed on the next push
      # — run 42825538084): one retry there, none elsewhere, until the test itself
      # accepts that Windows may refuse to create the symlink it wants.
      - name: Full serial suite on ${{ matrix.os }}
        if: runner.os != 'Windows'
        shell: bash
        run: bun test --parallel=1
      - name: Full serial suite on ${{ matrix.os }} (one retry — I76)
        if: runner.os == 'Windows'
        shell: bash
        run: bun test --parallel=1 --retry 1
      - name: Build the real binary
        run: bun run build
      # The demo lives outside the checkout: a folder inside this governed repository is
      # governed by it (the outermost governed ancestor wins), so doctor would judge
      # ai-engineering itself instead of the bare folder.
      - name: init --yes on a bare folder (§18 H2 acceptance)
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/demo" && cd "$RUNNER_TEMP/demo"
          "$GITHUB_WORKSPACE/dist/ai-eng" init --yes --surface claude-code
          test -f AGENTS.md
          test -f .ai-engineering/ai-eng.lock
          # Claude Code's carrier is machine-scope now: it reads the user file, and a
          # repo copy would be a path the host never loads (docs/global-carriers.md).
          test -f "$HOME/.claude/settings.json"
      - name: doctor responds (chain test inside)
        shell: bash
        run: cd "$RUNNER_TEMP/demo" && "$GITHUB_WORKSPACE/dist/ai-eng" doctor
      - name: uninstall keeps the user's files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/demo"
          echo "" | "$GITHUB_WORKSPACE/dist/ai-eng" uninstall
          test -f AGENTS.md && test -f DECISIONS.md
          echo "uninstall left the contract files in place"
